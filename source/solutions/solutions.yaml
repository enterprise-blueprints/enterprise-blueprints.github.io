# Solutions, in the order the pages show them, each with the links it holds.

- id: agency-shared-platform
  title: Agency Shared Platform
  description: "An example solution: the OIG, the FOIA office, the grants office, and the contracting office all track their work on the agency’s shared case platform, each with its own case types and its own administration. The OIG adds a confidential hotline and audit management, the FOIA office adds a review tool, eDiscovery search, and the national portal, the grants office connects the platform to Grants.gov, ASAP.gov, and USAspending.gov, the contracting office adds a proposal portal and connections to SAM.gov, IPP, and CPARS, and everyone signs in the same way."
  attributes:
    fitsWhen:
      - The agency’s platform team can support several offices
      - Keeping licenses, skills, and security approvals in one place matters more than a close fit for each office
      - The offices’ work is fairly standard
    watchFor:
      - The OIG’s independence depends on keeping its administration and access apart from the agency’s
      - FOIA’s working-day deadlines, the OIG’s evidence handling, grants’ merit review and recipient portal, and contracting’s clauses and SAM.gov reporting need building on the platform
      - One platform’s upgrades and outages affect every office at once
  includes:
    - to: agency-sign-on
      note: Every system signs in through it.
    - to: shared-case-platform
      note: The one platform every office tracks its work on, with the OIG’s administration kept apart.
    - to: confidential-hotline-intake
      note: Feeds the OIG’s intake queue on the platform.
    - to: shared-recommendation-tracker
      note: Built on the same platform, with agency officials given limited access.
    - to: audit-management-system
      note: A product of its own, since work papers need more than case tracking.
    - to: oversight-reporting-from-source-data
      note: Draws on the platform and the audit product.
    - to: foia-tracking-with-review-tool
      note: FOIA tracking on the platform, with a separate review tool.
    - to: ediscovery-search-review
      note: For requests that ask for email.
    - to: national-portal-api
      note: Delivers portal requests into the platform.
    - to: foia-library-publishing
      note: Publishes releases from the review tool.
    - to: records-aware-collaboration
      note: Where staff in every office draft and collaborate, with records and sensitivity labels applied.
    - to: letters-from-case-data
      note: Built on the shared platform, so letters come from the same case data.
    - to: grants-on-shared-platform
      note: The grants office’s applications and awards, as their own case types on the platform.
    - to: grants-gov-system-to-system
      note: Posts opportunities and brings applications onto the platform.
    - to: payments-through-asap
      note: Recipients draw funds through Treasury, against accounts set up from each award.
    - to: award-data-to-usaspending
      note: Built on the platform’s award records, since the platform doesn’t report on its own.
    - to: agency-security-monitoring
      note: Every office’s systems send their logs to the agency, with the OIG’s searchable only by staff it agrees to.
    - to: acquisition-on-shared-platform
      note: The contracting office’s requests and contracts, as their own case types on the platform.
    - to: vendor-proposal-portal
      note: Built on the platform’s portal, so offers land with the solicitation they answer.
    - to: contract-data-to-sam
      note: Built from the platform’s contract records, since the platform doesn’t report to SAM.gov on its own.
    - to: invoices-through-ipp
      note: Vendors invoice through Treasury, and acceptance is routed to the program office on the platform.
    - to: cpars-from-contract-data
      note: Contracts registered in CPARS from the platform’s records.
    - to: sam-gov-entity-checks
      note: Built once on the platform, for grants applicants and offerors alike.
    - to: acquisition-ai-drafting
      note: Drafts that program offices and contracting staff start from, using the agency’s templates.
  supports: [ independent-government-oversight, public-access-to-agency-records, awarding-overseeing-federal-grants, acquiring-goods-and-services ]

- id: purpose-built-systems
  title: Purpose-Built Systems for Each Office
  description: "An example solution: the OIG, the FOIA office, the grants office, and the contracting office each run a product made for their work, and share only the agency’s sign-on. Each product brings its own intake, reporting, and publishing, so each office can change its own system on its own schedule."
  attributes:
    fitsWhen:
      - The offices’ work is specialized, such as investigations with evidence, high volumes of FOIA requests, many grant programs, or a large contracting workload
      - The OIG needs a system the agency doesn’t administer
      - There’s budget for more than one product, and administrators in each office
    watchFor:
      - More products to buy, secure, and keep up
      - Reporting across offices means pulling from several systems
      - Each product’s data needs its own records schedule and exports
  includes:
    - to: agency-sign-on
      note: The one thing the offices share.
    - to: oversight-intake-case-tracking
      note: The OIG’s system for intake and investigations.
    - to: confidential-hotline-intake
      note: Often part of the oversight case product.
    - to: audit-management-system
      note: The OIG’s system for audits, inspections, and evaluations.
    - to: shared-recommendation-tracker
      note: Can be a module of the audit product.
    - to: oversight-reporting-from-source-data
      note: Draws on the case and audit products.
    - to: foia-request-processing
      note: The FOIA office’s system, from request to release.
    - to: national-portal-api
      note: Delivers portal requests into the FOIA product.
    - to: ediscovery-search-review
      note: For large email collections the FOIA product can’t handle well.
    - to: foia-library-publishing
      note: Often part of the FOIA product.
    - to: records-aware-collaboration
      note: The agency’s workspace for drafting and collaboration, outside each office’s product.
    - to: grants-management-product
      note: The grants office’s system, from announcement to closeout, with its own recipient portal.
    - to: grants-gov-system-to-system
      note: The grants product’s connection to Grants.gov.
    - to: payments-through-asap
      note: Fed from the grants product’s awards.
    - to: grant-risk-analytics
      note: Risk scores shown in the grants product, from SAM.gov, audits, and drawdowns.
    - to: built-in-audit-trails
      note: Each office reviews its own product’s audit trail, so no office’s activity leaves its system.
    - to: contract-writing-system
      note: The contracting office’s system, from request to closeout.
    - to: vendor-proposal-portal
      note: Often part of the contract writing product.
    - to: contract-data-to-sam
      note: The contract writing product’s connection to SAM.gov.
    - to: invoices-through-ipp
      note: Fed from the contract writing product’s awards.
    - to: cpars-from-contract-data
      note: Contracts registered in CPARS from the contract writing product.
    - to: sam-gov-entity-checks
      note: Used by both the grants product and the contract writing product, so the checks are the same.
    - to: contract-spend-analytics
      note: Brings the contract writing product’s data together with spending and invoices.
  supports: [ independent-government-oversight, public-access-to-agency-records, awarding-overseeing-federal-grants, acquiring-goods-and-services ]

- id: dedicated-oversight-shared-foia
  title: Dedicated Oversight System, Shared Services for the Other Offices
  description: "An example solution: the OIG runs its own oversight case product, kept apart from the agency’s systems, while the other offices share what others run. The FOIA office tracks requests on the agency’s shared platform with a separate review tool, the grants office uses a grants system another federal agency runs as a shared service, and another agency’s contracting office awards and administers the agency’s contracts. Everyone signs in through the agency."
  attributes:
    fitsWhen:
      - The OIG’s independence calls for its own system, but the FOIA office is well served by the agency’s platform
      - The agency’s grant programs are few or small enough for a shared service
      - The agency makes too few acquisitions to keep its own contracting staff and systems for every kind
      - The agency wants to limit the number of products without putting the OIG on a shared system
    watchFor:
      - Four ways of tracking work, two of them run by other agencies
      - The FOIA office depends on the platform team for changes, such as new deadline rules, and the grants and contracting offices on their providers’ priorities
      - Providers’ fees add to the cost of each award
  includes:
    - to: agency-sign-on
      note: Every office signs in through it.
    - to: oversight-intake-case-tracking
      note: The OIG’s own system, administered by the OIG.
    - to: confidential-hotline-intake
      note: Feeds the OIG’s case product.
    - to: audit-management-system
      note: The OIG’s system for audits, inspections, and evaluations.
    - to: shared-recommendation-tracker
      note: Owned by the OIG, with agency officials given limited access.
    - to: oversight-reporting-from-source-data
      note: Draws on the OIG’s systems.
    - to: shared-case-platform
      note: Where the FOIA office tracks requests.
    - to: foia-tracking-with-review-tool
      note: FOIA tracking on the platform, with a separate review tool.
    - to: national-portal-api
      note: Delivers portal requests into the platform.
    - to: ediscovery-search-review
      note: For requests that ask for email.
    - to: foia-library-publishing
      note: Publishes releases from the review tool.
    - to: records-aware-collaboration
      note: Where staff in every office draft and collaborate, with records and sensitivity labels applied.
    - to: letters-from-case-data
      note: For the FOIA office’s letters, from the request data on the platform.
    - to: grants-shared-service
      note: The grants office’s system, run by another agency, with its own connections to Grants.gov and USAspending.gov.
    - to: payments-through-asap
      note: The shared service sets up each award’s account for drawdowns.
    - to: agency-security-monitoring
      note: The FOIA platform and the OIG’s product send their logs to the agency, with the OIG’s searchable only by staff it agrees to.
    - to: assisted-acquisition-service
      note: Another agency’s contracting office awards and administers the agency’s contracts, under an interagency agreement.
    - to: invoices-through-ipp
      note: Vendors invoice through Treasury, and the agency’s program offices accept the work.
  supports: [ independent-government-oversight, public-access-to-agency-records, awarding-overseeing-federal-grants, acquiring-goods-and-services ]
