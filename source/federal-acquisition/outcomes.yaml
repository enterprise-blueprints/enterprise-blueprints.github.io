# Outcomes, in the order the pages show them, each with the links it holds.

- id: needs-met-on-time
  title: The agency gets what it needs when it needs it
  description: Acquisitions start early enough, and move from request to award quickly enough, that the goods and services arrive when the program needs them.
  sources: [ far, palt-memo ]
  measured_by: [ procurement-lead-time ]

- id: full-open-competition
  title: Contracts are competed openly and fairly
  description: Opportunities are publicized so businesses can compete, offers are judged only on the criteria the solicitation stated, and any exception to full and open competition is one the law allows, justified in writing.
  sources: [ competition-41-usc-3301, competition-exceptions-41-usc-3304, procurement-integrity-41-usc-2102 ]
  measured_by: [ competed-obligations-share, single-offer-awards ]

- id: responsible-contractors
  title: Contracts go to responsible contractors
  description: Before each award, the agency checks the contractor isn’t excluded, reviews its integrity and performance records, and determines it able to do the work.
  sources: [ far, integrity-records-41-usc-2313, sam-gov ]
  measured_by: [ awards-with-responsibility-review ]

- id: small-business-participation
  title: Small businesses get a fair share of the work
  description: The agency finds small businesses able to do its work, sets work aside for them where the rules call for it, and meets the goals it agreed with the Small Business Administration.
  sources: [ small-business-goals-15-usc-644 ]
  measured_by: [ small-business-share ]

- id: contracts-perform-as-agreed
  title: Contractors deliver what the contract calls for
  description: Each contract is monitored against its terms, problems are raised while there’s time to fix them, and each contractor’s performance is evaluated and recorded for future source selections.
  sources: [ far, cpars ]
  measured_by: [ performance-evaluations-on-time ]

- id: invoices-paid-on-time
  title: Contractors are paid correctly and on time
  description: Invoices are checked against the contract and what was accepted, improper ones go back within 7 days with the reasons, and proper ones are paid by the due date.
  sources: [ prompt-payment-31-usc-3903, invoice-processing-platform ]
  measured_by: [ proper-invoices-paid-on-time, interest-penalties-paid ]

- id: award-decisions-hold-up
  title: Award decisions stand up to challenge
  description: Each award decision is made and documented by the solicitation’s rules, so it holds up when an offeror protests, and protests are answered on time.
  sources: [ far, protest-decisions-31-usc-3554, gao-bid-protest-rules ]
  measured_by: [ protests-sustained-or-corrected ]

- id: contract-data-public
  title: The contract spending is open to view
  description: Each contract action is reported accurately within three business days, so the public can see on USAspending.gov who the government buys from and for what.
  sources: [ far, sam-gov, usaspending ]
  measured_by: [ contract-actions-reported-on-time ]

- id: contracts-closed-on-time
  title: Contracts are closed out on time
  description: Once the work is done, each contract is closed within the time standard for its type, and money no longer needed is released while it can still be used.
  sources: [ far ]
  measured_by: [ contracts-overdue-for-closeout ]
