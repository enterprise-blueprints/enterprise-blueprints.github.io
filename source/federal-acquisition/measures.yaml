# Measures, in the order the pages show them, each with the links it holds.

- id: procurement-lead-time
  title: Procurement administrative lead time (PALT)
  description: The median number of days from the date an initial solicitation is issued to the date of award, for contracts and orders above the simplified acquisition threshold, as OFPP defines it. Many offices also track the time from a complete request package to award.
  sources: [ palt-memo, sam-gov ]

- id: competed-obligations-share
  title: Share of obligations competed
  description: The share of the year’s contract obligations that were made on competed contracts and orders, from the agency’s contract data in SAM.gov.
  sources: [ competition-41-usc-3301, sam-gov ]

- id: single-offer-awards
  title: Competitions with only one offer
  description: The share of obligations on competed contracts and orders that received only one offer, which can mean the requirement or the notice kept other businesses out.
  sources: [ sam-gov ]

- id: awards-with-responsibility-review
  title: Awards with a documented responsibility determination
  description: The share of awards above the simplified acquisition threshold whose file shows the exclusion check, the review of integrity and performance records, and the responsibility determination.
  sources: [ far, integrity-records-41-usc-2313 ]

- id: small-business-share
  title: Small business share of prime contract dollars
  description: The share of the agency’s eligible prime contract dollars awarded to small businesses, compared with the goal it agreed with the Small Business Administration. The government-wide goal is at least 23 percent.
  sources: [ small-business-goals-15-usc-644 ]

- id: performance-evaluations-on-time
  title: Performance evaluations completed on time
  description: The share of required past performance evaluations completed in CPARS within 120 days after the end of the period of performance they cover.
  sources: [ far, cpars ]

- id: proper-invoices-paid-on-time
  title: Invoices paid on time
  description: The share of proper invoices paid by their due date, which is 30 days after receipt unless the contract says otherwise.
  sources: [ prompt-payment-31-usc-3903 ]

- id: interest-penalties-paid
  title: Prompt Payment interest paid
  description: The number of late payments that carried Prompt Payment interest, and the amount paid, by office.
  sources: [ prompt-payment-31-usc-3903 ]

- id: protests-sustained-or-corrected
  title: Protests sustained or resolved by corrective action
  description: The number of protests of the agency’s awards, and the share that GAO sustained or that the agency resolved by corrective action, such as reevaluating offers.
  sources: [ protest-decisions-31-usc-3554, gao-bid-protest-rules ]

- id: contract-actions-reported-on-time
  title: Contract actions reported within three business days
  description: The share of contract action reports completed in SAM.gov within three business days after award, and how many had to be corrected later.
  sources: [ far, sam-gov ]

- id: contracts-overdue-for-closeout
  title: Contracts overdue for closeout
  description: The number of physically completed contracts still open past their closeout standard, such as 6 months for firm-fixed-price contracts, and the funds still obligated on them.
  sources: [ far ]
