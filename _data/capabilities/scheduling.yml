id: "capability:scheduling"
title: "Scheduling"
layer: "shared"
status: "draft"
responsibility: "Find availability and book, change, and cancel appointments between staff, the public, and partners."
boundaries: "It manages time and attendance; the consuming process records what an appointment was for and what happened in it."
operations:
  - name: "Schedule.findAvailability"
    description: "Find times when the required people and resources are free."
    accepts: ["participants", "duration", "time window"]
    returns: ["available times"]
  - name: "Schedule.book"
    description: "Book an appointment and invite the participants."
    accepts: ["participants", "time", "purpose", "location or channel"]
    returns: ["appointment ID"]
  - name: "Schedule.change"
    description: "Move or cancel an appointment and tell the participants."
    accepts: ["appointment ID", "change"]
    returns: ["updated appointment"]
entities: ["appointment", "person"]
policies: ["privacy", "accessibility"]
depends_on: ["notification"]
signs:
  - "Interviews and appointments are arranged over several emails."
  - "Missed appointments aren't recorded anywhere."
questions:
  - "How are interviews and appointments arranged today?"
