# Measures, in the order the pages show them, each with the links it holds.

- id: request-processing-time
  title: Time to process requests
  description: The median and average number of days to process simple, complex, and expedited requests, with the lowest and highest. Annual FOIA reports include these figures.
  sources: [ foia-statute, oip-annual-report-handbook ]

- id: requests-within-20-days
  title: Requests answered within 20 working days
  description: The share of processed requests answered within 20 working days. Annual FOIA reports group response times in 20-day bands.
  sources: [ foia-statute, oip-annual-report-handbook ]

- id: backlogged-requests
  title: Backlogged requests
  description: Requests still pending at the end of the fiscal year beyond the time the law allows, compared with the number received that year. The Department of Justice suggests keeping it below 10% of requests received.
  sources: [ oip-annual-report-handbook, oip-backlog-guidance ]

- id: oldest-pending-requests
  title: Age of the oldest pending requests
  description: How long the agency’s ten oldest pending requests and ten oldest pending appeals have been open. Annual FOIA reports list them.
  sources: [ foia-statute, oip-annual-report-handbook ]

- id: request-dispositions
  title: How requests are resolved
  description: The number of requests granted in full, granted in part, and denied, with how often each exemption was used. Annual FOIA reports include these figures.
  sources: [ foia-statute, oip-annual-report-handbook ]

- id: records-posted-proactively
  title: Records posted proactively
  description: The records made available online without a request, including frequently requested records. Annual FOIA reports count them, and Chief FOIA Officer reports describe them.
  sources: [ foia-statute, oip-chief-foia-officer-guidelines ]

- id: appeal-processing-time
  title: Time to decide appeals
  description: The median and average number of days to decide administrative appeals, against the 20 working days the law allows, and how the appeals came out. Annual FOIA reports include these figures.
  sources: [ foia-statute, oip-annual-report-handbook ]

- id: annual-report-on-time
  title: Annual FOIA report on time
  description: Whether the annual FOIA report reaches the Attorney General and OGIS by February 1, and is posted online with its raw data.
  sources: [ foia-statute ]
