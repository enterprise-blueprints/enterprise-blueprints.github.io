# Enterprise Blueprints — site configuration
#
# `baseurl` stays empty here. GitHub Actions passes the correct base path for
# the repository (for example "/my-repo" on a project site) at build time, and
# every template uses Jekyll's `relative_url` filter, so the same source works
# on a project site and on a root user/organization site.

title: Enterprise Blueprints
tagline: Build Experiences. Share Capabilities.
description: >-
  An open, vendor-neutral reference library for designing the AI-native
  enterprise: canonical building blocks composed into mission blueprints.
url: ""
baseurl: ""

# Optional. Set to the repository's GitHub URL (for example
# "https://github.com/OWNER/REPO") to show "Edit this page" links.
repository_url: ""
# Branch used for "Edit this page" links.
repository_branch: main

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

collections:
  blocks:
    output: true
    permalink: /blocks/:name/
  missions:
    output: true
    permalink: /missions/:name/
  implementations:
    output: true
    permalink: /implementations/:name/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: blocks }
    values: { layout: block }
  - scope: { path: "", type: missions }
    values: { layout: mission }
  - scope: { path: "", type: implementations }
    values: { layout: implementation }

exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSING.md
  - LICENSE-MIT.txt
  - LICENSE-CC-BY-4.0.txt
  - enterprise-blueprints-greenfield-scaffold.md
  - Gemfile
  - Gemfile.lock
  - requirements-dev.txt
  - scripts/
  - templates/
  - vendor/
  - .bundle/
  - .github/
  - .venv/
