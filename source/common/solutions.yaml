# Solutions: the ways to source each pattern, in the order the pages show them,
# each with the patterns it implements and anything it needs.

- id: shared-case-platform-platform
  title: The agency’s low-code or CRM platform
  description: The low-code or CRM platform the agency already runs, with case types, forms, queues, and permissions set up for each office.
  approach: platform
  components:
    - id: case-forms
      title: Case forms and queues
      description: Each office’s case types, forms, and work queues.
      tier: front
      exposure: internal
      sendsTo: [ case-workflows ]
      needs: [ agency-sign-on ]
    - id: case-workflows
      title: Case workflows
      description: Each office’s steps, routing, and notifications.
      tier: service
      sendsTo: [ case-data ]
    - id: case-data
      title: Case data
      description: Case records, with permissions set for each office.
      tier: data
  implements: [ shared-case-platform ]
  depends_on: [ agency-sign-on ]

- id: agency-sign-on-platform
  title: The agency’s identity provider
  description: The identity provider the agency already runs, with phishing-resistant authenticators and role groups that each system trusts.
  approach: platform
  components:
    - id: sign-in
      title: Sign-in page
      description: Where staff sign in once, with a phishing-resistant authenticator.
      tier: front
      exposure: internal
      sendsTo: [ identity-provider ]
    - id: identity-provider
      title: Identity provider
      description: Checks who someone is, and tells each system that trusts it.
      tier: service
      sendsTo: [ directory ]
    - id: directory
      title: Directory and role groups
      description: Staff accounts, and the groups each system grants access by.
      tier: data
  implements: [ agency-sign-on ]

- id: records-aware-collaboration-platform
  title: The agency’s office and collaboration suite
  description: The office suite and collaboration workspace the agency already licenses, with its retention and sensitivity labels turned on and set up.
  approach: platform
  components:
    - id: workspaces
      title: Team workspaces
      description: Sites, channels, and shared folders for each team or piece of work.
      tier: front
      exposure: internal
      sendsTo: [ labels ]
      needs: [ agency-sign-on ]
    - id: labels
      title: Retention and sensitivity labels
      description: Applied to documents and messages, by default or by hand.
      tier: service
      sendsTo: [ document-storage ]
    - id: document-storage
      title: Document storage
      tier: data
  implements: [ records-aware-collaboration ]
  depends_on: [ agency-sign-on ]

- id: letters-from-case-data-platform
  title: Templates filled from case data
  description: The document templates in the case system or office suite, filled in from a case’s fields and saved back to its file.
  approach: platform
  components:
    - id: letter-generation
      title: Letter generation
      description: Fills a template from a case’s fields, and saves the letter to its file.
      tier: service
      sendsTo: [ templates ]
    - id: templates
      title: Template library
      description: Approved letter templates, each with the case fields it uses.
      tier: data
  implements: [ letters-from-case-data ]

- id: agency-security-monitoring-platform
  title: The agency’s security monitoring
  description: The security monitoring the agency’s security operations team already runs, with the office’s systems sending it their logs.
  approach: platform
  components:
    - id: analyst-console
      title: Analyst console
      description: Where the security operations team investigates alerts.
      tier: front
      exposure: internal
      sendsTo: [ detections ]
      needs: [ agency-sign-on ]
    - id: log-collection
      title: Log collection
      description: Takes in each system’s sign-in, access, and change logs.
      tier: service
      sendsTo: [ log-storage ]
    - id: detections
      title: Detections and alerts
      description: Rules that look for misuse and raise alerts.
      tier: service
      sendsTo: [ log-storage ]
    - id: log-storage
      title: Log storage
      description: Logs kept as long as the agency’s policy says.
      tier: data
  implements: [ agency-security-monitoring ]
  depends_on: [ agency-sign-on ]

- id: built-in-audit-trails-product
  title: Each product’s built-in audit trail
  description: The audit trail each product already keeps, with its reports run on a schedule by the system’s owner.
  approach: product
  implements: [ built-in-audit-trails ]

- id: ai-assisted-intake-sorting-platform
  title: An AI model the agency approves
  description: An AI model the agency has approved, called from the intake system to suggest each new matter’s category, urgency, and route.
  approach: platform
  components:
    - id: suggestions
      title: Suggestion service
      description: Called by the intake system for each new matter, and returns a suggested category, urgency, and route.
      tier: service
      sendsTo: [ ai-model, suggestion-log ]
    - id: ai-model
      title: Approved AI model
      description: The model the agency has approved, run where its data rules allow.
      tier: service
    - id: suggestion-log
      title: Suggestion log
      description: Each suggestion and what staff decided, to check how well it does.
      tier: data
  implements: [ ai-assisted-intake-sorting ]

- id: sam-gov-entity-checks-build
  title: A connection to SAM.gov’s APIs
  description: A connection the agency builds from its award systems to SAM.gov’s APIs, run before each award and on a schedule.
  approach: build
  components:
    - id: entity-checks
      title: Entity check service
      description: Asks SAM.gov about each awardee before an award, and again on a schedule.
      tier: service
      sendsTo: [ check-results ]
    - id: check-results
      title: Check results
      description: What each check found, kept with the award.
      tier: data
  implements: [ sam-gov-entity-checks ]

- id: records-in-business-systems-built-in
  title: Each system’s own retention features
  description: Retention rules, holds, and disposal set up in each system that supports them.
  approach: product
  attributes:
    fitsWhen:
      - The office’s systems have good retention features
    watchFor:
      - Each system is set up and checked on its own
  implements: [ records-in-business-systems ]

- id: records-in-business-systems-records-service
  title: An agency records service
  description: An agency records management service that applies schedules and holds across the systems connected to it.
  approach: platform
  attributes:
    fitsWhen:
      - The agency runs a records service its systems can connect to
    watchFor:
      - Each system needs a connection, and offices must agree who can place and see holds on their records
  components:
    - id: connectors
      title: System connectors
      description: Link each business system to the records service.
      tier: service
      sendsTo: [ records-rules ]
    - id: records-rules
      title: Schedules and holds
      description: Applies retention schedules and legal holds across the connected systems.
      tier: service
      sendsTo: [ records-catalog ]
    - id: records-catalog
      title: Records catalog
      description: What’s held where, under which schedule, and when it’s due for disposal.
      tier: data
  implements: [ records-in-business-systems ]
