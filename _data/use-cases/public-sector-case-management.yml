# Machine-readable use case: its process, scenarios, and template requirements. The page at
# use-cases/public-sector-case-management.md renders it, and tools such as Solution Studio read it
# directly. See use-cases/README.md for the format.
#
# The process describes common work, not required statuses or a fixed sequence. Specialized case
# types and missions add their own activities and rules.

id: "use-case:public-sector-case-management"
title: "Public Sector Case Management"
status: "draft"
version: 1
summary: "How an organization manages a matter from an internal or external source through resolution."
related: []

personas:
  - id: "initiator"
    title: "Initiator"
    description: "Raises a matter and provides information, from inside or outside the organization."
    needs: "Clear instructions, confirmation of receipt, and updates."
  - id: "participant"
    title: "Participant"
    description: "Provides information or responds to work that affects them."
    needs: "A way to contribute and access the information they may see."
  - id: "representative"
    title: "Representative"
    description: "Acts for another participant."
    needs: "Clear authority and limits on what they may submit or receive."
  - id: "intake-staff"
    title: "Intake staff"
    description: "Records the matter, checks completeness, and directs it to the right team."
    needs: "Intake guidance and relevant case history."
  - id: "case-owner"
    title: "Case owner"
    description: "Manages the case and coordinates the work."
    needs: "Current information, tasks, responsibility, and progress."
  - id: "specialist"
    title: "Specialist or supporting team"
    description: "Assesses an issue or completes assigned work."
    needs: "A clear task and enough information to complete it."
  - id: "decision-maker"
    title: "Decision-maker or reviewer"
    description: "Makes or reviews a decision."
    needs: "Evidence, decision criteria, and a record of the reasons."
  - id: "supervisor"
    title: "Supervisor or coordinator"
    description: "Assigns cases, manages workload, and resolves delays or escalations."
    needs: "Visibility into ownership, outstanding work, and outcomes."
  - id: "records-staff"
    title: "Records or oversight staff"
    description: "Reviews the history and supports records handling."
    needs: "Reliable records and appropriate access."

phases:
  # ----------------------------------------------------------------------------------------------
  - id: "receive"
    title: "Receive"
    description: "Staff record a matter from an internal or external source."
    activities:
      - id: "receive-matter"
        title: "Receive the matter"
        description: "Record a report, request, or referral from any channel, with its source, channel, and time received. An external source may not have an account, and some matters arrive anonymously."
        actor: "intake-staff"
        participants: ["initiator", "representative"]
        produces: ["interaction"]
        uses: ["case-management", "document-management", "identity"]
      - id: "acknowledge-receipt"
        title: "Acknowledge receipt"
        description: "Confirm receipt and explain what happens next, when the initiator can be contacted."
        actor: "intake-staff"
        participants: ["initiator"]
        produces: ["interaction"]
        uses: ["notification"]
      - id: "identify-participants"
        title: "Identify the participants"
        description: "Record who is involved and in what role, matched to existing person and organization records where possible. Confirm that a representative has authority to act."
        actor: "intake-staff"
        produces: ["participant"]
        uses: ["person-information", "organization-information"]
        decision: "Does the representative have authority to act for this participant?"

  # ----------------------------------------------------------------------------------------------
  - id: "review-route"
    title: "Review and route"
    description: "Staff check responsibility, urgency, missing information, and related cases."
    activities:
      - id: "check-related"
        title: "Check for existing and related cases"
        description: "Search earlier matters, cases, and participants for the same or a related matter."
        actor: "intake-staff"
        uses: ["search", "case-management"]
        decision: "Is this a new matter, an update to an existing case, or related to one?"
      - id: "check-completeness"
        title: "Check completeness and urgency"
        description: "Decide whether the information is enough to act on, and how urgent the matter is."
        actor: "intake-staff"
        decision: "Is anything missing, and how urgent is it?"
      - id: "request-information"
        title: "Request missing information"
        description: "Ask the initiator or another party for what is missing, and record who must respond and by when."
        actor: "intake-staff"
        participants: ["initiator", "participant"]
        produces: ["task", "interaction"]
        uses: ["notification", "workflow"]
        waits: "The response to the request."
        optional: true
      - id: "route-matter"
        title: "Route the matter"
        description: "Open a case, add the matter to an existing case, refer it, or close it without action, and record the reason."
        actor: "intake-staff"
        produces: ["case", "decision"]
        uses: ["case-management", "workflow"]
        decision: "Open a case, update an existing one, refer it, or take no action?"
      - id: "refer-matter"
        title: "Refer the matter"
        description: "Send the matter to another team or organization, with the reason and what was shared."
        actor: "intake-staff"
        produces: ["interaction", "document"]
        uses: ["document-management", "notification"]
        optional: true

  # ----------------------------------------------------------------------------------------------
  - id: "assign"
    title: "Assign"
    description: "A coordinator identifies an owner and supporting teams."
    activities:
      - id: "assign-owner"
        title: "Assign an owner"
        description: "Give the case one accountable owner, considering workload and expertise."
        actor: "supervisor"
        produces: ["assignment"]
        uses: ["workflow", "reporting"]
        decision: "Who owns this case?"
      - id: "plan-work"
        title: "Plan the work"
        description: "Identify the tasks, the supporting teams, and when each piece of work is due."
        actor: "case-owner"
        participants: ["specialist"]
        produces: ["task", "assignment"]
        uses: ["workflow"]
      - id: "reassign-case"
        title: "Transfer the case"
        description: "Move the case to a new owner with its information and outstanding work, and record who takes responsibility."
        actor: "supervisor"
        participants: ["case-owner"]
        produces: ["assignment"]
        uses: ["workflow", "notification"]
        optional: true

  # ----------------------------------------------------------------------------------------------
  - id: "assess"
    title: "Assess"
    description: "Staff gather information, consult participants, and identify the work needed."
    activities:
      - id: "gather-information"
        title: "Gather information"
        description: "Collect documents, records, and other information the case needs, from inside and outside the organization."
        actor: "case-owner"
        participants: ["participant"]
        produces: ["document", "interaction"]
        uses: ["document-management", "search", "person-information"]
        waits: "Information held by other teams or organizations."
      - id: "complete-task"
        title: "Complete an assigned task"
        description: "A specialist or supporting team carries out a piece of work and records the result against the case."
        actor: "specialist"
        produces: ["task", "document"]
        uses: ["workflow", "document-management"]
        waits: "The supporting team's capacity."
      - id: "consult-participants"
        title: "Consult participants"
        description: "Meet with or contact participants to understand the matter, and record what they said."
        actor: "case-owner"
        participants: ["participant", "representative"]
        produces: ["interaction"]
        uses: ["scheduling", "notification"]
        waits: "Participants' availability."
      - id: "record-assessment"
        title: "Record the assessment"
        description: "Summarize what is known, what remains, and the next steps."
        actor: "case-owner"
        produces: ["document"]
        uses: ["case-management", "document-management"]
        decision: "Is there enough to decide, or is more work needed?"

  # ----------------------------------------------------------------------------------------------
  - id: "decide-act"
    title: "Decide and act"
    description: "Authorized people make decisions and carry out the work."
    activities:
      - id: "prepare-recommendation"
        title: "Prepare a recommendation"
        description: "Set out the options, the evidence, and the recommended outcome for the decision-maker."
        actor: "case-owner"
        produces: ["document"]
        uses: ["document-management"]
      - id: "make-decision"
        title: "Make and record the decision"
        description: "An authorized person decides the outcome and records the reasons and the evidence relied on."
        actor: "decision-maker"
        produces: ["decision"]
        uses: ["approval", "signature", "case-management"]
        decision: "What is the outcome, and why?"
        waits: "The decision-maker's review."
      - id: "carry-out-actions"
        title: "Carry out the actions"
        description: "Complete the work the decision requires, and record each action."
        actor: "case-owner"
        participants: ["specialist"]
        produces: ["task"]
        uses: ["workflow"]

  # ----------------------------------------------------------------------------------------------
  - id: "communicate"
    title: "Communicate"
    description: "Staff explain progress, outcomes, and outstanding work to relevant participants."
    activities:
      - id: "update-participants"
        title: "Update participants"
        description: "Tell participants how the case is progressing and what is still needed from them, as far as they may know."
        actor: "case-owner"
        participants: ["initiator", "participant", "representative"]
        produces: ["interaction"]
        uses: ["notification"]
      - id: "communicate-outcome"
        title: "Communicate the outcome"
        description: "Issue the outcome and its reasons to the people entitled to it, with any right to request a review."
        actor: "case-owner"
        participants: ["initiator", "participant", "representative"]
        produces: ["interaction", "document"]
        uses: ["notification", "document-management", "signature"]
      - id: "record-responses"
        title: "Record responses"
        description: "Record replies, objections, and requests for review against the case."
        actor: "case-owner"
        produces: ["interaction"]
        uses: ["case-management"]

  # ----------------------------------------------------------------------------------------------
  - id: "close"
    title: "Close"
    description: "The owner checks completion and records the outcome."
    activities:
      - id: "check-completion"
        title: "Check for outstanding work"
        description: "Confirm that tasks, actions, and communications are complete, or record what continues as follow-up."
        actor: "case-owner"
        uses: ["workflow"]
        decision: "Is the case ready to close?"
      - id: "close-case"
        title: "Record the outcome and close"
        description: "Record the final outcome and close the case. Closing keeps the full history."
        actor: "case-owner"
        produces: ["case"]
        uses: ["case-management"]
      - id: "withdraw-case"
        title: "Withdraw or cancel"
        description: "Stop the work, recording why and any obligations that remain."
        actor: "case-owner"
        produces: ["decision"]
        uses: ["case-management"]
        optional: true
      - id: "review-outcome"
        title: "Review an outcome"
        description: "A reviewer examines an outcome after a participant disagrees or a review is required."
        actor: "decision-maker"
        participants: ["participant", "representative"]
        produces: ["decision"]
        uses: ["case-management", "document-management"]
        decision: "Uphold the outcome, change it, or reopen the work?"
        optional: true
      - id: "reopen-case"
        title: "Reopen the work"
        description: "Reopen the case or open a linked case, preserving the earlier decisions."
        actor: "case-owner"
        produces: ["case"]
        uses: ["case-management"]
        optional: true
      - id: "manage-record"
        title: "Manage the closed record"
        description: "Retain, restrict, transfer, or dispose of the case record according to its schedule."
        actor: "records-staff"
        uses: ["document-management"]

  # ----------------------------------------------------------------------------------------------
  - id: "oversee"
    title: "Oversee"
    description: "Work that runs alongside every stage: watching ownership, outstanding work, and delays."
    throughout: true
    activities:
      - id: "monitor-workload"
        title: "Monitor workload and progress"
        description: "Watch who owns what, how old each case is, and what each case is waiting on."
        actor: "supervisor"
        uses: ["reporting"]
      - id: "resolve-delay"
        title: "Resolve a delay or escalation"
        description: "Step in when a case or task stalls, and record what was done."
        actor: "supervisor"
        participants: ["case-owner"]
        produces: ["decision"]
        uses: ["workflow", "notification"]
        decision: "Escalate, reassign, add help, or wait?"

scenarios:
  - id: "internal-source"
    title: "A matter raised inside the organization"
    description: "An employee or team raises an issue that needs attention."
    activities: ["receive-matter", "check-related", "route-matter", "assign-owner", "plan-work", "gather-information", "record-assessment", "make-decision", "communicate-outcome", "close-case"]
    check: "An internal source doesn't grant access to every case, and the case records who raised it."
  - id: "external-source"
    title: "A matter from outside, without an account"
    description: "A member of the public submits a report through a public channel."
    activities: ["receive-matter", "acknowledge-receipt", "identify-participants", "check-related", "check-completeness", "route-matter"]
    check: "The submitter gets a confirmation and knows what happens next, without needing an account."
  - id: "missing-information"
    title: "Information is missing"
    description: "The matter can't move until someone provides more information."
    activities: ["check-completeness", "request-information", "check-completeness", "route-matter"]
    check: "The case shows who must respond, by when, and what happens if they don't."
  - id: "related-matters"
    title: "Related matters"
    description: "A new matter concerns the same issue, people, or organization as an existing case."
    activities: ["receive-matter", "check-related", "route-matter"]
    check: "Staff see the possible match before opening a new case, and linked cases keep their own histories."
  - id: "referral"
    title: "Referral"
    description: "The matter belongs to another team or organization."
    activities: ["check-related", "route-matter", "refer-matter", "close-case"]
    check: "The record shows why the matter was referred, to whom, and what was shared."
  - id: "reassignment"
    title: "Reassignment"
    description: "The owner changes jobs, goes on leave, or the case needs different expertise."
    activities: ["monitor-workload", "reassign-case", "plan-work"]
    check: "Nothing is lost in the transfer: information, outstanding tasks, and deadlines move with the case, and someone is always responsible."
  - id: "parallel-work"
    title: "Parallel work"
    description: "Several teams complete different tasks within the same case."
    activities: ["plan-work", "complete-task", "complete-task", "record-assessment"]
    check: "The owner can see every open task and its status, and the case can't close while one is outstanding."
  - id: "restricted-access"
    title: "Different access rights"
    description: "Participants and staff may see different parts of the same case."
    activities: ["gather-information", "update-participants", "communicate-outcome"]
    check: "Each person sees only what they may see, and the record shows who viewed or received what."
  - id: "withdrawal"
    title: "Withdrawal or cancellation"
    description: "The initiator withdraws, or the work stops for another reason."
    activities: ["withdraw-case", "update-participants", "close-case"]
    check: "The record shows why the work stopped and what obligations remain."
  - id: "review-reopen"
    title: "Review or reopening"
    description: "A participant disagrees with the outcome, or new information arrives after closure."
    activities: ["record-responses", "review-outcome", "reopen-case", "make-decision"]
    check: "Earlier decisions stay in the record, and the new work is in the same case or a linked one."

requirements:
  # Receive
  - id: "receive-any-channel"
    title: "Receive matters from every supported channel"
    statement: "Record matters from every supported channel, internal or external, with the source, channel, and time received."
    category: "functional"
    activities: ["receive-matter"]
    capabilities: ["case-management"]
    scenarios: ["internal-source", "external-source"]
  - id: "submit-without-account"
    title: "Accept submissions without an account"
    statement: "Accept external submissions without an online account, and anonymously where the case type allows, while recording what is known about the submitter."
    category: "functional"
    activities: ["receive-matter"]
    capabilities: ["identity"]
    policies: ["identity", "privacy"]
    scenarios: ["external-source"]
  - id: "attach-documents"
    title: "Accept supporting documents"
    statement: "Accept documents and other files with a submission or later in the case, and keep them with the case."
    category: "functional"
    activities: ["receive-matter", "gather-information"]
    capabilities: ["document-management"]
  - id: "acknowledge-receipt"
    title: "Confirm receipt and explain next steps"
    statement: "Send the initiator a confirmation with a reference and what happens next, when they can be contacted."
    category: "functional"
    activities: ["acknowledge-receipt"]
    capabilities: ["notification"]
    scenarios: ["external-source"]
  - id: "record-participants"
    title: "Record participants and their roles"
    statement: "Record each participant and their role in the case, matched to existing person and organization records where possible, including representatives and the authority they hold."
    category: "functional"
    activities: ["identify-participants"]
    capabilities: ["person-information", "organization-information"]

  # Review and route
  - id: "find-related-cases"
    title: "Find existing and related cases"
    statement: "Search existing matters, cases, and participants when a matter arrives, and show possible matches before a new case is opened."
    category: "functional"
    activities: ["check-related"]
    capabilities: ["search"]
    scenarios: ["related-matters"]
  - id: "link-cases"
    title: "Link related cases"
    statement: "Link related matters and cases while each keeps its own history."
    category: "functional"
    activities: ["check-related", "route-matter", "reopen-case"]
    capabilities: ["case-management"]
    scenarios: ["related-matters", "review-reopen"]
  - id: "triage-criteria"
    title: "Check completeness and urgency against criteria"
    statement: "Check each matter against the case type's completeness and urgency criteria, and record its priority and anything missing."
    category: "functional"
    activities: ["check-completeness"]
    capabilities: ["case-management", "workflow"]
    scenarios: ["missing-information"]
  - id: "record-routing"
    title: "Record each routing decision and its reason"
    statement: "Record whether a matter opened a case, updated one, was referred, or needed no action, with the reason and who decided."
    category: "functional"
    activities: ["route-matter"]
    capabilities: ["case-management", "workflow"]
  - id: "track-information-requests"
    title: "Track requests for information"
    statement: "Send requests for missing information, record who must respond and by when, and remind or escalate when a response is overdue."
    category: "functional"
    activities: ["request-information", "gather-information"]
    capabilities: ["notification", "workflow"]
    scenarios: ["missing-information"]
  - id: "record-referrals"
    title: "Record referrals"
    statement: "Refer a matter to another team or organization, recording the reason, the recipient, and what was shared."
    category: "functional"
    activities: ["refer-matter"]
    capabilities: ["document-management", "notification"]
    scenarios: ["referral"]

  # Assign
  - id: "one-accountable-owner"
    title: "Every open case has one accountable owner"
    statement: "Give every open case one accountable owner at all times, and record each change of owner."
    category: "functional"
    activities: ["assign-owner", "reassign-case"]
    capabilities: ["workflow"]
    scenarios: ["reassignment"]
  - id: "assign-tasks"
    title: "Assign tasks with due dates"
    statement: "Assign tasks to people and teams with due dates, and show each task's status on the case."
    category: "functional"
    activities: ["plan-work", "complete-task"]
    capabilities: ["workflow"]
    scenarios: ["parallel-work"]
  - id: "transfer-with-history"
    title: "Transfer a case without losing work"
    statement: "Transfer a case with its information, outstanding tasks, and deadlines, and notify the new owner."
    category: "functional"
    activities: ["reassign-case"]
    capabilities: ["workflow", "notification"]
    scenarios: ["reassignment"]

  # Assess
  - id: "case-record"
    title: "Keep the case's information together"
    statement: "Keep the case's documents, notes, interactions, tasks, and decisions in one record that authorized staff can review in order."
    category: "functional"
    activities: ["gather-information", "consult-participants", "record-assessment"]
    capabilities: ["case-management", "document-management"]
  - id: "schedule-meetings"
    title: "Schedule meetings with participants"
    statement: "Schedule interviews and meetings with participants, send reminders, and record what was discussed."
    category: "functional"
    activities: ["consult-participants"]
    capabilities: ["scheduling", "notification"]
  - id: "record-task-results"
    title: "Record task results against the case"
    statement: "Record each task's result and supporting documents against the case it serves."
    category: "functional"
    activities: ["complete-task"]
    capabilities: ["workflow", "document-management"]
    scenarios: ["parallel-work"]

  # Decide and act
  - id: "record-decisions"
    title: "Record each decision with its reasons"
    statement: "Record each decision with its outcome, reasons, the evidence relied on, who made it, and when."
    category: "functional"
    activities: ["make-decision", "route-matter", "review-outcome"]
    capabilities: ["case-management"]
  - id: "route-for-approval"
    title: "Route decisions to someone with authority"
    statement: "Send decisions that need approval to a person with the authority to make them, and record the approval."
    category: "functional"
    activities: ["make-decision"]
    capabilities: ["approval"]
    policies: ["authorization"]
  - id: "people-decide"
    title: "People make consequential decisions"
    statement: "AI may organize information or draft a recommendation, but an authorized person makes and records each consequential decision."
    category: "constraint"
    activities: ["prepare-recommendation", "make-decision", "review-outcome"]
    capabilities: ["approval"]
    policies: ["ai-policy", "authorization"]
  - id: "track-actions"
    title: "Track the actions a decision requires"
    statement: "Turn a decision's required actions into tasks with owners, and record when each is complete."
    category: "functional"
    activities: ["carry-out-actions"]
    capabilities: ["workflow"]

  # Communicate
  - id: "update-participants"
    title: "Keep participants informed"
    statement: "Send participants progress updates through their preferred channel, limited to what each may know."
    category: "functional"
    activities: ["update-participants"]
    capabilities: ["notification"]
    scenarios: ["restricted-access"]
  - id: "issue-outcome-notices"
    title: "Issue outcome notices"
    statement: "Issue the outcome and its reasons to those entitled to them, including any right to request a review, and keep the notice in the record."
    category: "functional"
    activities: ["communicate-outcome"]
    capabilities: ["notification", "document-management", "signature"]
  - id: "record-responses"
    title: "Record responses and review requests"
    statement: "Record replies, objections, and requests for review against the case."
    category: "functional"
    activities: ["record-responses"]
    capabilities: ["case-management"]
    scenarios: ["review-reopen"]

  # Close
  - id: "check-before-closing"
    title: "Check for outstanding work before closing"
    statement: "Show open tasks, actions, and communications before a case closes, and record any that continue as follow-up."
    category: "functional"
    activities: ["check-completion", "close-case"]
    capabilities: ["workflow"]
    scenarios: ["parallel-work"]
  - id: "record-withdrawal"
    title: "Record why work stopped"
    statement: "When a case is withdrawn or cancelled, record why and any obligations that remain."
    category: "functional"
    activities: ["withdraw-case"]
    capabilities: ["case-management"]
    scenarios: ["withdrawal"]
  - id: "review-and-reopen"
    title: "Review and reopen without losing history"
    statement: "Review an outcome and reopen the work, in the same case or a linked one, without changing earlier decisions."
    category: "functional"
    activities: ["review-outcome", "reopen-case"]
    capabilities: ["case-management"]
    scenarios: ["review-reopen"]
  - id: "retain-records"
    title: "Retain and dispose of records by schedule"
    statement: "Apply a records schedule to each case, keep the record after closure, and dispose of it or transfer it only as the schedule allows."
    category: "constraint"
    activities: ["manage-record", "close-case"]
    capabilities: ["document-management"]
    policies: ["records"]

  # Oversee
  - id: "workload-visibility"
    title: "Show ownership, outstanding work, and case age"
    statement: "Show supervisors who owns each case, how old it is, what it's waiting on, and each person's workload."
    category: "functional"
    activities: ["monitor-workload", "assign-owner"]
    capabilities: ["reporting"]
  - id: "flag-stalled-work"
    title: "Flag stalled and overdue work"
    statement: "Flag cases and tasks that are overdue or haven't moved within an expected time, and notify the owner and supervisor."
    category: "functional"
    activities: ["monitor-workload", "resolve-delay"]
    capabilities: ["workflow", "notification"]

  # Across the process
  - id: "case-type-rules"
    title: "Let each case type add its own steps and rules"
    statement: "Let each case type define its own steps, information, deadlines, access rules, and completion criteria on the shared case model."
    category: "functional"
    activities: []
    capabilities: ["case-management", "workflow"]
  - id: "case-access-control"
    title: "Control who may see and act on each case"
    statement: "Control who may open, view, contribute to, act on, or review each case and each part of it, based on role, case type, and involvement."
    category: "nfr"
    activities: []
    capabilities: ["identity"]
    policies: ["authorization", "privacy"]
    scenarios: ["restricted-access", "internal-source"]
  - id: "audit-trail"
    title: "Record who did what, when, and why"
    statement: "Record every view, change, decision, and disclosure with the person or system that made it, when, and why."
    category: "nfr"
    activities: []
    capabilities: ["case-management"]
    policies: ["audit"]
  - id: "protect-personal-information"
    title: "Protect personal information"
    statement: "Collect, use, and disclose personal information only as the case type allows, and limit each view to what the viewer may see."
    category: "constraint"
    activities: []
    capabilities: ["person-information"]
    policies: ["privacy"]
    scenarios: ["restricted-access"]
  - id: "accessible-experiences"
    title: "Accessible experiences for staff and the public"
    statement: "Make every staff and public experience accessible, including forms, notices, and documents."
    category: "constraint"
    activities: []
    capabilities: []
    policies: ["accessibility"]
