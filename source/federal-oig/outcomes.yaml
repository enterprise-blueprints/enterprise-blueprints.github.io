# Outcomes, in the order the pages show them, each with the links it holds.

- id: effective-programs
  title: Programs and operations run economically, efficiently, and effectively
  theme: results
  description: Agency programs and operations make good use of public money and do what they’re meant to do, helped by the office’s audits, inspections, evaluations, and recommendations.
  sources: [ ig-act-402 ]
  measures:
    - id: funds-put-to-better-use
      title: Funds recommended for better use
      description: The dollar value of recommendations that funds be put to better use, and how much of it management agreed to. Semiannual reports to Congress include these figures.
      sources: [ ig-act-405 ]

- id: fraud-waste-abuse-prevented
  title: Fraud, waste, and abuse are prevented and detected
  theme: integrity
  description: Wrongdoing in agency programs and operations is deterred, found, and acted on, through audits, investigations, and referrals for prosecution where warranted.
  sources: [ ig-act-402, ig-act-405 ]
  measures:
    - id: questioned-costs
      title: Questioned and unsupported costs
      description: Costs that audit, inspection, and evaluation reports question, including unsupported costs, and how much of them management disallowed. Semiannual reports to Congress include these figures.
      sources: [ ig-act-405 ]
    - id: investigative-results
      title: Investigative results
      description: Investigative reports issued, people referred to the Department of Justice and to state and local prosecutors, and the indictments and criminal informations that followed. Semiannual reports to Congress include these counts and how they were counted.
      sources: [ ig-act-405 ]

- id: leaders-congress-informed
  title: Agency leaders and Congress are fully and currently informed
  theme: transparent
  description: The head of the agency and Congress learn about serious problems and deficiencies promptly, with what’s being done to correct them, and the public can read the office’s reports.
  sources: [ ig-act-402, ig-act-405, ig-act-420 ]
  measures:
    - id: semiannual-reports-on-time
      title: Semiannual reports on time
      description: Whether each semiannual report reaches the agency head by April 30 and October 31, for the six months ending March 31 and September 30.
      sources: [ ig-act-405 ]
    - id: reports-posted-within-3-days
      title: Reports posted within 3 days
      description: The share of final audit, inspection, and evaluation reports posted on the office’s website within 3 days of being submitted in final form.
      sources: [ ig-act-420 ]

- id: problems-corrected
  title: Problems that are found get corrected
  theme: accountable
  description: Recommendations get a management decision, and agreed corrective actions are carried out and tracked until they’re complete.
  sources: [ ig-act-402, ig-act-405 ]
  measures:
    - id: open-recommendations
      title: Open recommendations
      description: Significant recommendations from earlier reports whose corrective action isn’t complete yet, with how long they’ve been open and any potential cost savings. Semiannual reports to Congress list them.
      sources: [ ig-act-405 ]
    - id: reports-awaiting-decision
      title: Reports awaiting a management decision
      description: Reports from earlier periods with no management decision yet, with the reasons and a target date for one. Semiannual reports to Congress list them.
      sources: [ ig-act-405 ]

- id: concerns-raised-safely
  title: People can raise concerns safely
  theme: accountable
  description: Employees and the public can report possible wrongdoing through clear channels, with their identities kept confidential and protection from reprisal.
  sources: [ ig-act-407, ig-act-420, oversight-hotline ]
  measures:
    - id: time-to-route
      title: Time to review and route a matter
      description: How long it takes from when a complaint, allegation, or disclosure arrives until it’s reviewed and routed. The office sets its own target.
    - id: retaliation-found
      title: Whistleblower retaliation found
      description: Cases of whistleblower retaliation the office establishes, with the consequences imposed. Semiannual reports to Congress include them.
      sources: [ ig-act-405 ]

- id: work-meets-standards
  title: The office’s work is independent and meets professional standards
  theme: accountable
  description: Audits, inspections, evaluations, and investigations follow the professional standards that apply to them, free of impairments to the office’s independence, and external peer reviews confirm it.
  sources: [ cigie-silver-book, gao-yellow-book, cigie-qar-investigations ]
  measures:
    - id: peer-review-results
      title: Peer review results
      description: The rating of the latest external peer review of the office’s audit work, the results of its investigations peer review, and any peer review recommendations still open. Semiannual reports to Congress include them.
      sources: [ ig-act-405, gao-yellow-book ]
