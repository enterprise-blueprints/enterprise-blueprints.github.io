# Solutions, in the order the pages show them, each with the links it holds.

- id: oig-north-star
  title: Office of Inspector General North Star
  description: "The long-term architecture this library recommends for an Office of Inspector General: one case system and one audit system that the office runs itself, with a confidential hotline, a digital evidence store, and a recommendation tracker the agency works in, all reporting from the source, and analytics and AI on top."
  attributes:
    principles:
      - The office runs its own systems, administering them and deciding who sees its work, as its independence requires
      - Each matter is one record from intake to closure, and each engagement one record from plan to its last recommendation
      - The identity of people who report is kept apart from the allegation from the first contact
      - Statistics for the semiannual report come from the systems of record, not from spreadsheets
      - Agency officials send corrective action updates into the office’s tracker through their own access
      - Analytics and AI suggest, and staff decide
    watchFor:
      - The office needs administrators for its own systems, or a contract for them
      - Running its own systems costs more than sharing the agency’s, and the office has to budget for it
  includes:
    - to: agency-sign-on
      note: Every system signs in through the agency, with roles the office administers.
    - to: oversight-intake-case-tracking
      way: product
      note: A product the office administers, for its independence and its evidence handling.
    - to: confidential-hotline-intake
      note: Feeds the case system’s intake queue, with the reporter’s identity kept apart.
    - to: agency-security-monitoring
      note: The office’s systems send their logs to the agency, searchable only by staff the office agrees to.
    - to: records-aware-collaboration
      note: Where staff draft and collaborate, with records and sensitivity labels applied.
    - to: records-in-business-systems
      way: built-in
      note: Each of the office’s systems keeps its own records on schedule, so holds stay in the office’s hands.
    - to: audit-management-system
      way: product
      note: A product for audits, inspections, and evaluations, so work papers meet the standards and peer reviewers can trace each finding.
    - to: shared-recommendation-tracker
      way: audit-module
      note: The audit product’s module, so each recommendation starts and is tracked in one place, with agency officials working on their own.
    - to: digital-evidence-store
      note: Either a product or secure storage with a custody log, depending on how much digital evidence the office handles.
    - to: oversight-reporting-from-source-data
      note: The semiannual report’s statistics come from the case, audit, and recommendation systems, and reports are posted within 3 days.
    - to: letters-from-case-data
      note: Routine notices and report sections drafted from the case and audit data.
    - to: oversight-data-analytics
      note: Agency data points audits and investigations at the highest risks.
    - to: ai-assisted-intake-sorting
      note: Suggestions in the intake queue, once intake runs on the case system and its categories are settled.
  supports: [ independent-government-oversight ]
