# Implementation patterns, in the order the pages show them, each with the links it holds.

- id: oversight-intake-case-tracking
  title: Oversight Case Management
  description: "An example architecture: one case system for the office’s oversight and investigative work, administered by the office, that carries each matter from intake through triage, referral, investigation, and closure, with access limited by assignment and the statistics oversight reporting needs."
  sources: [ oversight-hotline, cigie-faq, cigie-silver-book ]
  attributes:
    role: business-applications
    parts:
      - Intake forms for the hotline and for staff, feeding one intake queue
      - Triage with recorded decisions, and referrals to other authorities
      - Case records with assignment, status, and investigative steps
      - Evidence records with chain of custody
      - Access limited by case assignment, with the identities of people who report restricted further
      - Statistics for the semiannual report
    strengths:
      - Each matter is one record, from intake to closure
      - The office controls who administers it and who sees what
      - Statistics for oversight reporting come from the records themselves
    fitsWhen:
      - The office runs investigations with evidence and referrals for prosecution
      - Independence from the agency’s own systems matters
    watchFor:
      - Early configuration choices, such as case types, are hard to change later
      - Data from older systems needs moving and cleaning up
      - A hosted system needs a security authorization before it can hold case information
    ways:
      - id: product
        approach: product
        title: An oversight case product
        description: A case management product made for oversight and investigative work, configured for the office and administered by it.
        strengths:
          - Built around investigative work, such as evidence handling and referrals
          - Comes with reports shaped for oversight reporting
        fitsWhen:
          - There’s budget for licenses and an administrator in the office
        watchFor:
          - Another product to buy, secure, and keep up
      - id: agency-platform
        approach: platform
        title: The agency’s shared case platform
        description: The office’s own case types on the agency’s shared case platform, with administration and access the office controls.
        strengths:
          - Uses licenses, skills, and security approvals the agency already has
        fitsWhen:
          - The agency runs a case platform, and the office can control who administers its part
        watchFor:
          - The office’s independence depends on keeping its administration and access apart from the agency’s
          - Evidence handling, such as chain of custody, usually needs building
  depends_on:
    - to: shared-case-platform
      way: agency-platform
      note: The office’s case types and steps are the shared platform, set up for oversight.
  works_with:
    - to: digital-evidence-store
      note: Each item of digital evidence is linked to its case.

- id: confidential-hotline-intake
  title: Confidential Online Hotline
  description: "An example architecture: a public web form and phone line for reporting fraud, waste, and abuse that can take anonymous reports, keeps the identity of the person reporting apart from the allegation, and gives them a code to check back or add information."
  sources: [ ig-act-420, ig-act-407, oversight-hotline ]
  attributes:
    approach: product
    role: public-facing
    parts:
      - A public web form linked directly from the office’s home page, and a phone line
      - A choice to report anonymously, or to ask that one’s identity be kept confidential
      - Contact details stored apart from the allegation, visible only to the people who need them
      - A report code the person can use to check back or add information without identifying themselves
      - Delivery of each report into the intake queue
    strengths:
      - Makes reporting easy, through the direct link the law asks for
      - Protects identities by design rather than by habit
      - Lets the office follow up with people who report anonymously
    fitsWhen:
      - The office receives reports from the public or from employees
      - The office’s current form sends reports to a shared inbox
    watchFor:
      - Anonymous reports are hard to act on without a way to follow up
      - Spam and duplicate reports need screening before triage
      - What people type must not be recorded anywhere outside the intake system, such as in web analytics
  works_with:
    - to: oversight-intake-case-tracking
      note: Each report lands in the product’s intake queue.
    - to: shared-case-platform
      note: Each report lands in the office’s intake queue on the platform, kept apart from other offices.

- id: audit-management-system
  title: Audit Management & Work Papers
  description: "An example architecture: one place for the office’s plan of audits, inspections, and evaluations, the work papers and evidence behind each finding, supervisors’ review sign-offs, and the recommendations each report makes."
  sources: [ gao-yellow-book, cigie-blue-book, cigie-silver-book ]
  attributes:
    role: business-applications
    parts:
      - A plan of oversight work with each engagement’s scope, schedule, and status
      - Electronic work papers with evidence attached, cross-referenced to the report
      - Supervisors’ review notes and sign-offs, kept with the work papers
      - Findings and recommendations recorded once, then tracked to closure
      - Records retention for closed engagements
    strengths:
      - Supports the documentation and supervision that professional standards require
      - Peer reviewers can trace each finding to its evidence
      - Recommendations start in the same place they’re tracked
    fitsWhen:
      - The office follows the Yellow Book or the Blue Book for its audits, inspections, and evaluations
      - Work papers live in shared drives today
    watchFor:
      - Teams need time to adopt a new way of documenting their work
      - Evidence with sensitive personal information needs the same protection it has elsewhere
      - Older engagements usually stay where they are, so there are two places to look for a while
    ways:
      - id: product
        approach: product
        title: An audit management product
        description: A product made for audit work, with electronic work papers, review sign-offs, and recommendations built in.
        strengths:
          - The documentation and supervision steps come built in
          - Reporting across engagements, such as on open recommendations, is part of it
        fitsWhen:
          - The office has many engagements at a time
        watchFor:
          - Another product to buy, secure, and keep up
      - id: workspace
        approach: combine
        title: Work papers in the collaboration workspace
        description: A workspace for each engagement in the agency’s collaboration suite, with work paper templates, and supervisors’ sign-offs recorded through document approvals.
        strengths:
          - Uses tools the office already has and knows
          - Costs little to start, and is easy to change
        fitsWhen:
          - The office is small, with a few engagements at a time
        watchFor:
          - Cross-references and review sign-offs depend on discipline, which peer reviews will test
          - Reporting across engagements, such as on open recommendations, takes manual work
  depends_on:
    - to: records-aware-collaboration
      way: workspace
      note: The workspaces, approvals, and retention labels are the agency’s collaboration suite.

- id: shared-recommendation-tracker
  title: Shared Recommendation Tracker
  description: "An example architecture: a recommendation tracker the office owns, where agency officials submit corrective action plans, updates, and evidence through their own access, and the office decides when each recommendation is closed."
  sources: [ ig-act-405, gao-ig-act ]
  attributes:
    role: business-applications
    parts:
      - One record per recommendation, with its report, owner, agreed action, target date, and status
      - Agency access limited to their own recommendations, for submitting plans, updates, and evidence
      - The office’s review of each submission, with the decision to close recorded
      - Reminders before target dates
      - Lists of open recommendations for the semiannual report, the website, and the agency’s budget justification
    strengths:
      - Replaces email and spreadsheets traded back and forth with the agency
      - The office keeps the decision to close, and the agency keeps responsibility for acting
      - The same data serves the semiannual report and the agency’s GAO-IG Act report
    fitsWhen:
      - The office has many open recommendations across several parts of the agency
      - Status is gathered by email before each semiannual report
    watchFor:
      - Agency users need accounts and guidance, which takes coordination
      - Giving agency officials access must not expose anything else the office holds
      - What it takes to close a recommendation needs agreeing with the agency up front
    ways:
      - id: audit-module
        approach: product
        title: A module of the audit product
        description: The audit product’s recommendation module, opened to agency officials for their own recommendations.
        fitsWhen:
          - The office’s audit product has a module like this
        watchFor:
          - Agency officials need access to the office’s product, limited to their own recommendations
      - id: owned-app
        approach: platform
        title: An app the office owns on a platform
        description: A tracker the office builds and administers on a platform, kept apart from the agency’s other apps.
        fitsWhen:
          - The office’s audit tools have no module agency officials can use
        watchFor:
          - The office keeps the app working, and in step with its audit tools
  works_with:
    - to: audit-management-system
      note: Recommendations start in the audit reports and are tracked to closure here.

- id: oversight-reporting-from-source-data
  title: Oversight Reporting from Source Data
  description: "An example architecture: a reporting store fed by the case, audit, and recommendation systems that produces the semiannual report’s statistics, with a publishing step that posts final reports to the office’s website and Oversight.gov within 3 days."
  sources: [ ig-act-405, ig-act-420, oversight-mission ]
  attributes:
    approach: build
    role: ai-insights
    parts:
      - Feeds from the case, audit, and recommendation systems into one reporting store
      - A definition of each statistic the semiannual report needs, kept with the data
      - Draft tables for each reporting period, for review
      - A publishing step that posts final reports to the website and Oversight.gov, recording the date
    strengths:
      - Statistics are counted the same way every period
      - Less gathering by hand before each deadline
      - The date each report was posted is on record
    fitsWhen:
      - Each semiannual report takes weeks of gathering by hand
      - Counts get questioned because they’re compiled differently each time
    watchFor:
      - It’s only as good as the data in the systems that feed it
      - Each definition needs an owner for when the law or guidance changes
      - Sensitive details must stay out of anything published
  works_with:
    - to: oversight-intake-case-tracking
      note: Case statistics for the semiannual report.
    - to: audit-management-system
      note: Audit, inspection, and evaluation results.
    - to: shared-recommendation-tracker
      note: Open and closed recommendations.

- id: oversight-data-analytics
  title: Data Analytics for Oversight Planning
  description: "An example architecture: the office’s data team brings agency financial, payment, and program data into an analytics workspace, where rules and models point to risks, such as unusual payments or duplicate vendors, that help plan audits and open investigations."
  sources: [ ig-act-404, nist-ai-rmf, gao-yellow-book ]
  attributes:
    approach: build
    role: ai-insights
    parts:
      - Agreements and regular feeds for the agency data the office has a right to, such as payments, contracts, and grants
      - Rules and models that flag risks, each with the reason it was flagged
      - A review step where auditors or investigators decide what to look into
      - A record of what was flagged, what was decided, and what came of it
      - Controls that keep each use of the data within the office’s authority
    strengths:
      - Points audits and investigations at the highest risks
      - Finds patterns across large data sets that sampling misses
      - Results show which risk indicators are worth keeping
    fitsWhen:
      - The office has, or can get, regular access to agency data
      - It has staff who can build and check analytics, or can hire them
    watchFor:
      - A flag isn’t a finding, so every lead needs review and evidence before anything is done
      - Models can carry gaps or bias in the data, so their results need checking over time
      - Data sharing agreements and privacy rules limit what can be combined
  works_with:
    - to: audit-management-system
      note: Risks it finds feed the plan of oversight work.

- id: audit-workpapers-collaboration
  status: deprecated
  replacedBy: audit-management-system
  title: Audit Work Papers in the Collaboration Workspace
  description: "An example architecture: each engagement gets a workspace in the agency’s collaboration suite, with folders and templates for work papers, cross-references to the report, and supervisors’ review recorded through document approvals."
  sources: [ gao-yellow-book, cigie-blue-book ]
  attributes:
    approach: combine
    role: business-applications
    parts:
      - A workspace for each engagement, made from a template with standard folders
      - Work paper templates with fields for purpose, source, conclusion, and cross-references
      - Supervisors’ review and sign-off through document approvals, with dates
      - A shared list that tracks each engagement’s plan, status, and recommendations
      - Retention labels for closed engagements, with access limited to the team
    strengths:
      - Uses tools the office already has and knows
      - Costs little to start, and is easy to change
    fitsWhen:
      - The office is small, with a few engagements at a time
      - It isn’t ready to buy and set up an audit product
    watchFor:
      - Cross-references and review sign-offs depend on discipline, which peer reviews will test
      - Reporting across engagements, such as on open recommendations, takes manual work
      - Collaboration tools make sharing easy, so access to engagement workspaces needs limiting
  depends_on:
    - to: records-aware-collaboration
      note: The workspaces, approvals, and retention labels are the agency’s collaboration suite.

- id: digital-evidence-store
  title: Digital Evidence Store
  description: "An example architecture: secure storage for investigations’ digital evidence, such as forensic images, video, and large email collections, with each item linked to its case and a record of everyone who handled it."
  sources: [ cigie-investigation-standards ]
  attributes:
    role: processing
    parts:
      - Storage for large files, such as forensic images and video, kept apart from everyday systems
      - Each item linked to its case, with where and when it was collected
      - A custody log of every access, copy, and transfer
      - Hashes that show an item hasn’t changed since it was collected
      - Retention and disposal by the case’s records schedule, with holds during litigation
    strengths:
      - Shows that evidence hasn’t been altered
      - Handles files too large for the case system
      - Evidence can go to prosecutors as a controlled copy
    fitsWhen:
      - The office collects digital evidence, such as devices or email
      - Evidence sits on drives or in shared folders today
    watchFor:
      - Storage costs grow with forensic images and video
      - Access needs to be as tightly limited as the cases themselves
      - Sharing with prosecutors and courts needs a defined process
    ways:
      - id: product
        approach: product
        title: A digital evidence management product
        description: A product made for managing digital evidence, with custody logs and hashing built in.
        fitsWhen:
          - The office handles large amounts of digital evidence
        watchFor:
          - Another product to buy, secure, and keep up
      - id: secure-storage
        approach: build
        title: Secure storage with a custody log
        description: Encrypted storage in the agency’s cloud or data center, kept apart for the office, with a custody log the office builds and links to its case system.
        fitsWhen:
          - The office handles digital evidence now and then
        watchFor:
          - The custody log and hashing carry the evidence’s weight, so they must be built and checked with care
