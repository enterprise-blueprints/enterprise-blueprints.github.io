# Implementation patterns, in the order the pages show them, each with the links it holds.

- id: shared-case-platform
  title: Case Management on a Shared Platform
  description: "An example architecture: case management built on a low-code or CRM platform the agency already runs, with each office getting its own case types, forms, queues, and permissions on the shared foundation."
  sources: [ nist-sp-800-53 ]
  attributes:
    role: business-applications
    parts:
      - A case record with status, assignment, due dates, and linked documents, set up for each case type
      - Intake forms and an email channel that create cases
      - Work queues and dashboards for each team
      - Permissions by role that keep one office’s cases apart from another’s
      - Reports and exports from the same case data
      - Sign-in through the agency’s identity service, with activity logs sent to agency monitoring
    strengths:
      - Uses licenses, skills, and security approvals the agency already has
      - Offices share one way of tracking work, so reporting across them is easier
      - New fields and steps can often be added by configuration instead of code
    fitsWhen:
      - The agency already runs a platform like this, with people who configure it
      - The office’s cases are fairly standard, without specialized tools such as redaction or evidence handling
      - Several offices need similar tracking
    watchFor:
      - Platform administrators can often see every office’s data unless permissions and administration are set up to prevent it
      - Specialized rules, such as deadlines counted in working days, may need custom work that’s costly to keep up
      - Upgrades and licensing are decided for the whole agency, not for the office
    ways:
      - id: platform
        approach: platform
        title: The agency’s low-code or CRM platform
  depends_on:
    - to: agency-sign-on
      note: Staff sign in through the agency, and access follows its role groups.

- id: agency-sign-on
  title: Agency Sign-On with Phishing-Resistant Authentication
  description: "An example architecture: every system signs staff in through the agency’s identity provider, with phishing-resistant authenticators such as PIV cards or FIDO2 security keys, and grants access through role groups that are reviewed on a schedule."
  sources: [ nist-sp-800-63-4, nist-sp-800-53 ]
  attributes:
    role: security-identity
    parts:
      - The agency’s identity provider, with single sign-on to each system
      - Phishing-resistant authenticators for staff, such as PIV cards or FIDO2 security keys
      - Role groups that grant access, each owned by the office that owns the system
      - Steps for people who join, change roles, or leave, tied to personnel actions
      - Access reviews on a schedule, signed off by system owners
      - Sign-in and access events sent to security logging
    strengths:
      - One strong sign-in for every system instead of a password for each
      - Removing a person’s access in one place removes it everywhere
      - Access reviews work from the same groups that grant access
    fitsWhen:
      - The agency’s identity provider can connect to the office’s systems
      - Staff already carry PIV cards or can be issued security keys
    watchFor:
      - Systems that can’t use single sign-on keep their own accounts, which need their own reviews
      - Each role group needs an owner in the office, or access drifts
      - Members of the public, such as requesters or people who report, need a different way to sign in, or none
    ways:
      - id: platform
        approach: platform
        title: The agency’s identity provider

- id: records-aware-collaboration
  title: Collaboration Workspace with Records and Sensitivity Labels
  description: "An example architecture: the agency’s office suite and collaboration workspace, for documents, chat, and meetings, with retention labels that keep work on approved records schedules and sensitivity labels that limit who can open, share, or copy sensitive information."
  sources: [ records-44-usc-3101, nara-grs, nist-sp-800-53 ]
  attributes:
    role: worker-productivity
    parts:
      - Shared documents, chat, and meetings for each team, signed in through the agency
      - Retention labels that apply an approved records schedule to files and messages
      - Sensitivity labels that limit opening, sharing, and copying, and protect files that leave the agency
      - Rules that warn or block when personal or sensitive information is shared outside the team
      - Search across files and messages for records requests and legal holds
    strengths:
      - Records and protection go wherever staff already work, instead of in a separate system
      - Messages and drafts that are records are kept on schedule, not left to each person
      - The same labels serve records requests, legal holds, and investigations
    fitsWhen:
      - Much of the office’s work happens in documents, email, and chat outside its business applications
      - Records schedules and sensitivity rules are hard to apply by hand
    watchFor:
      - Labels only help if they’re applied, so defaults and automatic labeling matter
      - Chat and meeting recordings can be records too, which surprises people
      - Work kept here and in a business application needs one answer to which copy is the record
    ways:
      - id: platform
        approach: platform
        title: The agency’s office and collaboration suite
  depends_on: [ agency-sign-on ]

- id: letters-from-case-data
  title: Letters and Notices from Case Data
  description: "An example architecture: letters, notices, and report sections drafted from approved templates filled in with a case’s data, reviewed and signed by staff, then saved back to the case file."
  sources: [ records-44-usc-3101 ]
  attributes:
    role: worker-productivity
    parts:
      - A library of approved templates, each with an owner
      - Fields filled in from the case, such as names, dates, and decisions
      - Review and signature by the responsible person before anything goes out
      - The sent version saved to the case file, with when and how it was sent
    strengths:
      - Required wording, such as appeal rights, is in every letter
      - Less retyping of what the case already knows
      - Every letter sent is on the record with its case
    fitsWhen:
      - Staff send many similar letters or notices
      - Letters are written from scratch or copied from old ones today
    watchFor:
      - Templates need an owner to keep them current when the law or policy changes
      - A filled-in letter still needs a person to read it before it goes out
    ways:
      - id: platform
        approach: platform
        title: Templates filled from case data
  works_with:
    - to: shared-case-platform
      note: Fills templates from the case record and saves what’s sent back to it.

- id: agency-security-monitoring
  title: Activity Logs in the Agency’s Security Monitoring
  description: "An example architecture: each of the office’s systems sends its sign-in, access, and change logs to the agency’s security monitoring, where the security operations team watches for threats, and the office adds alerts for what matters to it, such as someone opening a restricted case."
  sources: [ nist-sp-800-53 ]
  attributes:
    role: security-identity
    parts:
      - Log forwarding from each system to the agency’s security monitoring
      - Sign-in, access, and change events that say who did what, and when
      - Alerts the office defines, such as access to restricted cases or large exports
      - A way for the office to review its own systems’ activity, apart from other offices’
      - Retention that follows the agency’s logging policy and records schedule
    strengths:
      - Uses monitoring the agency already runs, often around the clock
      - Events from several systems can be followed together, such as a sign-in followed by a large export
      - Logs are kept apart from the systems that make them, so they’re harder to alter
    fitsWhen:
      - The agency runs a security operations center that collects logs centrally
      - The office’s systems can send logs in a standard format
    watchFor:
      - Agency security staff may see activity in sensitive systems, so who can search the office’s logs needs agreeing
      - Logs can hold sensitive details, such as names in search terms, and need the same protection as the data
      - Alerts nobody reviews add cost without adding safety
    ways:
      - id: platform
        approach: platform
        title: The agency’s security monitoring
  works_with:
    - to: agency-sign-on
      note: Sign-in events come from the agency’s identity provider.

- id: built-in-audit-trails
  title: Each System’s Own Audit Trail, Reviewed by the Office
  description: "An example architecture: each product’s built-in audit trail records who viewed or changed what, and the office’s system owners run its reports on a schedule and look into anything unusual."
  sources: [ nist-sp-800-53 ]
  attributes:
    role: security-identity
    parts:
      - The audit trail each product keeps of views, changes, and exports
      - Reports run on a schedule, such as access to restricted records or changes to permissions
      - A record of each review and of what was looked into
    strengths:
      - Needs no new tools, and the office controls who reads its logs
      - Audit trails often show views of single records that general logs miss
    fitsWhen:
      - The agency doesn’t collect logs centrally, or can’t keep the office’s logs apart
      - The office runs a few products with good audit trails
    watchFor:
      - Activity can’t be followed from one system to another
      - Reviews depend on someone remembering to run them
      - A product’s administrators may be able to change or delete its audit trail
    ways:
      - id: product
        approach: product
        title: Each product’s built-in audit trail

- id: ai-assisted-intake-sorting
  title: AI Suggestions for Sorting What Comes In
  description: "An example architecture: as each new matter arrives, such as a request or a complaint, an AI model suggests its category, how urgent it looks, and where it should go, with its reasons, and the person doing intake accepts or changes each suggestion before anything moves."
  sources: [ nist-ai-rmf ]
  attributes:
    role: ai-insights
    parts:
      - A model that reads each new matter and suggests a category, an urgency, and where to route it
      - The reasons for each suggestion, shown beside it
      - A person who accepts or changes each suggestion, with the decision recorded
      - Regular checks of how often suggestions are changed, by category
      - Limits on what the model sees, so sensitive details stay within the office’s systems
    strengths:
      - Intake staff start from a suggestion instead of reading everything cold
      - Urgent matters can come to the top sooner
      - Recorded decisions show where the suggestions help and where they don’t
    fitsWhen:
      - Intake volume is high and the categories are well defined
      - The case system can show suggestions on the intake screen
    watchFor:
      - Suggestions can be wrong, or better for some kinds of matters than others, so people decide and accuracy is checked over time
      - The agency’s AI governance may require an impact assessment and a listing in its AI use case inventory first
      - What’s sent to a model may include personal or sensitive information, so where it’s processed and kept matters
    ways:
      - id: platform
        approach: platform
        title: An AI model the agency approves
  works_with:
    - to: shared-case-platform
      note: Suggestions appear in the platform’s intake queue.

- id: sam-gov-entity-checks
  title: Entity Checks through SAM.gov’s APIs
  description: "An example architecture: the agency’s award systems check each applicant’s or offeror’s SAM.gov registration, exclusions, and responsibility and qualification records through SAM.gov’s APIs, before an award and on a schedule while it’s open, and show the results, with their dates, where staff make the decision."
  sources: [ sam-gov ]
  attributes:
    role: connections
    parts:
      - Calls to SAM.gov’s entity and exclusions services by Unique Entity Identifier
      - A check before each award, with the results and their date saved to the award file
      - Rechecks on a schedule for open awards, such as for expiring registrations or new exclusions
      - Alerts to the responsible staff when a result changes
      - A record of each check, for audits and file reviews
    strengths:
      - Checks happen every time, with proof in the file
      - Changes after an award, such as a new exclusion, are noticed
      - Grants and contract systems can share the same checks
    fitsWhen:
      - Staff check SAM.gov by hand and save screenshots today
      - The agency’s award systems can call outside services
    watchFor:
      - A check only shows the records, and the award decision, such as a responsibility determination, is still a person’s
      - SAM.gov’s services and keys change, and someone has to keep the connection working
      - Some records need a federal user’s access, so how the system signs in to SAM.gov needs approval
    ways:
      - id: build
        approach: build
        title: A connection to SAM.gov’s APIs

- id: records-in-business-systems
  title: Records Schedules in Each Business System
  description: "An example architecture: each business system, such as a case or audit system, applies the agency’s records schedules to what it holds, keeping each record for its retention period, holding records during litigation or an investigation, and disposing of or transferring them when the schedule says."
  sources: [ records-44-usc-3101, nara-grs ]
  attributes:
    role: data-records
    parts:
      - Each kind of record in the system mapped to its records schedule item
      - Retention periods that start from the right event, such as a case’s closure
      - Holds that stop disposal during litigation, audits, or investigations
      - Disposal with the records officer’s approval, or transfer of permanent records to the National Archives
      - A report of what was disposed of or transferred, and when
    strengths:
      - Records are kept as long as required, and not much longer
      - A cleanup can’t remove records under a hold
      - Permanent records reach the National Archives in a form it accepts
    fitsWhen:
      - Business systems keep records with no retention rules today
      - The agency is moving to fully electronic records
    watchFor:
      - Mapping each kind of record to a schedule item takes records officers’ time
      - Older systems may not support holds or disposal, so records pile up
      - Disposal needs the records officer’s approval, and a record of it
    ways:
      - id: built-in
        approach: product
        title: Each system’s own retention features
        description: Retention rules, holds, and disposal set up in each system that supports them.
        fitsWhen:
          - The office’s systems have good retention features
        watchFor:
          - Each system is set up and checked on its own
      - id: records-service
        approach: platform
        title: An agency records service
        description: An agency records management service that applies schedules and holds across the systems connected to it.
        fitsWhen:
          - The agency runs a records service its systems can connect to
        watchFor:
          - Each system needs a connection, and offices must agree who can place and see holds on their records
  works_with:
    - to: records-aware-collaboration
      note: Business systems keep their records on schedule, and the collaboration workspace keeps documents and messages on schedule.
