id: "capability:address-validation"
title: "Address Validation"
layer: "shared"
status: "draft"
responsibility: "Check that an address exists and is deliverable, and return it in a standard form."
boundaries: "It assesses addresses; it doesn't decide which address is a person's or organization's address of record."
operations:
  - name: "Address.validate"
    description: "Check and standardize an address."
    accepts: ["address"]
    returns: ["standardized address", "validation result"]
entities: ["address"]
policies: ["data-governance"]
depends_on: []
signs:
  - "Notices come back undeliverable."
  - "Each form validates addresses differently, or not at all."
questions:
  - "How often are notices returned as undeliverable?"
