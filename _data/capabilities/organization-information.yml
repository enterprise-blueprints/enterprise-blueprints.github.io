id: "capability:organization-information"
title: "Organization Information"
layer: "shared"
status: "draft"
responsibility: "Provide an authorized view of an organization, such as a company, vendor, grantee, or agency, from the authoritative records, and match new information to it."
boundaries: "It reads and matches; it changes an authoritative record only where its owner has agreed. Registration and vendor management processes own their own records."
operations:
  - name: "Organization.lookup"
    description: "Find organizations that match identifying details."
    accepts: ["identifying details"]
    returns: ["candidate matches"]
  - name: "Organization.get"
    description: "Return the view of an organization that the requester may see."
    accepts: ["organization ID", "purpose"]
    returns: ["authorized organization view"]
  - name: "Organization.match"
    description: "Say whether new details belong to an existing organization."
    accepts: ["organization details"]
    returns: ["match", "confidence"]
entities: ["organization", "address"]
policies: ["authorization", "audit", "data-governance"]
depends_on: []
signs:
  - "Vendors and grantees are recorded separately in each program."
  - "Nobody can list every case involving the same company."
questions:
  - "Which system is authoritative for vendors, grantees, and other organizations?"
