# The mission effectiveness model for Inspector General Investigations: the
# conditions and behaviors that shape its outcomes, how they influence each
# other, the loops they form, and the interventions that would change them.
# The outcomes themselves are on the mission page. Solution Studio reads this
# file to rank where an office's work most needs to improve.
mission: mission.inspector-general-investigations
factors:
- id: caseload
  type: condition
  title: Investigator caseload
  description: The number and complexity of open cases each investigator carries. A heavy caseload leaves less time for any one case.
  better: lower
  pattern: capacity
  signals:
  - Investigators carry more cases than they can actively work.
  - New allegations wait for someone to have room.
  questions:
  - How many open cases does a typical investigator carry, and how many are active?
  - How do you decide when an office has too much work?
  metrics:
  - name: Open cases per investigator
    measurement: Open cases divided by investigators on board, by office, at month end.
    better: lower
  steps:
  - process.oig-investigative-work#assign-owner
  - process.oig-caseload-oversight#monitor-workload
  known_by:
  - aigi
- id: allegation-volume
  type: condition
  title: Volume of incoming allegations
  description: How many complaints, hotline submissions, and referrals arrive. Volume rises when people trust that reports lead to action.
  better: neutral
  signals:
  - Hotline volume jumped after a high-profile case.
  - Intake staff can’t keep up with new submissions.
  questions:
  - How has allegation volume changed over the last three years, and why?
  - What share of allegations becomes an investigation?
  metrics:
  - name: Allegations received per month
    measurement: Count of complaints, hotline submissions, and referrals recorded at intake.
    better: neutral
  steps:
  - process.oig-complaint-intake#receive-allegation
  known_by:
  - hotline
- id: triage-criteria
  type: condition
  title: Clear criteria for accepting and prioritizing allegations
  description: Written, shared criteria that decide which allegations become investigations, which go elsewhere, and in what order.
  better: higher
  signals:
  - Similar allegations are handled differently depending on who reviews them.
  - Priority depends on who is asking.
  questions:
  - Who decides whether an allegation becomes an investigation, and on what basis?
  - Are the criteria written down? When were they last updated?
  steps:
  - process.oig-complaint-triage#triage-allegation
  - process.oig-complaint-triage#decide-disposition
  known_by:
  - hotline
- id: decision-rights
  type: condition
  title: Clear decision rights for case actions
  description: Everyone knows who may open, assign, escalate, refer, and close a case, and those people can act without unnecessary handoffs.
  better: higher
  pattern: decision-rights
  signals:
  - Cases wait for approvals nobody is sure they need.
  - The same decision goes up two or three levels.
  questions:
  - Which case decisions need approval, and from whom?
  - Where do cases most often wait for a decision?
  steps:
  - process.oig-complaint-triage#decide-disposition
  - process.oig-reporting-and-referral#approve-findings
  - process.oig-caseload-oversight#resolve-delay
- id: dependency-visibility
  type: condition
  title: Supervisors can see external dependencies
  description: Supervisors can see which cases are waiting on records requests, subpoenas, interviews, or partner agencies, and have the authority to intervene.
  better: higher
  pattern: visibility
  signals:
  - Nobody knows how long a case has waited on another agency.
  - Supervisors learn about stalled requests in quarterly reviews.
  questions:
  - How do supervisors find out that a case is waiting on someone outside the office?
  - What can a supervisor do when a request stalls?
  metrics:
  - name: Days cases wait on external requests
    measurement: Median days from request sent to response received, by request type.
    better: lower
  steps:
  - process.oig-investigative-work#request-records
  - process.oig-caseload-oversight#monitor-workload
  known_by:
  - sac
- id: closure-pressure
  type: condition
  title: Pressure to close cases
  description: Performance targets, reporting cycles, or leadership attention that emphasize the number of closed cases over their quality.
  better: lower
  pattern: incentives
  signals:
  - Closure counts dominate performance reviews or the semiannual report.
  - There is a push to close cases before the end of a reporting period.
  questions:
  - How is investigative performance measured today, and who looks at it?
  - What happens when an office’s closure numbers fall?
  steps:
  - process.oig-investigative-work#supervisory-review
  - process.oig-case-closure#check-completion
  known_by:
  - inspector-general
- id: related-case-access
  type: condition
  title: Investigators can find related cases and prior allegations
  description: Investigators can search earlier complaints, cases, subjects, and entities to see what the office already knows.
  better: higher
  pattern: information-access
  signals:
  - Investigators learn about a related case by asking around.
  - The same subject appears in cases nobody connected.
  questions:
  - Before opening a case, how does an investigator check what the office already knows about the subject?
  - How far back can they search, and across which systems?
  steps:
  - process.oig-complaint-triage#check-related
  known_by:
  - special-agents
- id: evidence-handling
  type: condition
  title: Reliable evidence handling and chain of custody
  description: Physical and digital evidence is captured, stored, and tracked so its integrity can be shown.
  better: higher
  signals:
  - Evidence logs live in spreadsheets or paper binders.
  - Digital evidence sits on shared drives or individual laptops.
  questions:
  - How do you record who handled a piece of evidence and when?
  - Where does digital evidence live, and who can change it?
  steps:
  - process.oig-investigative-work#collect-evidence
  known_by:
  - special-agents
  - counsel
- id: partner-relationships
  type: condition
  title: Working relationships with prosecutors and partner agencies
  description: Established contacts, agreements, and expectations with prosecutors, law enforcement, and agency management.
  better: higher
  signals:
  - Referrals go to whoever an investigator happens to know.
  - Partners don’t know what a referral package should contain.
  questions:
  - Which prosecutors and partners do you work with most, and how is that relationship managed?
  - How often do referrals come back for more information?
  steps:
  - process.oig-investigative-work#consult-prosecutor
  - process.oig-reporting-and-referral#refer-for-action
  known_by:
  - prosecutors
- id: case-data-quality
  type: condition
  title: Complete and consistent case data
  description: Case records use consistent categories and fields, and are complete enough to report from without manual cleanup.
  better: higher
  pattern: data-quality
  signals:
  - Building the semiannual report takes weeks of reconciling spreadsheets.
  - Each office codes allegations differently.
  questions:
  - How long does it take to answer a question like “how many procurement fraud cases did we close last year?”
  - Who fixes data problems, and when?
  metrics:
  - name: Staff hours to compile the semiannual report
    measurement: Hours recorded by staff who gather and reconcile case statistics for each report.
    better: lower
  steps:
  - process.oig-complaint-intake#receive-allegation
  - process.oig-case-closure#report-results
  known_by:
  - analytics
  - oig-it
- id: information-protection
  type: condition
  title: Investigative information is protected and independent
  description: Case information is limited to people with a need to know, every access is logged, and agency staff outside the OIG can't see or change OIG records. Complainant and witness identities stay confidential.
  better: higher
  pattern: independence
  signals:
  - Agency IT administrators can reach OIG files or mailboxes.
  - Anyone in the office can open any case.
  - Nobody can say who viewed a case file last month.
  questions:
  - Who outside the OIG could see or change investigative records today, including administrators?
  - How do you restrict access to sensitive cases, and how would you know if someone looked?
  - How are complainant and whistleblower identities protected?
  steps:
  - process.oig-complaint-intake#protect-complainant
  known_by:
  - counsel
  - oig-it
- id: early-escalation
  type: behavior
  title: Investigators escalate stalled requests early
  description: Investigators notice when a records request, subpoena, or partner action has stalled, and raise it before it delays the case.
  better: higher
  signals:
  - Requests sit for months before anyone follows up.
  - Escalation depends on the individual investigator.
  questions:
  - When a request goes unanswered, what does an investigator do, and when?
  metrics:
  - name: Overdue external requests without follow-up
    measurement: External requests past their due date with no follow-up recorded in the last 14 days.
    better: lower
  steps:
  - process.oig-investigative-work#request-records
  - process.oig-caseload-oversight#resolve-delay
  known_by:
  - special-agents
- id: substantive-review
  type: behavior
  title: Supervisors conduct substantive case reviews
  description: Supervisors regularly review the evidence, plan, and direction of each case, not just its status.
  better: higher
  signals:
  - Case reviews are status meetings.
  - Evidentiary gaps surface only when the report is drafted.
  questions:
  - How often does a supervisor review a case, and what do they look at?
  - Where are review results recorded?
  metrics:
  - name: Cases reviewed on schedule
    measurement: Share of open cases with a documented supervisory review within the required interval.
    better: higher
  steps:
  - process.oig-investigative-work#supervisory-review
  known_by:
  - sac
- id: rushed-work
  type: behavior
  title: Reviews and documentation are rushed
  description: Under pressure, staff shorten reviews and write up work late or thinly.
  better: lower
  signals:
  - Interview write-ups are done weeks after the interview.
  - Reviews happen just before closure.
  questions:
  - When do investigators write up interviews and activities?
  - Which steps get skipped when the team is busy?
  steps:
  - process.oig-investigative-work#conduct-interviews
  - process.oig-investigative-work#supervisory-review
  - process.oig-reporting-and-referral#review-report
- id: consistent-triage
  type: behavior
  title: Intake staff triage allegations consistently
  description: Intake staff apply the same criteria to similar allegations, and route each one promptly.
  better: higher
  signals:
  - Allegations are reassigned after triage because they went to the wrong place.
  questions:
  - How long does an allegation wait before someone decides what to do with it?
  metrics:
  - name: Days from receipt to triage decision
    measurement: Median days from an allegation’s receipt to its recorded disposition.
    better: lower
  steps:
  - process.oig-complaint-triage#triage-allegation
  - process.oig-complaint-triage#decide-disposition
  known_by:
  - hotline
- id: related-case-check
  type: behavior
  title: Staff check for related cases before opening
  description: Before opening a case, staff check for earlier allegations, open cases, and known subjects.
  better: higher
  signals:
  - Two offices investigate the same subject without knowing.
  questions:
  - Is checking for related cases a required step? How is it recorded?
  steps:
  - process.oig-complaint-triage#check-related
- id: contemporaneous-documentation
  type: behavior
  title: Investigators document work as it happens
  description: Interviews, evidence, and decisions are recorded in the case file close to when they occur.
  better: higher
  signals:
  - Case files are assembled at the end.
  questions:
  - How long after an interview is the memorandum of interview completed?
  metrics:
  - name: Days from activity to documentation
    measurement: Median days between an investigative activity and its write-up in the case file.
    better: lower
  steps:
  - process.oig-investigative-work#conduct-interviews
  - process.oig-investigative-work#collect-evidence
  known_by:
  - special-agents
- id: early-prosecutor-engagement
  type: behavior
  title: Investigators engage prosecutors early
  description: Investigators consult prosecutors when a case shows criminal potential, rather than only at referral.
  better: higher
  signals:
  - Referrals are declined for reasons that could have been addressed earlier.
  questions:
  - At what point do investigators first talk with a prosecutor about a case?
  steps:
  - process.oig-investigative-work#consult-prosecutor
- id: caseload-balancing
  type: behavior
  title: Supervisors rebalance caseloads
  description: Supervisors watch workload and case age, and move or close out work before it piles up.
  better: higher
  signals:
  - Some investigators are overloaded while others have room.
  questions:
  - How do supervisors decide who gets the next case?
  steps:
  - process.oig-caseload-oversight#monitor-workload
  - process.oig-investigative-work#assign-owner
  known_by:
  - sac
outcome_notes:
  timely-investigations:
    questions:
    - Which cases take longest, and where do they wait?
    known_by:
    - aigi
  rework:
    questions:
    - How often do reports go back for more work, and why?
  backlog:
    questions:
    - How many allegations are waiting for triage, and how many cases are waiting for an investigator?
    known_by:
    - aigi
  referral-acceptance:
    questions:
    - What share of referrals is accepted, and why are the others declined?
    known_by:
    - aigi
    - prosecutors
  defensible-findings:
    questions:
    - When were findings last challenged, and what happened?
    known_by:
    - counsel
  accountability:
    known_by:
    - inspector-general
  public-trust:
    known_by:
    - inspector-general
