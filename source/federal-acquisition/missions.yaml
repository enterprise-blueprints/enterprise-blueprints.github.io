- id: acquiring-goods-and-services
  title: Acquiring Goods and Services for the Government
  description: "Buy what the agency needs, when it needs it, through open and fair competition, from responsible contractors, with a fair share for small businesses; see that contractors deliver what they agreed to and are paid on time; make award decisions that stand up to challenge; report the spending publicly; and close each contract when the work is done."
  sources: [ far, competition-41-usc-3301 ]
