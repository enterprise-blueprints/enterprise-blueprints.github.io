# Capabilities, in the order the pages show them, each with the links it holds.

- id: oversight-planning
  title: Oversight Planning
  stage: plan-prepare
  description: Ability to decide what the office will audit, inspect, evaluate, and look into, from the agency’s risks, its most serious management and performance challenges, the work the law requires, and requests from Congress and agency leaders, and to keep a plan with each project’s scope, schedule, and status.
  sources: [ cigie-silver-book, reports-consolidation-31-usc-3516 ]
  applicabilityNotes: Offices plan for a year or several, and change the plan as new risks and requests arrive. Some work, such as financial statement audits and reviews the law requires, is in every plan.
  contributes_to: [ effective-programs, fraud-waste-abuse-prevented ]
  satisfies: [ plan-oversight-work, summarize-management-challenges ]
  candidate_pattern:
    - to: audit-management-system
      coverage: partial
      note: Holds the plan, with each project’s scope, schedule, and status. Choosing the work is the office’s judgment.
    - to: oversight-data-analytics
      coverage: partial
      note: Shows where the risk is in the agency’s own data, to inform what goes in the plan.

- id: complaint-allegation-disclosure-intake
  title: Complaint, Allegation & Disclosure Intake
  stage: reach-take-in
  description: Ability to receive, acknowledge, classify, and appropriately route allegations of wrongdoing, fraud, waste, abuse, and relevant disclosures through authorized channels.
  sources: [ ig-act-404, oversight-hotline, cigie-faq ]
  applicabilityNotes: Confidentiality and routing rules vary. Specific retaliation complaints or protected disclosures may need referral to another legally authorized entity.
  attributes:
    scope: US-federal-OIG
  contributes_to: [ fraud-waste-abuse-prevented, concerns-raised-safely ]
  satisfies:
    - multi-channel-intake
    - acknowledge-receipt
    - triage-and-route
    - protect-reporter-identity
  candidate_pattern:
    - to: oversight-intake-case-tracking
      id: oig-candidate-pattern-1
    - to: confidential-hotline-intake
      coverage: partial
      note: Takes reports from the public, including anonymous ones. Classifying and routing them happens in the case system it feeds.
    - to: ai-assisted-intake-sorting
      coverage: partial
      note: Suggests a category and where to route each allegation, and intake staff decide. What the model sees must keep the identity of people who report confidential.

- id: audit-inspection-evaluation
  title: Audit, Inspection & Evaluation
  stage: assess-decide
  description: Ability to plan, conduct, supervise, or coordinate independent, objective examinations of programs, operations, performance, and controls.
  sources: [ ig-act-404, oversight-mission, cigie-faq ]
  applicabilityNotes: Methodologies, mandatory reviews, professional standards, and jurisdiction depend on the OIG and engagement.
  attributes:
    scope: US-federal-OIG
  contributes_to: [ effective-programs, fraud-waste-abuse-prevented ]
  satisfies: [ follow-professional-standards, document-findings, get-timely-access-to-records ]
  candidate_pattern:
    - audit-management-system
    - to: oversight-data-analytics
      coverage: partial
      note: Helps choose and scope audits, inspections, and evaluations. Doing and documenting them happens elsewhere.

- id: investigation-management
  title: Investigation Management
  stage: assess-decide
  description: Ability to assess allegations within jurisdiction, plan authorized investigative work, manage evidence and case progress, and document investigative results or referrals.
  sources: [ ig-act-404, oversight-mission, cigie-faq ]
  applicabilityNotes: Law enforcement powers, case types, investigative jurisdiction, evidence handling, and disclosure restrictions vary by legal authority.
  attributes:
    scope: US-federal-OIG
  contributes_to: [ fraud-waste-abuse-prevented ]
  satisfies: [ track-case-status, link-evidence, restrict-case-access, refer-possible-crimes ]
  candidate_pattern:
    - to: oversight-intake-case-tracking
      id: oig-candidate-pattern-2
    - to: oversight-data-analytics
      coverage: partial
      note: Finds leads. Each one is assessed and investigated in the case system.
    - to: digital-evidence-store
      coverage: partial
      note: Keeps digital evidence and its custody. The case itself is managed in the case system.

- id: whistleblower-protection
  title: Whistleblower Protection
  stage: assess-decide
  description: Ability to educate agency employees about the protections against retaliation for protected disclosures and the ways to seek review, and to receive, investigate, and decide complaints of reprisal, including those from employees of contractors and grantees, within the time the law allows.
  sources: [ ig-act-403, ig-act-407, contractor-whistleblower-41-usc-4712 ]
  applicabilityNotes: Federal employees can also take reprisal complaints to the Office of Special Counsel, and some go on to the Merit Systems Protection Board. The Whistleblower Protection Coordinator explains the routes but doesn’t represent the employee. Intelligence community elements follow their own provisions.
  contributes_to: [ concerns-raised-safely ]
  satisfies: [ educate-about-retaliation-protections, decide-contractor-reprisal-complaints ]
  candidate_pattern:
    - to: oversight-intake-case-tracking
      coverage: partial
      note: Reprisal complaints as a case type of their own, with the 180-day clock. Educating employees happens elsewhere.
    - to: confidential-hotline-intake
      coverage: partial
      note: Takes reprisal complaints, and links to the rights and routes employees need to know.

- id: recommendations-corrective-action-monitoring
  title: Recommendations & Corrective Action Monitoring
  stage: monitor-correct
  description: Ability to issue findings or recommendations where authorized, track responses and progress, and monitor implementation of corrective measures.
  sources: [ ig-act-404, oversight-mission ]
  applicabilityNotes: OIGs generally recommend and monitor; they do not universally possess authority to implement or compel agency corrective actions.
  attributes:
    scope: US-federal-OIG
  contributes_to: [ effective-programs, problems-corrected ]
  satisfies: [ track-recommendations, follow-to-management-decision, report-open-recommendations ]
  candidate_pattern: [ audit-management-system, shared-recommendation-tracker ]

- id: quality-assurance
  title: Quality Assurance & Peer Review
  stage: monitor-correct
  description: Ability to check the office’s own audits, inspections, evaluations, and investigations against the standards they follow, to take part in external peer reviews of the office and by it, and to act on what the reviews find.
  sources: [ cigie-silver-book, gao-yellow-book, cigie-qar-investigations ]
  applicabilityNotes: Audit work under the Yellow Book has an external peer review at least once every 3 years. Investigations peer reviews apply to offices with statutory law enforcement authority, on the schedule CIGIE sets.
  contributes_to: [ work-meets-standards ]
  satisfies: [ quality-assurance-peer-review, investigations-peer-review, report-peer-review-results ]
  candidate_pattern:
    - to: audit-management-system
      coverage: partial
      note: Keeps quality control reviews and their results with the engagements they cover, and gives peer reviewers the work papers they sample.
    - to: oversight-intake-case-tracking
      coverage: partial
      note: Gives investigations peer reviewers the case files they sample, with each case’s history.

- id: oversight-reporting-communication
  title: Oversight Reporting & Communication
  stage: report-close
  description: Ability to communicate independent oversight findings, recommendations, material risks, and work results to the appropriate officials and public audiences consistent with law.
  sources: [ ig-act-404, oversight-mission, cigie-faq ]
  applicabilityNotes: Reporting cadence, content, recipients, and confidentiality depend on legal requirements and the sensitivity of the work. Whistleblower education and coordination may be separate supporting functions.
  attributes:
    scope: US-federal-OIG
  contributes_to: [ leaders-congress-informed ]
  satisfies: [ periodic-reporting, report-serious-problems, publish-reports ]
  candidate_pattern:
    - to: shared-recommendation-tracker
      coverage: partial
      note: Lists of open recommendations for the semiannual report and the website. The rest of the report comes from elsewhere.
    - oversight-reporting-from-source-data
    - to: letters-from-case-data
      coverage: partial
      note: Drafts of routine notices and report sections, with the office’s wording, from the case and audit data.
