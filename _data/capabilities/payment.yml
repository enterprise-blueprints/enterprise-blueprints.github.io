id: "capability:payment"
title: "Payment"
layer: "shared"
status: "draft"
responsibility: "Take and make payments, and report their status, under the enterprise's financial controls."
boundaries: "The financial system of record keeps the ledger. Programs decide what is owed or payable; Payment carries it out and reports back."
operations:
  - name: "Payment.request"
    description: "Request a payment to or from a person or organization."
    accepts: ["payer or payee", "amount", "purpose", "approval"]
    returns: ["payment ID"]
  - name: "Payment.getStatus"
    description: "Report whether a payment is pending, made, or failed."
    accepts: ["payment ID"]
    returns: ["payment status"]
entities: ["payment", "person", "organization"]
policies: ["authorization", "audit", "security", "records"]
depends_on: ["approval", "identity"]
signs:
  - "Staff check payment status in a separate financial system."
  - "Several programs integrate with the financial system in different ways."
questions:
  - "Does this work take or make payments, and through which systems?"
