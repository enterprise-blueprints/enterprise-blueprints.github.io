name: Validate, build, and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Allow one deployment at a time, but don't cancel one that's in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate content
        run: python scripts/validate_content.py

      - name: Test the validator
        run: python -m unittest discover -s scripts -p "test_*.py"

  build:
    name: Build site
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # lets configure-pages read the Pages settings
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Reads the repository's Pages settings to find the base path:
      # "" for a user/organization site, "/repo-name" for a project site.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${BASE_PATH}"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          JEKYLL_ENV: production

      - name: Check internal links
        run: python scripts/check_links.py _site --baseurl "${BASE_PATH}"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Also build under a project-site path, so a missing `relative_url`
      # filter is caught even when the real site is served from the root.
      - name: Check links under a project-site base path
        run: |
          bundle exec jekyll build --baseurl /baseurl-check --destination _site_baseurl_check
          python scripts/check_links.py _site_baseurl_check --baseurl /baseurl-check

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
