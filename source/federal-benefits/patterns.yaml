# Implementation patterns, in the order the pages show them, each with the links it holds.

- id: benefits-claims-system
  title: Benefits Claims System
  description: "An example architecture: one claims system that carries each claim from intake through evidence, checks, decision, and notice, then holds the benefit while it’s paid, with its changes, reviews, and payee."
  sources: [ apa-5-usc-555, va-decision-notices, acus-2021-10 ]
  attributes:
    layer: business-applications
    parts:
      - One record for each person, with their claims, benefits, and representative
      - Work queues that send each claim to the right staff, with its deadlines and target dates
      - Checklists of what each claim still needs, with requests and follow-ups
      - Recorded decisions, with the rules applied, the evidence weighed, and who decided
      - Each benefit’s amount, start date, payment details, and payee
      - Changes, scheduled reviews, and requests for review, tied to the benefit they affect
      - A history of who did what, which quality reviewers and reviewers on appeal can read
    strengths:
      - People and staff see the same status for each claim
      - A decision and its reasons stay with the claim through any review
      - Workload and wait figures come from the work itself
    fitsWhen:
      - The office handles many claims with similar steps
      - Its current tools are an aging system with paper or side spreadsheets around it
    watchFor:
      - Moving open claims and years of benefit history out of an old system needs careful planning
      - Old systems often hold rules no one has written down
      - Replacing everything at once is risky, so plan to move one benefit or step at a time
    ways:
      - id: product
        approach: product
        title: A benefits administration product
        description: A product made for benefits or claims work, configured for the program’s rules and run by the agency.
        strengths:
          - Common steps, such as work queues and letters, come ready
        fitsWhen:
          - The program’s steps are close to those the product expects
        watchFor:
          - Rules specific to the program can mean heavy configuration
          - Another product to buy, secure, and keep up
      - id: agency-platform
        approach: platform
        title: The agency’s shared case platform
        description: Claims, steps, and work queues built on the agency’s shared case platform.
        strengths:
          - Uses licenses, skills, and security approvals the agency already has
          - Claims can share a platform with the agency’s other case work
        fitsWhen:
          - The agency already runs a case platform with staff who know it
        watchFor:
          - Very high claim volumes need testing early
          - Paying benefits for years is different from closing a case, so plan how the benefit record works
      - id: custom-build
        approach: build
        title: A claims system built for the program
        description: The agency’s own system, built in small releases around the program’s rules, usually replacing an old system one piece at a time.
        strengths:
          - Fits programs too large or unusual for a product
          - The agency can change it as the law changes
        fitsWhen:
          - The program is very large, and has digital staff to keep the system going
        watchFor:
          - It needs a lasting team, not just a project
          - Parts of the old and new systems will run side by side for years
  depends_on:
    - to: shared-case-platform
      way: agency-platform
      note: Claims and their steps are the shared platform, set up for the program.
  works_with:
    - to: eligibility-rules-service
      note: The claims system asks the rules service what the rules give for a set of facts.
    - to: claim-evidence-folder
      note: Each claim opens onto its documents in the evidence folder.
    - to: letters-from-case-data
      note: Notices are drafted from the claim and saved back to it.

- id: benefits-online-account
  title: Online Benefits Account
  description: "An example architecture: one online account where people apply, save and come back, send documents, see where their claim stands, read their notices, report changes, and ask for a review, with the same steps open to their representatives."
  sources: [ idea-act, section-508-standards, plain-writing-act ]
  attributes:
    layer: public-facing
    parts:
      - Applications that can be saved and finished later, with a saved start holding the filing date where the program allows
      - Questions that show only what applies, and fill in what the office already knows
      - Claim status in plain words, with what happens next and about how long it takes
      - Document upload from a phone or a computer
      - Notices to read online, with a choice of mail as well
      - Self-service changes, such as an address or bank account, with extra checks on the riskiest ones
      - Access for representatives and payees, under their own sign-in
    strengths:
      - People can see where things stand without calling
      - Online claims arrive complete and ready to work
      - Fewer status calls leave staff more time for people who need help
    fitsWhen:
      - Many people claim on paper or phone calls just to ask where their claim stands
      - The claims system can share status and take in claims through APIs
    watchFor:
      - Online is the easiest way in, never the only way, so staff need to see what people did there
      - Testing with real claimants, including people with disabilities, is what makes it work
      - Bank account changes attract fraud, so those steps need the strongest checks
    ways:
      - id: product-portal
        approach: product
        title: The portal in a benefits product
        description: The public portal that comes with the benefits administration product, configured and branded for the program.
        strengths:
          - Comes connected to the claims system
        fitsWhen:
          - The office has chosen a benefits product with a portal that meets its needs
        watchFor:
          - Check it against accessibility standards and with real users before relying on it
      - id: agency-built
        approach: build
        title: An account the agency builds
        description: The agency’s own site, using its design system and calling the claims system through APIs.
        strengths:
          - Can be shaped around what claimants need, and tested as it’s built
          - Can sit alongside the agency’s other online services
        fitsWhen:
          - The agency has digital staff, and serves many people across several programs
        watchFor:
          - It needs a lasting team
          - It depends on the claims system having good APIs
  works_with:
    - to: public-sign-in
      note: People sign in through the sign-in service before seeing anything of their own.
    - to: benefits-claims-system
      note: Claims, status, and changes pass between the account and the claims system.

- id: eligibility-rules-service
  title: Eligibility Rules Service
  description: "An example architecture: the program’s eligibility and payment rules kept in one service, separate from the claims system, written so program staff can read them, versioned by date, and tested against known cases."
  sources: [ acus-2021-10, apa-5-usc-555 ]
  attributes:
    layer: business-applications
    parts:
      - Rules written in a form program staff can read and check against the law
      - Versions by effective date, so a claim uses the rules in force for its dates
      - A set of test cases with known answers, run before any change goes live
      - An answer that shows which rules applied and why, for the decision record
      - The same rules available to the claims system, the online account, and estimators
    strengths:
      - The same facts get the same answer, wherever they’re entered
      - A change in the law is made once, and can be tested before it applies
      - The reasons behind an answer can go into the notice
    fitsWhen:
      - The program’s rules are complex, or change often
      - Today the rules are buried in old code, or in what experienced staff know
    watchFor:
      - Writing down rules from an old system takes longer than it looks
      - Rules that call for judgment, such as weighing medical evidence, stay with staff
      - Someone in the program must own each rule, not just the technical team
    ways:
      - id: rules-product
        approach: product
        title: A business rules product
        description: A rules product that holds the program’s rules, with tools for writing, versioning, and testing them.
        strengths:
          - Tools for writing and testing rules come ready
        fitsWhen:
          - The agency has staff to learn the product and many rules to manage
        watchFor:
          - The rules can end up tied to the product’s format
      - id: rules-as-code
        approach: build
        title: Rules kept as tested code
        description: Rules written as code in a shared repository, with program staff reviewing each change and tests running on every one.
        strengths:
          - Changes are visible, reviewed, and tested like any other code
          - Nothing extra to license
        fitsWhen:
          - The agency has developers working closely with program staff
        watchFor:
          - Program staff need a way to read the rules that doesn’t require reading code
  works_with:
    - to: benefits-claims-system
      note: The claims system records the rules’ answer with the decision.

- id: claim-evidence-folder
  title: Electronic Claim Evidence Folder
  description: "An example architecture: every document for a claim, from uploads, scanned mail, other agencies, and doctors, kept in one electronic folder, labeled by type and date, where staff, reviewers, and the person can reach it."
  sources: [ va-duty-to-assist, va-decision-notices, section-508-standards ]
  attributes:
    layer: data-records
    parts:
      - A central place that scans incoming mail, and sends the originals on to be kept or destroyed on schedule
      - Uploads from the online account and representatives
      - Records received from other agencies and medical providers, electronically where possible
      - Labels for each document’s type, date, and source, added automatically and checked by staff
      - Search across a long file, with duplicates set aside
      - Access by role, with each view recorded
    strengths:
      - Staff in any location can work a claim right away
      - Nothing waits on a paper file moving between offices
      - Reviewers and appeals see the same evidence the first decision used
    fitsWhen:
      - Claims still depend on paper files, or evidence is scattered across systems
      - Files are long, such as medical records built up over years
    watchFor:
      - Scanning quality matters, since a poor image can hide evidence
      - Evidence folders hold sensitive health information, so limit who can see what
      - Records schedules apply, including to the paper after it’s scanned
    ways:
      - id: content-product
        approach: product
        title: A content management product
        description: A document or content management product, with scanning and labeling, connected to the claims system.
        strengths:
          - Scanning, search, and retention come ready
        fitsWhen:
          - The office receives a large volume of paper
        watchFor:
          - Connections to the claims system take work
      - id: scanning-service
        approach: combine
        title: A scanning service and the agency’s document store
        description: A contracted mail and scanning center sends labeled images to the agency’s document store, which the claims system reads.
        strengths:
          - The office doesn’t run its own scanning
          - Volume can rise and fall with the contract
        fitsWhen:
          - The agency has a document store, and wants to hand off the mail work
        watchFor:
          - The contract needs quality standards and turnaround times the office can check
  works_with:
    - to: ai-evidence-summaries
      note: Summaries read from the labeled documents in the folder.

- id: public-sign-in
  title: Public Sign-In and Identity Verification
  description: "An example architecture: people sign in through a government sign-in service that verifies identity to the level each service needs, while the office’s systems decide what each person can see and do."
  sources: [ nist-sp-800-63-4, login-gov, idea-act ]
  attributes:
    layer: security-identity
    parts:
      - Sign-in with multi-factor authentication
      - Identity verification to the level each service needs, following NIST SP 800-63-4
      - The office’s own link between a verified person and their records
      - Stronger checks for risky actions, such as changing a bank account
      - Another way to confirm identity, in person or by phone, for people who can’t finish online
      - Signs of account takeover sent to the office’s fraud and security staff
    strengths:
      - People use one sign-in across government services
      - The office doesn’t have to run identity checks itself
      - Identity checks can match the risk of each service
    fitsWhen:
      - The office offers services that show personal information or change a payment
      - Its current sign-in is old, or weak against account takeover
    watchFor:
      - Remote identity verification doesn’t work for everyone, so the other way needs real capacity
      - Linking a verified person to the right record needs care, especially for common names
      - Moving people from an old sign-in takes time and clear messages
    ways:
      - id: login-gov
        approach: product
        title: Login.gov
        description: The government’s shared sign-in and identity verification service, connected to the office’s applications over OpenID Connect or SAML under an interagency agreement.
        strengths:
          - People may already have an account
          - The office doesn’t run the sign-in or verification itself
        fitsWhen:
          - Its service levels meet the office’s needs
        watchFor:
          - The level of identity assurance the office needs may call for facial matching, which some people won’t want or can’t use
      - id: agency-identity-service
        approach: platform
        title: The agency’s own public identity service
        description: An identity service the agency runs for the public, with an identity verification provider behind it.
        strengths:
          - The agency controls the experience and the verification steps
        fitsWhen:
          - The agency has many public services, and needs that a shared service doesn’t meet
        watchFor:
          - Running it, securing it, and keeping up with fraud are lasting work
  works_with:
    - to: benefits-online-account
      note: The online account relies on the sign-in service to know who’s there.

- id: eligibility-data-exchanges
  title: Eligibility Data Exchanges
  description: "An example architecture: connections to trusted data, such as Do Not Pay and other agencies’ records, that run at set points in a claim, save what came back to the claim, and send anything that needs a person’s attention to staff."
  sources: [ do-not-pay, do-not-pay-31-usc-3354, privacy-act, save-system-notice ]
  attributes:
    layer: connections
    parts:
      - Do Not Pay Connect, an API for screening inside the claims system
      - Connections to other agencies for facts such as earnings, deaths, and service records
      - DHS’s SAVE service, for programs whose rules depend on immigration status
      - Checks that run at the claim’s start, before payment, and on a schedule while the benefit is paid
      - Each result saved with the claim, with its source and date
      - A queue for matches staff need to confirm, with the notice and response time tracked
      - A list of each matching agreement, with its expiration date and an owner
    strengths:
      - Facts come from the source, so people are asked for less
      - Problems are caught before payment instead of after
      - Results are on record if a decision is reviewed
    fitsWhen:
      - The office checks facts by hand, or against files that arrive months late
      - Its improper payments come from information it could have had sooner
    watchFor:
      - A match isn’t a finding, so staff verify it before anything changes for the person
      - Matching agreements take months, and last only 18 months plus a renewal, so start early and watch the dates
      - Data from other agencies can be wrong or out of date, so people need a way to correct it
    ways:
      - id: api-connections
        approach: build
        title: API connections from the claims system
        description: The claims system calls each data source as a claim moves along, using Do Not Pay Connect and other agencies’ APIs.
        strengths:
          - Results arrive during the work, while they can still help
        fitsWhen:
          - The claims system can call APIs, and the data sources offer them
        watchFor:
          - Each connection needs its own security review and agreement
      - id: scheduled-batch
        approach: combine
        title: Scheduled batch matches
        description: The office sends files on a schedule, and matches come back through the Do Not Pay Web Portal or file exchanges for staff to work.
        strengths:
          - Works with older systems that can’t call APIs
          - A good place to start
        fitsWhen:
          - The claims system is old, or the source only offers files
        watchFor:
          - Results arrive after the moment they’d help most
  works_with:
    - to: payment-risk-analytics
      note: Match results feed the risk analytics.
    - to: benefits-claims-system
      note: Results are saved to the claim, and confirmed matches become work for staff.

- id: payments-through-treasury
  title: Payments through Treasury
  description: "An example architecture: the claims system produces each payment cycle’s file in Treasury’s standard format, the agency’s certifying officers certify it through the Secure Payment System, and Treasury pays by direct deposit or a Treasury-sponsored account."
  sources: [ treasury-payment-systems, eft-31-cfr-208, eo-14247, do-not-pay ]
  attributes:
    layer: connections
    parts:
      - A payment file in Treasury’s Standard Payment Request format, built from each benefit’s amount and payment details
      - Checks before release, such as totals against the last cycle and large or unusual changes
      - Certification through the Secure Payment System, by staff other than those who prepared the file
      - Treasury’s own screening of payments before they go out
      - Returned and failed payments brought back to the benefit record, with follow-up
      - Payment totals reconciled to the agency’s financial system
    strengths:
      - Treasury carries out the payments for the office
      - Each payment can be traced back to a decision
      - Electronic payments are safer and faster than checks
    fitsWhen:
      - The office pays benefits on a regular cycle
      - Treasury disburses its payments
    watchFor:
      - Once certified, payments can’t easily be held back, so checks come first
      - Bank account changes just before a payment date deserve a closer look
      - People without bank accounts, and those with waivers, need a way that works for them
    ways:
      - id: bulk-files
        approach: build
        title: Bulk payment files from the claims system
        description: The claims system sends files directly to Treasury, with a summary certified through the Secure Payment System.
        strengths:
          - Handles very large payment cycles
        fitsWhen:
          - The office makes many payments each cycle
        watchFor:
          - File formats change from time to time, so plan for updates
      - id: through-financial-system
        approach: combine
        title: Through the agency’s financial system
        description: The claims system sends approved payments to the agency’s financial system, which schedules them with Treasury.
        strengths:
          - Accounting entries and payment happen together
        fitsWhen:
          - Payments are fewer, or the agency handles all its payments this way
        watchFor:
          - Failed and returned payments have further to travel back to the claim
  works_with:
    - to: benefits-claims-system
      note: Each payment starts from a benefit’s amount and payment details in the claims system.

- id: overpayment-tracking
  title: Overpayment Tracking and Recovery
  description: "An example architecture: each overpayment tracked as a debt tied to the benefit it came from, from the first notice through waiver requests, appeals, repayment, and any referral to Treasury."
  sources: [ offset-31-usc-3716, treasury-offset-program, ssa-overpayments-42-usc-404, va-overpayment-waiver ]
  attributes:
    layer: business-applications
    parts:
      - A debt record showing how the overpayment arose and how the amount was worked out
      - Notices that explain the debt, the person’s rights, and the dates that apply
      - Waiver requests and appeals, with collection paused while the rules call for it
      - Repayment plans and withholding from ongoing payments
      - A count of days delinquent, and referral to the Treasury Offset Program when a debt is over 120 days
      - Amounts recovered, reconciled to the agency’s financial system
    strengths:
      - People get one clear explanation of what they owe and why
      - Collection doesn’t run ahead of a waiver request or an appeal
      - The office can see how much it’s owed, and why overpayments happen
    fitsWhen:
      - Overpayments are handled by letters and spreadsheets, or apart from the claim
      - People are often surprised by a debt, or get conflicting notices
    watchFor:
      - An overpayment can be years old by the time it’s found, so finding it early matters most
      - Automatic withholding can hurt, so check that notices and waiver steps come first
      - Debts belong in the agency’s financial records too, so agree which system is the source
    ways:
      - id: claims-system-module
        approach: platform
        title: A debt module in the claims system
        description: Overpayments tracked as part of the benefits claims system, with amounts sent to the financial system.
        strengths:
          - The debt sits next to the benefit and its history
        fitsWhen:
          - The claims system can hold debts and their steps
        watchFor:
          - Debts still need to reach the agency’s financial records
      - id: financial-system-receivables
        approach: product
        title: Receivables in the agency’s financial system
        description: The agency’s financial system holds the debt and does the collection, with waiver and appeal steps in the claims system.
        strengths:
          - Uses the debt tools and reports finance staff already have
        fitsWhen:
          - The agency’s financial system already handles debts and Treasury referrals
        watchFor:
          - The two systems must agree on when collection pauses
  depends_on:
    - to: benefits-claims-system
      way: claims-system-module
      note: The debt module is part of the claims system.
  works_with:
    - to: letters-from-case-data
      note: Overpayment notices are drafted from the debt record.

- id: ai-evidence-summaries
  title: AI Summaries of Claim Evidence
  description: "An example architecture: AI reads the documents in a claim’s evidence folder, finds what bears on each issue, and gives staff a summary that points to its sources, and staff decide."
  sources: [ m-25-21, acus-2021-10 ]
  attributes:
    layer: ai-insights
    parts:
      - Text read from scanned and uploaded documents
      - A summary of the evidence on each issue in the claim, with a link to each page it came from
      - A list of what seems to be missing, for staff to request
      - Staff checks on each summary before they rely on it
      - Testing before use, and sampling afterward, comparing summaries with the documents
      - A record of what the AI produced and what staff did with it
    strengths:
      - Staff find what matters in a long file sooner
      - Every point can be checked against its source page
      - Staff spend their time weighing evidence instead of hunting for it
    fitsWhen:
      - Files are long, and most of the time goes to reading them
      - The evidence is in an electronic folder, with good scans
    watchFor:
      - A summary can miss or misstate something, so staff check it against the source
      - If AI output becomes a principal basis for decisions, it’s presumed to be high-impact, with the practices that brings
      - Staff can come to lean on summaries, so sample for that too
      - Summaries point to evidence and never recommend an outcome
    ways:
      - id: agency-ai-service
        approach: platform
        title: The agency’s approved AI service
        description: A summarizing tool built on the AI service the agency has already approved for sensitive information.
        strengths:
          - Uses security approvals the agency already has
        fitsWhen:
          - The agency has an AI service approved for this kind of information
        watchFor:
          - It takes testing with the program’s own documents and staff
      - id: product-feature
        approach: product
        title: An AI feature in the claims or document product
        description: A summarizing feature that comes with the office’s claims or document product.
        strengths:
          - Sits where staff already work
        fitsWhen:
          - The product’s feature does well in testing on the program’s files
        watchFor:
          - Ask how it’s been tested, and what happens to the information
  works_with:
    - to: claim-evidence-folder
      note: Summaries link back to the documents in the folder.

- id: payment-risk-analytics
  title: Payment Risk Analytics
  description: "An example architecture: an analytics workspace that brings together claims, payments, match results, and past findings to point quality reviews and fraud work at the highest risks, and staff decide what to do."
  sources: [ fraud-controls-31-usc-3357, gao-fraud-risk-framework, m-25-21, payment-integrity-31-usc-3352 ]
  attributes:
    layer: ai-insights
    parts:
      - Regular feeds from the claims, payment, and sign-in systems
      - Flags for patterns worth a closer look, such as many claims paying into one account
      - Suggested samples for quality review and fraud work, which staff accept or change
      - Root causes of past overpayments and improper payments
      - A record of what was flagged, what staff decided, and what came of it
      - Regular checks for whether flags fall unfairly on some groups of people
    strengths:
      - Reviews go where the risk is
      - Problems can be stopped before more payments go out
      - Results show which risk signals are worth keeping
    fitsWhen:
      - The office pays too many people to review each one closely
      - Claims and payment data can be brought together regularly
    watchFor:
      - A flag isn’t a finding, and staff decide every step that affects a person
      - AI used to detect fraudulent use of services is presumed to be high-impact when it’s a principal basis for action
      - Wrong flags can delay or stop benefits people depend on, so keep track of false alarms
    ways:
      - id: analytics-workspace
        approach: build
        title: An analytics workspace
        description: The agency’s analytics tools, with the program’s data brought together for a small team of analysts.
        strengths:
          - Analysts can change what they look for as fraud changes
        fitsWhen:
          - The agency has analysts and a data platform
        watchFor:
          - Flags need a clear path to the staff who act on them
      - id: fraud-product
        approach: product
        title: A fraud analytics product
        description: A product made for detecting payment fraud, fed from the program’s data.
        strengths:
          - Comes with common fraud patterns
        fitsWhen:
          - The office has little analytics staff, and common fraud risks
        watchFor:
          - Ask how scores are made, since staff must be able to explain why something was flagged
  works_with:
    - to: eligibility-data-exchanges
      note: Match results are one of the analytics’ main feeds.
    - to: benefits-workload-reporting
      note: Both draw on the same data from the claims system.

- id: benefits-workload-reporting
  title: Benefits Workload and Performance Reporting
  description: "An example architecture: workload, wait, accuracy, and payment figures built on a schedule from the claims system’s own data, for managers each day and the public each week or month."
  sources: [ vba-claims-data, ssa-performance, a11-section-280, payment-accuracy ]
  attributes:
    layer: data-records
    parts:
      - A regular copy of claims, payments, and reviews, kept out of the way of daily work
      - Agreed definitions, such as when a claim starts and what counts as waiting too long
      - Dashboards for managers on claims pending, ages, and where work is stuck
      - Quality review results, and feedback from people served
      - A public report on a set schedule, with downloadable data
    strengths:
      - Managers and the public see the same numbers
      - Trouble shows early, while there’s still time to move staff
      - Figures come from the work, so no one has to gather them by hand
    fitsWhen:
      - Reports are put together by hand, or differ by who made them
      - The office wants to publish its figures regularly
    watchFor:
      - A single target can push staff toward easy claims, so look at the oldest and hardest too
      - Changing a definition changes the trend, so say so when it happens
      - Small groups in public data can identify people, so check before publishing
    ways:
      - id: reporting-in-system
        approach: product
        title: The reports in the claims system
        description: The reports and dashboards that come with the claims system.
        strengths:
          - Little to build
        fitsWhen:
          - One system holds most of the office’s work
        watchFor:
          - Figures from other systems, such as payments, need bringing in
      - id: agency-analytics
        approach: platform
        title: The agency’s analytics platform
        description: Data from the claims and payment systems brought into the agency’s analytics platform, with dashboards and public reports built there.
        strengths:
          - Can combine several systems and years of history
        fitsWhen:
          - Work is spread across systems, or the agency already has an analytics platform
        watchFor:
          - Someone has to own the definitions, or the numbers will drift
  works_with:
    - to: benefits-claims-system
      note: The figures come from the claims system’s data.
