# Implementation patterns, in the order the pages show them, each with the links it holds.

- id: cloud-contact-center
  title: A Contact Center System Across Phone, Chat, and Email
  description: "An example architecture: one contact center system takes calls, chats, and emails, routes each to self-service or to an agent with the right skills, offers callbacks, records contacts for quality review, and schedules agents from forecasts, with relay and TTY calls handled like any other."
  sources: [ gsa-contact-center-technologies, gsa-contact-center-playbook ]
  attributes:
    layer: public-facing
    parts:
      - Toll-free numbers, a phone menu that understands speech and keypresses, and routing by topic, skill, and urgency
      - Chat on the agency’s website, and email and web forms in the same queues as calls
      - Callbacks that keep a person’s place in line instead of a long hold
      - Relay and TTY calls, and a phone menu and voice mail usable with a TTY
      - Recordings of calls and chats, with evaluation forms for quality review
      - Forecasts and schedules for agents, and live views of queues and waits
      - Connections to the contact record, the knowledge base, and the program offices’ case systems
    strengths:
      - One place to see every channel’s waits and staff them together
      - Agents see a person’s earlier contacts, whatever channel they came through
      - Capacity grows for a surge without new phone lines or equipment
    fitsWhen:
      - The center runs on an aging phone system, or on several systems for different channels
      - Agents work from more than one site, or from home
    watchFor:
      - Accessibility has to be tested with relay, TTY, and screen readers, not taken from a product sheet
      - Recordings and transcripts hold personal information, so who can hear them and how long they’re kept need setting
      - Moving phone numbers and menus without an outage needs careful planning
    ways:
      - id: product
        approach: product
        title: A cloud contact center product
        description: A cloud contact center product with a FedRAMP authorization, configured and run by the agency’s own center.
        strengths:
          - The agency controls its menus, routing, and data
          - New channels and features arrive with the product’s updates
        fitsWhen:
          - The agency has people who can configure and run it
        watchFor:
          - Another product to buy, secure, and keep up, with its own authorization to operate
      - id: department-platform
        approach: platform
        title: The department’s shared contact center platform
        description: A contact center platform the department runs for its components, with each program getting its own numbers, menus, queues, and reports.
        strengths:
          - Uses contracts, skills, and security approvals the department already has
          - Calls can be passed between components without the person calling again
        fitsWhen:
          - The department already runs a platform like this for other components
        watchFor:
          - Changes and upgrades are decided for the whole department, not for the program
      - id: contracted-center
        approach: product
        title: A contact center run by a contractor
        description: A contractor provides the agents, the system, and the sites, under service levels the agency sets and monitors.
        strengths:
          - The agency can add agents for a surge without hiring
          - The contractor brings systems and experience running large centers
        fitsWhen:
          - Contacts swing widely through the year, such as around deadlines
          - The agency lacks the staff to run a center itself
        watchFor:
          - The agency still owns the answers, the data, and the results, and needs people who can manage the contract well
          - Contact records, recordings, and the knowledge base must stay the agency’s, and be easy to move at the contract’s end
  works_with:
    - to: contact-records-crm
      note: Each call, chat, and email opens or updates a contact record, with its recording and transcript linked.
    - to: shared-knowledge-base
      note: Agents see answers for the topic the caller chose in the phone menu.
    - to: contact-center-reporting
      note: Queue, wait, and abandonment figures feed the reports.

- id: contact-records-crm
  title: Contact Records and Handoffs in a CRM
  description: "An example architecture: each contact is a record in a customer relationship management (CRM) system, with its channel, reason, answer, and outcome, linked to the person’s earlier contacts once they’re verified, and handed to the program office as a case when it must act."
  sources: [ grs-6-5, gsdi-5-usc-321-324 ]
  attributes:
    layer: business-applications
    parts:
      - A contact record for each call, chat, email, and web form, with its reason and outcome chosen from set lists
      - The person’s earlier contacts and open cases, shown once they’re verified
      - Handoffs that open a case in the program office’s system with the contact’s details, and send the person a reference number
      - Follow-up tasks and callbacks, with due dates
      - Retention set from General Records Schedule 6.5, with holds when a contact is part of a dispute
    strengths:
      - People don’t have to repeat themselves when they call back or are handed off
      - Contact reasons recorded the same way show what to fix upstream
      - Program offices get handoffs with everything they need
    fitsWhen:
      - Agents keep notes in spreadsheets, email, or the phone system alone
      - Handoffs to program offices go by email and are hard to follow up
    watchFor:
      - Reason codes only help if there are few enough for agents to choose well, and someone reviews them
      - A record of every contact about a person is itself sensitive, so access follows role and need
    ways:
      - id: agency-platform
        approach: platform
        title: The agency’s shared case platform
        description: Contact records, handoffs, and follow-up built on the low-code or CRM platform the agency already runs for its cases.
        strengths:
          - Handoffs become cases on the same platform the program offices use
          - Uses licenses, skills, and security approvals the agency already has
        fitsWhen:
          - The program offices already work their cases on the platform
        watchFor:
          - The connection to the contact center system, to open records as calls arrive, takes real building
      - id: contact-center-product
        approach: product
        title: The contact center product’s own records
        description: The contact records and case features that come with the contact center product.
        strengths:
          - Works with calls, chats, and recordings with little building
        fitsWhen:
          - Most contacts are resolved by the center without a program office
        watchFor:
          - Handoffs to program offices’ own systems still need connecting
  depends_on:
    - to: shared-case-platform
      way: agency-platform
      note: The contact records and handoffs are the shared platform, set up for the contact center.
  works_with:
    - to: caller-verification-codes
      note: A verified person’s earlier contacts and cases show on the record.
    - to: records-in-business-systems
      note: Contact records follow their schedule in the system that holds them.

- id: shared-knowledge-base
  title: One Knowledge Base for Agents, the Website, and Virtual Agents
  description: "An example architecture: approved answers are written once in a knowledge base, each with an owner in the program office and a review date, and published to agents’ screens, the agency’s website, the phone menu, and virtual agents."
  sources: [ gsa-contact-center-playbook, plain-writing-act ]
  attributes:
    layer: worker-productivity
    parts:
      - Answers written in plain language, each with its owner, its sources, and its next review date
      - Review and approval by the program office before an answer is published or changed
      - Search for agents, with answers suggested from the contact’s topic
      - Publishing to the website, and to the phone menu and virtual agents, from the same answer
      - Feedback from agents and the public on answers that are wrong or unclear, routed to the owner
      - Versions of each answer, so the center can show what it told people on a given day
    strengths:
      - People get the same answer on every channel
      - A change made once reaches agents and the website together
      - New agents become useful sooner
    fitsWhen:
      - Agents keep their own notes or search shared drives for answers
      - The website and the center give different answers to the same question
    watchFor:
      - Answers go stale unless program offices own them and reviews happen on time
      - Each language the agency serves doubles the work of keeping answers current
    ways:
      - id: product
        approach: product
        title: A knowledge management product
        description: A knowledge management product connected to the contact center system and the website.
        strengths:
          - Built for review cycles, versions, and publishing to several channels
        fitsWhen:
          - The center has many topics or many programs
        watchFor:
          - Another product to buy and keep up, and to connect to the website
      - id: platform
        approach: platform
        title: Knowledge articles on the agency’s shared platform
        description: Knowledge articles kept on the CRM or case platform the agency already runs.
        strengths:
          - Agents find answers on the same screen as the contact record
        fitsWhen:
          - The center already works on the platform
        watchFor:
          - Publishing to the website and virtual agents may need building
  works_with:
    - to: virtual-agent
      note: The virtual agent answers only from approved articles.
    - to: contact-ai-insights
      note: Contacts without a good answer show where articles are missing.

- id: virtual-agent
  title: A Virtual Agent That Answers from Approved Content and Hands Off to People
  description: "An example architecture: a virtual agent on the website and in the phone menu answers general questions only from the agency’s approved answers, shows where each answer came from, and hands the person to an agent, with the conversation so far, whenever it can’t help or they ask for a person."
  sources: [ omb-m-25-21, nist-ai-rmf, section-508-standards ]
  attributes:
    layer: public-facing
    parts:
      - A chat window on the website and speech in the phone menu, both usable with assistive technology
      - Answers drawn only from the approved knowledge base, with a link to the source
      - Handoff to a live agent at any point, carrying the conversation so far
      - Verified tasks, such as checking a status, only after the person signs in or is verified
      - Review of conversations the virtual agent couldn’t answer, and of a sample of those it did
      - A listing in the agency’s AI use case inventory, and the practices OMB requires if the use is high-impact
    strengths:
      - Answers routine questions at any hour without a wait
      - Agents have more time for people who need them
      - Questions it can’t answer show where the knowledge base falls short
    fitsWhen:
      - Many contacts are general questions with set answers
      - The knowledge base is current and owned
    watchFor:
      - Answers can be wrong or sound surer than they are, so it stays within approved content and is checked over time
      - It mustn’t decide anyone’s access to a benefit; uses that do are presumed high-impact under OMB’s AI memo
      - People who can’t or won’t use it need an easy way to reach a person
      - What people type may include personal information, so where it’s processed and kept matters
    ways:
      - id: product
        approach: product
        title: The contact center product’s virtual agent
        description: The virtual agent that comes with the contact center product, configured to use the agency’s knowledge base.
        strengths:
          - Hands off to agents with the conversation, with little building
        fitsWhen:
          - The agency runs a contact center product that includes one
        watchFor:
          - Its AI model and where it runs need the agency’s approval
      - id: agency-ai
        approach: platform
        title: An AI model the agency approves
        description: A virtual agent built on an AI model in an environment the agency has approved, connected to the knowledge base and the contact center.
        strengths:
          - The same approved model can serve other uses in the agency
        fitsWhen:
          - The agency has an approved AI environment and people who can build on it
        watchFor:
          - Handoffs to agents, and testing with assistive technology, take real building
  depends_on:
    - to: shared-knowledge-base
      note: The virtual agent answers only from approved knowledge articles.
  works_with:
    - to: cloud-contact-center
      note: Handoffs land in the agents’ queues with the conversation so far.
    - to: caller-verification-codes
      note: Tasks about a person’s own records start only after they’re verified.

- id: caller-verification-codes
  title: Caller Verification with One-Time Codes and Signed-In Sessions
  description: "An example architecture: before an agent discusses a person’s records, the person is verified by a one-time code sent to contact details already on file, or by arriving from a session where they signed in to the agency’s website, and the method used is recorded on the contact."
  sources: [ privacy-act, nist-sp-800-63-4 ]
  attributes:
    layer: security-identity
    parts:
      - Levels of verification set for each kind of request, from none for general questions to stronger checks for changes
      - One-time codes sent by text or email to contact details already on file, never to details the caller gives
      - Handoffs from a signed-in website session into chat or a callback, carrying who the person is
      - Knowledge questions only as a fallback, with their limits understood
      - The method used, and its result, recorded on the contact
    strengths:
      - Agents follow the same steps every time, without judgment calls
      - Codes and signed-in sessions are harder to fake than questions anyone could look up
      - The record shows how each person was verified, if a disclosure is questioned
    fitsWhen:
      - Agents verify people with questions such as date of birth and address
      - People sign in to the agency’s website for its services
    watchFor:
      - Contact details on file can be out of date, so there needs to be another way for people who can’t receive a code
      - Callers using relay services need a way to verify that works for them
      - Social engineering targets agents directly, so they need training and the backing to say no
    ways:
      - id: combine
        approach: combine
        title: Codes and sign-in combined with the contact center
        description: The contact center system’s verification steps, combined with a one-time code service and the agency’s public sign-in.
        strengths:
          - Uses the sign-in the public already has with the agency
        fitsWhen:
          - The agency’s public sign-in and contact center can exchange who a person is
        watchFor:
          - Each connection between sign-in, codes, and the contact center needs keeping up
  works_with:
    - to: contact-records-crm
      note: The verification method is saved on the contact record.

- id: contact-ai-insights
  title: AI Summaries, Suggested Answers, and Contact Insights
  description: "An example architecture: calls and chats are transcribed, and an AI model, in an environment the agency approves, summarizes each one for the record, suggests knowledge articles to the agent, finds the top reasons people contact the agency, and flags contacts worth a quality review, with staff deciding what to do with each."
  sources: [ omb-m-25-21, nist-ai-rmf ]
  attributes:
    layer: ai-insights
    parts:
      - Transcripts of calls and chats, kept with the recording on the same schedule
      - A draft summary of each contact that the agent checks and saves
      - Suggested knowledge articles shown to the agent during the contact
      - Contact reasons and trends across all contacts, by program and channel
      - Contacts flagged for quality review, such as long holds or repeat contacts, for reviewers to score
    strengths:
      - Agents spend less time on notes and more on people
      - Trends across every contact, not just a sample, show what to fix upstream
      - Reviewers spend their time on the contacts most worth reviewing
    fitsWhen:
      - Agents’ notes are thin or inconsistent
      - Managers want to know why people contact the agency, beyond reason codes
    watchFor:
      - Summaries and suggestions can be wrong, so agents check each one and accuracy is reviewed over time
      - Transcripts hold personal information, so where they’re processed and kept matters
      - The agency’s AI governance may require a listing in its AI use case inventory first
    ways:
      - id: product
        approach: product
        title: The contact center product’s AI features
        description: Transcription, summaries, suggested answers, and analytics that come with the contact center product.
        strengths:
          - Works with the product’s recordings and queues with little building
        fitsWhen:
          - The agency runs a contact center product that includes them
        watchFor:
          - Its AI model and where it runs need the agency’s approval
      - id: agency-ai
        approach: platform
        title: An AI model the agency approves
        description: Transcripts sent to an AI model in an environment the agency has approved, with results written back to the contact record and reports.
        strengths:
          - The same approved model can serve other uses in the agency
        fitsWhen:
          - The agency has an approved AI environment and people who can build on it
        watchFor:
          - Connections to recordings, contact records, and reports take real building
  works_with:
    - to: contact-records-crm
      note: Summaries and contact reasons are saved on the contact record.
    - to: contact-center-reporting
      note: Contact reasons and trends feed the reports.

- id: post-contact-survey
  title: Post-Contact Surveys on OMB’s Section 280 Questions
  description: "An example architecture: after a contact, the person is offered a short survey by text, email, or at the end of a chat or call, using OMB’s Section 280 questions under the department’s umbrella clearance, with results joined to the contact’s channel and reason and sent to OMB each quarter."
  sources: [ a11-section-280, cx-feedback-handbook, pra-44-usc-3502 ]
  attributes:
    layer: connections
    parts:
      - A survey offered after the contact, or at the end of the service, on the channel the person used
      - OMB’s trust question and drivers, with their wording and response choices
      - An approval under the department’s Section 280 umbrella clearance
      - Results joined to the contact’s channel, reason, and team, without identifying the person in reports
      - Quarterly datasets in OMB’s format, sent by the final business day of January, April, July, and October
    strengths:
      - Results can be compared with other agencies’ on performance.gov
      - Joined to contact reasons, the answers show which topics and channels need work
      - Quarterly reporting comes from the same data the center uses
    fitsWhen:
      - The agency is a High Impact Service Provider, or wants results it can compare
      - The center has no survey, or one with its own questions
    watchFor:
      - Response rates are low and skew toward strong feelings, so results need context
      - Surveys outside the umbrella clearance’s terms need their own Paperwork Reduction Act approval
    ways:
      - id: touchpoints
        approach: platform
        title: GSA’s Touchpoints
        description: GSA’s Touchpoints, a government tool for customer feedback forms, set up for the Section 280 questions and the quarterly reporting to OMB.
        strengths:
          - Built for the Section 280 questions and quarterly reporting
          - Run by GSA for federal agencies, with a FIPS moderate rating on cloud.gov
        fitsWhen:
          - The center can link to a survey from its texts, emails, and chat
        watchFor:
          - Joining results to contact reasons needs the contact’s details passed to the survey
      - id: product
        approach: product
        title: The contact center product’s surveys
        description: The survey features of the contact center product, set up with OMB’s questions.
        strengths:
          - Surveys can be offered at the end of a call or chat, and joined to the contact automatically
        fitsWhen:
          - The agency runs a contact center product with surveys
        watchFor:
          - Quarterly datasets still need putting into OMB’s format
  works_with:
    - to: contact-center-reporting
      note: Survey results appear beside waits and resolution in the reports.

- id: contact-center-reporting
  title: Contact Center Performance Reporting
  description: "An example architecture: a reporting workspace brings together queue and wait figures, contact records, survey results, and self-service sessions, and shows managers and program offices how each channel is doing, why people contact the agency, and where they get stuck."
  sources: [ gsdi-5-usc-321-324, a11-section-280 ]
  attributes:
    layer: data-records
    parts:
      - Regular feeds from the contact center system, the contact records, the surveys, and the website and virtual agent
      - Waits, abandonment, and resolution by channel, program, and hour, against the center’s standards
      - Top contact reasons and repeat contacts, by program
      - Self-service sessions that ended in a call, and why
      - Views for program offices of the contacts about their programs
    strengths:
      - One set of figures for managers, program offices, and reports to OMB
      - Program offices see the questions their programs cause
      - Forecasts and staffing start from real volumes
    fitsWhen:
      - Reports are put together by hand each month from several systems
      - Program offices rarely hear what the center learns
    watchFor:
      - Figures defined differently across systems, such as when a contact counts as resolved, need agreeing first
      - Averages hide the worst hours and channels, so look at the spread too
    ways:
      - id: build
        approach: build
        title: A reporting workspace
        description: Data from the center’s systems brought together in the agency’s analytics tools.
        strengths:
          - Reports can join data from every system the center uses
        fitsWhen:
          - The agency has analytics tools and people who use them
        watchFor:
          - Each feed needs keeping up as the systems change
  works_with:
    - to: cloud-contact-center
