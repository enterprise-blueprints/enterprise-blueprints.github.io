# Machine-readable mission model. The page at missions/inspector-general-investigations.md renders it,
# and tools such as Solution Studio read it directly. See missions/README.md for the format.
#
# Every relationship is a proposition to test with a customer, not an established fact about any agency.

id: "mission:inspector-general-investigations"
title: "Inspector General Investigations"
status: "draft"
version: 1
summary: "How conditions and behaviors in an Office of Inspector General's investigative work shape timely, thorough, and defensible investigations."
related:
  - "use-case:public-sector-case-management"

factors:
  # ----------------------------------------------------------------------------------------------
  # Conditions: what enables or inhibits the work.

  - id: "caseload"
    type: "condition"
    title: "Investigator caseload"
    description: "The number and complexity of open cases each investigator carries. A heavy caseload leaves less time for any one case."
    better: "lower"
    pattern: "capacity"
    signals:
      - "Investigators carry more cases than they can actively work."
      - "New allegations wait for someone to have room."
    questions:
      - "How many open cases does a typical investigator carry, and how many are active?"
      - "How do you decide when an office has too much work?"
    metrics:
      - name: "Open cases per investigator"
        measurement: "Open cases divided by investigators on board, by office, at month end."
        better: "lower"

  - id: "allegation-volume"
    type: "condition"
    title: "Volume of incoming allegations"
    description: "How many complaints, hotline submissions, and referrals arrive. Volume rises when people trust that reports lead to action."
    better: "neutral"
    signals:
      - "Hotline volume jumped after a high-profile case."
      - "Intake staff can’t keep up with new submissions."
    questions:
      - "How has allegation volume changed over the last three years, and why?"
      - "What share of allegations becomes an investigation?"
    metrics:
      - name: "Allegations received per month"
        measurement: "Count of complaints, hotline submissions, and referrals recorded at intake."
        better: "neutral"

  - id: "triage-criteria"
    type: "condition"
    title: "Clear criteria for accepting and prioritizing allegations"
    description: "Written, shared criteria that decide which allegations become investigations, which go elsewhere, and in what order."
    better: "higher"
    signals:
      - "Similar allegations are handled differently depending on who reviews them."
      - "Priority depends on who is asking."
    questions:
      - "Who decides whether an allegation becomes an investigation, and on what basis?"
      - "Are the criteria written down? When were they last updated?"

  - id: "decision-rights"
    type: "condition"
    title: "Clear decision rights for case actions"
    description: "Everyone knows who may open, assign, escalate, refer, and close a case, and those people can act without unnecessary handoffs."
    better: "higher"
    pattern: "decision-rights"
    signals:
      - "Cases wait for approvals nobody is sure they need."
      - "The same decision goes up two or three levels."
    questions:
      - "Which case decisions need approval, and from whom?"
      - "Where do cases most often wait for a decision?"

  - id: "dependency-visibility"
    type: "condition"
    title: "Supervisors can see external dependencies"
    description: "Supervisors can see which cases are waiting on records requests, subpoenas, interviews, or partner agencies, and have the authority to intervene."
    better: "higher"
    pattern: "visibility"
    signals:
      - "Nobody knows how long a case has waited on another agency."
      - "Supervisors learn about stalled requests in quarterly reviews."
    questions:
      - "How do supervisors find out that a case is waiting on someone outside the office?"
      - "What can a supervisor do when a request stalls?"
    metrics:
      - name: "Days cases wait on external requests"
        measurement: "Median days from request sent to response received, by request type."
        better: "lower"

  - id: "closure-pressure"
    type: "condition"
    title: "Pressure to close cases"
    description: "Performance targets, reporting cycles, or leadership attention that emphasize the number of closed cases over their quality."
    better: "lower"
    pattern: "incentives"
    signals:
      - "Closure counts dominate performance reviews or the semiannual report."
      - "There is a push to close cases before the end of a reporting period."
    questions:
      - "How is investigative performance measured today, and who looks at it?"
      - "What happens when an office’s closure numbers fall?"

  - id: "related-case-access"
    type: "condition"
    title: "Investigators can find related cases and prior allegations"
    description: "Investigators can search earlier complaints, cases, subjects, and entities to see what the office already knows."
    better: "higher"
    pattern: "information-access"
    signals:
      - "Investigators learn about a related case by asking around."
      - "The same subject appears in cases nobody connected."
    questions:
      - "Before opening a case, how does an investigator check what the office already knows about the subject?"
      - "How far back can they search, and across which systems?"

  - id: "evidence-handling"
    type: "condition"
    title: "Reliable evidence handling and chain of custody"
    description: "Physical and digital evidence is captured, stored, and tracked so its integrity can be shown."
    better: "higher"
    signals:
      - "Evidence logs live in spreadsheets or paper binders."
      - "Digital evidence sits on shared drives or individual laptops."
    questions:
      - "How do you record who handled a piece of evidence and when?"
      - "Where does digital evidence live, and who can change it?"

  - id: "partner-relationships"
    type: "condition"
    title: "Working relationships with prosecutors and partner agencies"
    description: "Established contacts, agreements, and expectations with prosecutors, law enforcement, and agency management."
    better: "higher"
    signals:
      - "Referrals go to whoever an investigator happens to know."
      - "Partners don’t know what a referral package should contain."
    questions:
      - "Which prosecutors and partners do you work with most, and how is that relationship managed?"
      - "How often do referrals come back for more information?"

  - id: "case-data-quality"
    type: "condition"
    title: "Complete and consistent case data"
    description: "Case records use consistent categories and fields, and are complete enough to report from without manual cleanup."
    better: "higher"
    pattern: "data-quality"
    signals:
      - "Building the semiannual report takes weeks of reconciling spreadsheets."
      - "Each office codes allegations differently."
    questions:
      - "How long does it take to answer a question like “how many procurement fraud cases did we close last year?”"
      - "Who fixes data problems, and when?"
    metrics:
      - name: "Staff hours to compile the semiannual report"
        measurement: "Hours recorded by staff who gather and reconcile case statistics for each report."
        better: "lower"

  - id: "information-protection"
    type: "condition"
    title: "Investigative information is protected and independent"
    description: "Case information is limited to people with a need to know, every access is logged, and agency staff outside the OIG can't see or change OIG records. Complainant and witness identities stay confidential."
    better: "higher"
    pattern: "independence"
    signals:
      - "Agency IT administrators can reach OIG files or mailboxes."
      - "Anyone in the office can open any case."
      - "Nobody can say who viewed a case file last month."
    questions:
      - "Who outside the OIG could see or change investigative records today, including administrators?"
      - "How do you restrict access to sensitive cases, and how would you know if someone looked?"
      - "How are complainant and whistleblower identities protected?"

  # ----------------------------------------------------------------------------------------------
  # Behaviors: what people actually do.

  - id: "early-escalation"
    type: "behavior"
    title: "Investigators escalate stalled requests early"
    description: "Investigators notice when a records request, subpoena, or partner action has stalled, and raise it before it delays the case."
    better: "higher"
    signals:
      - "Requests sit for months before anyone follows up."
      - "Escalation depends on the individual investigator."
    questions:
      - "When a request goes unanswered, what does an investigator do, and when?"
    metrics:
      - name: "Overdue external requests without follow-up"
        measurement: "External requests past their due date with no follow-up recorded in the last 14 days."
        better: "lower"

  - id: "substantive-review"
    type: "behavior"
    title: "Supervisors conduct substantive case reviews"
    description: "Supervisors regularly review the evidence, plan, and direction of each case, not just its status."
    better: "higher"
    signals:
      - "Case reviews are status meetings."
      - "Evidentiary gaps surface only when the report is drafted."
    questions:
      - "How often does a supervisor review a case, and what do they look at?"
      - "Where are review results recorded?"
    metrics:
      - name: "Cases reviewed on schedule"
        measurement: "Share of open cases with a documented supervisory review within the required interval."
        better: "higher"

  - id: "rushed-work"
    type: "behavior"
    title: "Reviews and documentation are rushed"
    description: "Under pressure, staff shorten reviews and write up work late or thinly."
    better: "lower"
    signals:
      - "Interview write-ups are done weeks after the interview."
      - "Reviews happen just before closure."
    questions:
      - "When do investigators write up interviews and activities?"
      - "Which steps get skipped when the team is busy?"

  - id: "consistent-triage"
    type: "behavior"
    title: "Intake staff triage allegations consistently"
    description: "Intake staff apply the same criteria to similar allegations, and route each one promptly."
    better: "higher"
    signals:
      - "Allegations are reassigned after triage because they went to the wrong place."
    questions:
      - "How long does an allegation wait before someone decides what to do with it?"
    metrics:
      - name: "Days from receipt to triage decision"
        measurement: "Median days from an allegation’s receipt to its recorded disposition."
        better: "lower"

  - id: "related-case-check"
    type: "behavior"
    title: "Staff check for related cases before opening"
    description: "Before opening a case, staff check for earlier allegations, open cases, and known subjects."
    better: "higher"
    signals:
      - "Two offices investigate the same subject without knowing."
    questions:
      - "Is checking for related cases a required step? How is it recorded?"

  - id: "contemporaneous-documentation"
    type: "behavior"
    title: "Investigators document work as it happens"
    description: "Interviews, evidence, and decisions are recorded in the case file close to when they occur."
    better: "higher"
    signals:
      - "Case files are assembled at the end."
    questions:
      - "How long after an interview is the memorandum of interview completed?"
    metrics:
      - name: "Days from activity to documentation"
        measurement: "Median days between an investigative activity and its write-up in the case file."
        better: "lower"

  - id: "early-prosecutor-engagement"
    type: "behavior"
    title: "Investigators engage prosecutors early"
    description: "Investigators consult prosecutors when a case shows criminal potential, rather than only at referral."
    better: "higher"
    signals:
      - "Referrals are declined for reasons that could have been addressed earlier."
    questions:
      - "At what point do investigators first talk with a prosecutor about a case?"

  - id: "caseload-balancing"
    type: "behavior"
    title: "Supervisors rebalance caseloads"
    description: "Supervisors watch workload and case age, and move or close out work before it piles up."
    better: "higher"
    signals:
      - "Some investigators are overloaded while others have room."
    questions:
      - "How do supervisors decide who gets the next case?"

  # ----------------------------------------------------------------------------------------------
  # Operational outcomes: how the work performs.

  - id: "timely-investigations"
    type: "operational-outcome"
    title: "Investigations progress without avoidable delay"
    description: "Cases move steadily from opening to closure, and time spent waiting is visible and short."
    better: "higher"
    questions:
      - "Which cases take longest, and where do they wait?"
    metrics:
      - name: "Median days to close an investigation"
        measurement: "Median days from case opening to closure, by case type."
        better: "lower"
      - name: "Open cases older than 12 months"
        measurement: "Count of open cases more than 365 days after opening, at month end."
        better: "lower"

  - id: "rework"
    type: "operational-outcome"
    title: "Quality deficiencies and rework"
    goal: "Reports and case files are right the first time"
    description: "Reports and case files returned for missing evidence, unclear findings, or documentation gaps."
    better: "lower"
    questions:
      - "How often do reports go back for more work, and why?"
    metrics:
      - name: "Reports returned during review"
        measurement: "Share of draft reports returned to the investigator at least once during review."
        better: "lower"

  - id: "backlog"
    type: "operational-outcome"
    title: "Case backlog"
    goal: "Allegations and cases don’t wait for attention"
    description: "Allegations and cases waiting for attention."
    better: "lower"
    questions:
      - "How many allegations are waiting for triage, and how many cases are waiting for an investigator?"
    metrics:
      - name: "Allegations awaiting triage"
        measurement: "Count of allegations without a disposition, at month end."
        better: "lower"

  - id: "referral-acceptance"
    type: "operational-outcome"
    title: "Referrals are accepted for prosecution or action"
    description: "Prosecutors and agency management accept referrals because the package is complete and the case is strong."
    better: "higher"
    questions:
      - "What share of referrals is accepted, and why are the others declined?"
    metrics:
      - name: "Referral acceptance rate"
        measurement: "Referrals accepted divided by referrals made, by referral type, per half year."
        better: "higher"

  - id: "defensible-findings"
    type: "operational-outcome"
    title: "Findings withstand review and challenge"
    description: "Findings hold up in peer review, litigation, and congressional or public scrutiny."
    better: "higher"
    questions:
      - "When were findings last challenged, and what happened?"
    metrics:
      - name: "Peer review exceptions"
        measurement: "Exceptions noted in the most recent external peer review of investigative operations."
        better: "lower"

  # ----------------------------------------------------------------------------------------------
  # Mission outcomes: public value created.

  - id: "accountability"
    type: "mission-outcome"
    title: "Timely, thorough, and defensible investigations support accountability"
    description: "Wrongdoing is investigated well enough, and soon enough, that people and programs are held to account."
    better: "higher"
    metrics:
      - name: "Investigations resulting in action"
        measurement: "Share of closed investigations that led to criminal, civil, or administrative action."
        better: "higher"

  - id: "public-trust"
    type: "mission-outcome"
    title: "Employees and the public trust that reported wrongdoing is addressed"
    description: "People believe that reporting fraud, waste, or abuse leads to action, so they keep reporting."
    better: "higher"
    metrics:
      - name: "Employees who believe reporting leads to action"
        measurement: "Agreement with a survey item such as “I believe reported wrongdoing is addressed”, from an employee survey."
        better: "higher"

  - id: "losses-recovered"
    type: "mission-outcome"
    title: "Wrongdoing is stopped and losses are recovered"
    description: "Investigations stop ongoing fraud and recover funds for the government."
    better: "higher"
    metrics:
      - name: "Monetary results from investigations"
        measurement: "Recoveries, restitution, fines, and settlements reported per half year."
        better: "higher"

# ------------------------------------------------------------------------------------------------
# Relationships: how one factor influences another. `effect` says whether more of `from` means more
# (increases) or less (decreases) of `to`.

relationships:
  - from: "caseload"
    to: "closure-pressure"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "A growing inventory draws leadership attention to closing cases."
  - from: "closure-pressure"
    to: "rushed-work"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "When closures are the measure, reviews and write-ups are where time gets saved."
  - from: "rushed-work"
    to: "rework"
    effect: "increases"
    confidence: "hypothesis"
    lag: "months"
    rationale: "Gaps left early surface late, when reports are reviewed or referred."
  - from: "rework"
    to: "caseload"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Returned cases stay open and consume investigator time."
  - from: "caseload"
    to: "timely-investigations"
    effect: "decreases"
    confidence: "hypothesis"
    rationale: "Each case gets attention less often."
  - from: "caseload-balancing"
    to: "caseload"
    effect: "decreases"
    confidence: "hypothesis"
    rationale: "Moving work keeps individual caseloads within reach."
    applies_when: "The office has staff with capacity to absorb moved cases."
  - from: "dependency-visibility"
    to: "early-escalation"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Investigators and supervisors act on stalled requests they can see."
  - from: "dependency-visibility"
    to: "caseload-balancing"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "The same view of case status shows where work is piling up."
  - from: "early-escalation"
    to: "timely-investigations"
    effect: "increases"
    confidence: "hypothesis"
    lag: "weeks"
    rationale: "Investigative delays often come from unresolved external dependencies."
  - from: "decision-rights"
    to: "timely-investigations"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Cases stop waiting for approvals that aren’t needed or aren’t owned."
  - from: "decision-rights"
    to: "early-escalation"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "People escalate when they know who can act."
  - from: "substantive-review"
    to: "rework"
    effect: "decreases"
    confidence: "hypothesis"
    lag: "months"
    rationale: "Reviews that look at evidence find gaps while they are still cheap to close."
  - from: "substantive-review"
    to: "defensible-findings"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Supervisory review is part of quality investigative work."
  - from: "rushed-work"
    to: "substantive-review"
    effect: "decreases"
    confidence: "hypothesis"
    rationale: "Busy supervisors shorten reviews too."
  - from: "contemporaneous-documentation"
    to: "rework"
    effect: "decreases"
    confidence: "hypothesis"
    rationale: "Records written at the time are complete and consistent."
  - from: "contemporaneous-documentation"
    to: "defensible-findings"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Contemporaneous records carry more weight under challenge."
  - from: "rushed-work"
    to: "contemporaneous-documentation"
    effect: "decreases"
    confidence: "hypothesis"
    rationale: "Write-ups are the first thing deferred."
  - from: "evidence-handling"
    to: "defensible-findings"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "A broken chain of custody can undermine a finding."
  - from: "triage-criteria"
    to: "consistent-triage"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Shared criteria make similar allegations land in the same place."
  - from: "consistent-triage"
    to: "backlog"
    effect: "decreases"
    confidence: "hypothesis"
    rationale: "Allegations reach the right path sooner and aren’t reworked."
  - from: "consistent-triage"
    to: "caseload"
    effect: "decreases"
    confidence: "hypothesis"
    rationale: "Fewer low-value allegations become full investigations."
  - from: "allegation-volume"
    to: "backlog"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "More arrives than intake can process."
  - from: "backlog"
    to: "caseload"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Waiting allegations become cases that need someone."
  - from: "related-case-access"
    to: "related-case-check"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "People check when checking is quick."
  - from: "related-case-check"
    to: "caseload"
    effect: "decreases"
    confidence: "hypothesis"
    rationale: "Duplicate and overlapping cases are combined instead of worked twice."
  - from: "related-case-check"
    to: "defensible-findings"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Findings account for what the office already knew."
  - from: "partner-relationships"
    to: "early-prosecutor-engagement"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Investigators call people they know."
  - from: "early-prosecutor-engagement"
    to: "referral-acceptance"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Cases are shaped around what a prosecutor needs."
  - from: "defensible-findings"
    to: "referral-acceptance"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Strong cases are easier to accept."
  - from: "information-protection"
    to: "defensible-findings"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Records that only authorized people could reach, with a log to prove it, hold up under challenge."
  - from: "information-protection"
    to: "public-trust"
    effect: "increases"
    confidence: "hypothesis"
    lag: "years"
    rationale: "People report wrongdoing when they trust their identity is protected."
  - from: "case-data-quality"
    to: "dependency-visibility"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Views of case status are only as good as the data behind them."
  - from: "timely-investigations"
    to: "accountability"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Late findings have less effect, and evidence and witnesses fade."
  - from: "defensible-findings"
    to: "accountability"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Findings that hold up lead to action."
  - from: "referral-acceptance"
    to: "losses-recovered"
    effect: "increases"
    confidence: "hypothesis"
    rationale: "Accepted referrals lead to restitution, fines, and settlements."
  - from: "accountability"
    to: "public-trust"
    effect: "increases"
    confidence: "hypothesis"
    lag: "years"
    rationale: "Visible results show that reports matter."
  - from: "public-trust"
    to: "allegation-volume"
    effect: "increases"
    confidence: "hypothesis"
    lag: "years"
    rationale: "People report when they believe it leads to action."

# ------------------------------------------------------------------------------------------------
# Loops: chains of relationships that return to where they start. Reinforcing loops amplify a change;
# balancing loops push back against it.

loops:
  - id: "closure-pressure-loop"
    title: "Closure pressure grows the backlog"
    kind: "reinforcing"
    factors: ["caseload", "closure-pressure", "rushed-work", "rework"]
    description: "A heavy caseload creates pressure to close cases. Rushed reviews and documentation cause rework, which keeps cases open and adds to the caseload. Pushing for more closures may make the backlog worse."
    watch_for: "Proposals that make closure counts the main measure of success."
  - id: "success-brings-work"
    title: "Success brings more work"
    kind: "balancing"
    factors: ["accountability", "public-trust", "allegation-volume", "backlog", "caseload", "timely-investigations"]
    description: "Visible results build trust, which brings more allegations. Without more capacity, the extra work slows investigations and limits further gains."
    watch_for: "Forecasts that assume allegation volume stays flat after improvements."

# ------------------------------------------------------------------------------------------------
# Interventions: changes that act on factors. Technology interventions are candidates for a solution;
# the others are listed for discussion and completeness. `need` states what a system would have to
# do, in vendor-neutral terms.

interventions:
  - id: "dependency-tracking"
    title: "Track external requests with due dates and escalation"
    kind: "technology"
    description: "Record every records request, subpoena, and partner action against the case, with due dates and automatic reminders."
    need: "Track external requests per case with due dates and status, and alert the investigator and supervisor when a request is overdue."
    changes:
      - factor: "dependency-visibility"
        effect: "increases"
      - factor: "early-escalation"
        effect: "increases"

  - id: "review-workflow"
    title: "Scheduled supervisory reviews with recorded results"
    kind: "technology"
    description: "Prompt supervisors to review each case on a schedule, with a checklist that covers evidence and plan, and record the results."
    need: "Schedule periodic supervisory reviews for each case, record review findings and follow-up actions, and show overdue reviews."
    changes:
      - factor: "substantive-review"
        effect: "increases"

  - id: "structured-intake"
    title: "Structured intake with triage rules"
    kind: "technology"
    description: "Capture allegations through structured forms and apply documented triage criteria and routing."
    need: "Capture allegations through structured intake from every channel, apply configurable triage criteria, and route each allegation with a recorded disposition."
    changes:
      - factor: "triage-criteria"
        effect: "increases"
      - factor: "consistent-triage"
        effect: "increases"
      - factor: "case-data-quality"
        effect: "increases"

  - id: "related-case-search"
    title: "Search across allegations, cases, and subjects"
    kind: "technology"
    description: "Let staff search earlier allegations, cases, people, and organizations in one place."
    need: "Search allegations, cases, subjects, and entities across offices and years, and flag possible related cases when a new allegation or case is created."
    changes:
      - factor: "related-case-access"
        effect: "increases"
      - factor: "related-case-check"
        effect: "increases"

  - id: "evidence-management"
    title: "Evidence management with chain of custody"
    kind: "technology"
    description: "Track physical and digital evidence with a tamper-evident custody log."
    need: "Record evidence items with a complete chain of custody, store digital evidence with integrity checks, and restrict changes."
    changes:
      - factor: "evidence-handling"
        effect: "increases"

  - id: "workload-dashboards"
    title: "Caseload and case-age dashboards"
    kind: "technology"
    description: "Show supervisors each investigator’s caseload, case age, and what each case is waiting on."
    need: "Report caseload, case age, and waiting status by investigator, team, and office from current case data."
    changes:
      - factor: "dependency-visibility"
        effect: "increases"
      - factor: "caseload-balancing"
        effect: "increases"

  - id: "in-case-documentation"
    title: "Mobile and in-case documentation"
    kind: "technology"
    description: "Let investigators record interviews and activities in the case file from wherever they work."
    need: "Let investigators draft interview memoranda and activity records in the case file, including from the field, with templates."
    changes:
      - factor: "contemporaneous-documentation"
        effect: "increases"

  - id: "access-controls"
    title: "Need-to-know access and audit logging"
    kind: "technology"
    description: "Restrict each case to the people working it, log every access and change, and keep OIG data out of reach of agency administrators."
    need: "Restrict access to cases and records by role and by case, record an audit trail of every view and change, protect complainant identities, and keep OIG data administered separately from the agency."
    changes:
      - factor: "information-protection"
        effect: "increases"

  - id: "balanced-measures"
    title: "Balance closure targets with quality measures"
    kind: "policy"
    description: "Report quality measures, such as rework and referral acceptance, alongside closure counts."
    changes:
      - factor: "closure-pressure"
        effect: "decreases"

  - id: "decision-rights-charter"
    title: "Clarify decision rights for case actions"
    kind: "organization"
    description: "Write down who may open, assign, escalate, refer, and close cases, and remove approvals that add no value."
    changes:
      - factor: "decision-rights"
        effect: "increases"

  - id: "escalation-protocol"
    title: "Time-boxed escalation protocol"
    kind: "process"
    description: "Agree on when an unanswered request is escalated, and to whom."
    changes:
      - factor: "early-escalation"
        effect: "increases"

  - id: "prosecutor-liaison"
    title: "Regular prosecutor consultation"
    kind: "process"
    description: "Set up standing consultations with prosecutors for cases with criminal potential."
    changes:
      - factor: "partner-relationships"
        effect: "increases"
      - factor: "early-prosecutor-engagement"
        effect: "increases"

  - id: "staffing-to-demand"
    title: "Plan staffing against allegation volume"
    kind: "people"
    description: "Forecast allegation volume and adjust investigative staffing, including surge support."
    changes:
      - factor: "caseload"
        effect: "decreases"

  - id: "documentation-training"
    title: "Training on documentation and evidence standards"
    kind: "people"
    description: "Train investigators on documentation expectations and evidence handling."
    changes:
      - factor: "contemporaneous-documentation"
        effect: "increases"
      - factor: "evidence-handling"
        effect: "increases"

# ------------------------------------------------------------------------------------------------
# Typical roles and systems. Tools can offer these as a starting point for stakeholders and the
# current state; every organization differs, so treat them as prompts to confirm, not facts.

roles:
  - id: "inspector-general"
    title: "Inspector General"
    description: "Leads the office, sets priorities, and reports to the agency head and Congress."
    concerns: "Independence, credibility of findings, and what the semiannual report says about results."
    influence: "high"
    factors: ["accountability", "public-trust", "closure-pressure"]
  - id: "aigi"
    title: "Assistant Inspector General for Investigations"
    description: "Runs the investigations program across offices."
    concerns: "Case timeliness, aged cases, caseloads, and the quality of what goes to prosecutors."
    influence: "high"
    factors: ["timely-investigations", "backlog", "caseload", "referral-acceptance"]
  - id: "sac"
    title: "Special Agent in Charge"
    description: "Supervises a field office or team of agents."
    concerns: "Seeing what cases are waiting on, reviewing cases, and balancing work across agents."
    influence: "medium"
    factors: ["dependency-visibility", "substantive-review", "caseload-balancing"]
  - id: "special-agents"
    title: "Special agents"
    description: "Investigate allegations: interviews, records, evidence, and reports."
    concerns: "Time spent on documentation, finding related cases, and handling evidence."
    influence: "medium"
    factors: ["contemporaneous-documentation", "related-case-access", "evidence-handling", "early-escalation"]
  - id: "hotline"
    title: "Hotline and intake staff"
    description: "Receive complaints and referrals and decide where each one goes."
    concerns: "Volume, consistent triage criteria, and duplicate submissions."
    influence: "low"
    factors: ["allegation-volume", "triage-criteria", "consistent-triage"]
  - id: "counsel"
    title: "Counsel to the Inspector General"
    description: "Advises on subpoenas, legal sufficiency, and disclosure."
    concerns: "Findings that hold up, evidence handling, and what can be released."
    influence: "medium"
    factors: ["defensible-findings", "evidence-handling", "information-protection"]
  - id: "analytics"
    title: "Data analytics and reporting staff"
    description: "Produce statistics, the semiannual report, and analysis that finds new cases."
    concerns: "Complete, consistent case data and less manual reconciliation."
    influence: "low"
    factors: ["case-data-quality"]
  - id: "oig-it"
    title: "OIG IT and security"
    description: "Run the office's systems, often separately from the agency's to protect independence."
    concerns: "Security, hosting, identity, integration, and support."
    influence: "medium"
    factors: ["case-data-quality", "information-protection"]
  - id: "records-officer"
    title: "Records management officer"
    description: "Owns retention schedules and how records move between systems."
    concerns: "Retention, migration of legacy records, and disposal."
    influence: "low"
    factors: []
  - id: "prosecutors"
    title: "Prosecutors and partner agencies"
    description: "External partners who accept referrals and act on findings."
    concerns: "Complete referral packages and early involvement."
    influence: "low"
    factors: ["referral-acceptance", "partner-relationships"]

systems:
  - id: "case-management"
    title: "Legacy case management system"
    kind: "service"
    fate: "replace"
    description: "Records allegations, cases, subjects, and activities."
    notes: "Often 10 to 20 years old, with limited reporting and integration."
  - id: "hotline-intake"
    title: "Hotline intake (web form, phone, email)"
    kind: "channel"
    fate: "replace"
    description: "Where complaints and referrals arrive."
    notes: "Submissions are often re-keyed into the case system."
  - id: "evidence-storage"
    title: "Evidence logs and file shares"
    kind: "data"
    fate: "replace"
    description: "Where evidence and its custody records are kept."
    notes: "Often spreadsheets, paper logs, and shared drives."
  - id: "statistics-spreadsheets"
    title: "Statistics spreadsheets"
    kind: "analytics"
    fate: "retire"
    description: "Where case statistics are reconciled for the semiannual report."
    notes: ""
  - id: "records-management"
    title: "Document and records management"
    kind: "data"
    fate: "integrate"
    description: "Holds official records and applies retention."
    notes: ""
  - id: "email"
    title: "Email and calendar"
    kind: "external"
    fate: "integrate"
    description: "Where much case correspondence happens."
    notes: ""
  - id: "identity"
    title: "Identity provider (PIV and single sign-on)"
    kind: "identity"
    fate: "integrate"
    description: "Signs staff in with agency credentials."
    notes: "Some offices run their own to protect independence."
  - id: "forensics"
    title: "Digital forensics tools"
    kind: "service"
    fate: "keep"
    description: "Collect and analyze digital evidence."
    notes: ""
  - id: "agency-hr"
    title: "Agency HR and personnel system"
    kind: "external"
    fate: "integrate"
    description: "Source of employee details for subjects and witnesses."
    notes: "Access is usually read-only and tightly controlled."
  - id: "agency-finance"
    title: "Agency financial and grants systems"
    kind: "external"
    fate: "integrate"
    description: "Data for fraud analytics and for valuing losses."
    notes: ""
