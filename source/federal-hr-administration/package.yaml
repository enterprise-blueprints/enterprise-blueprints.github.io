packageId: org.enterprise-blueprints.federal-hr-administration
idPrefix: eb
title: HR Administration — Hiring, Paying, and Supporting the Federal Civilian Workforce
description: "U.S. federal civilian human resources blueprint: one mission with the outcomes it seeks and ways to measure them, ten capabilities from position management through separation and workforce reporting, with their reference requirements, example implementation patterns with their tradeoffs, and discovery question sets for HR results and for HR operations. It follows Title 5 of the U.S. Code and OPM’s rules, including the 2025 Merit Hiring Plan and the move to one government-wide core HR system, and builds on Common Capabilities for case management, records, identity and access, and data protection."
