# Implementation patterns, in the order the pages show them, each with the links it holds.

- id: foia-request-processing
  title: FOIA Request Processing
  description: "An example architecture: one place to handle a FOIA request from start to finish. It takes requests from the national portal and the agency’s own form, tracks them on FOIA’s tracks and deadlines, collects records and sets duplicates aside, applies marked redactions, publishes releases to the FOIA library, and produces the annual report from the same data."
  sources: [ foia-gov, doj-foia-guide, foia-statute ]
  attributes:
    role: business-applications
    parts:
      - Request intake from the national portal and the agency’s own form
      - Request tracking with FOIA’s tracks, working-day deadlines, fee categories, and correspondence
      - A review workspace that collects records, sets duplicates aside, and applies redactions marked with their exemptions
      - Release packages and determination letters from templates
      - Publishing to the online FOIA library
      - Annual and quarterly report figures from the request data
    strengths:
      - The annual report’s figures come from the same records staff work in
      - The requester’s whole history is in one place
    fitsWhen:
      - Tracking and review happen in separate tools today, with retyping between them
    watchFor:
      - Moving open requests from an old system mid-year can disturb the annual report’s counts
      - A hosted system needs a security authorization before it can hold unredacted records
    ways:
      - id: product
        approach: product
        title: A FOIA product
        description: A product made for FOIA that handles tracking, review, release, and reporting in one place.
        strengths:
          - Knows FOIA’s rules, such as tracks, working-day deadlines, fee categories, and exemption codes
        fitsWhen:
          - The office handles hundreds of requests a year or more
        watchFor:
          - Built-in review may struggle with very large email collections
      - id: platform-and-review-tool
        approach: combine
        title: The shared case platform, with a separate review tool
        description: Requests tracked on the agency’s shared case platform, set up for FOIA’s tracks and deadlines, with a separate document review tool for collecting, deduplicating, and redacting records, and a handoff between the two.
        strengths:
          - Uses a platform the agency already has for the tracking
          - Either tool can be replaced without replacing the other
          - Suits offices that already own a review tool
        fitsWhen:
          - The agency’s shared case platform is well supported
          - Request volume is moderate, and records are mostly documents rather than large email collections
        watchFor:
          - The handoff between the tools is where requests stall or records go missing
          - Deadline rules, such as pausing the clock, must be built and kept up to date
          - Two tools to authorize, secure, and train people on
  depends_on:
    - to: shared-case-platform
      way: platform-and-review-tool
      note: The tracking half is the shared platform, set up for FOIA.

