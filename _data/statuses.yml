# Allowed values for `status` on blocks, missions, and implementation guides.

planned:
  label: Planned
  description: >-
    A placeholder that holds a concept's place in the library. The definition
    hasn't been written yet, but other blocks and missions can already link to it.
draft:
  label: Draft
  description: Written and usable, but still being reviewed and refined.
published:
  label: Published
  description: Reviewed and considered stable enough to build on.
