# The references this package cites. Elements and links name them by id.

- id: ig-act-404
  title: 5 U.S.C. § 404 — Duties and responsibilities of Inspectors General
  url: https://www.govinfo.gov/link/uscode/5/404?link-type=html
  kind: official-reference
  lastReviewedAt: 2026-10-30
  note: Principal statutory duties of federal Inspectors General, among them following the Comptroller General’s standards for audits (§ 404(b)(1)(A)) and reporting expeditiously to the Attorney General whenever there are reasonable grounds to believe federal criminal law was violated (§ 404(d)).

- id: oversight-mission
  title: Oversight.gov — Mission of Inspectors General
  url: https://www.oversight.gov/about/inspectors-general/mission
  kind: official-reference
  lastReviewedAt: 2026-10-25
  note: Describes independent oversight, prevention of fraud, waste and abuse, and reporting.

- id: cigie-faq
  title: Council of the Inspectors General on Integrity and Efficiency — Frequently Asked Questions
  url: https://www.ignet.gov/node/54
  kind: official-reference
  lastReviewedAt: 2026-10-26
  note: General description of OIG missions, independence, audits, investigations, and reporting.

- id: oversight-hotline
  title: Oversight.gov — Report Fraud, Waste, Abuse or Retaliation
  url: https://www.oversight.gov/where-report-fraud-waste-abuse-or-retaliation
  kind: official-reference
  lastReviewedAt: 2026-10-26
  note: Official routing information for reports of fraud, waste, abuse, or retaliation.

- id: ig-act-403
  title: 5 U.S.C. § 403 — Appointment of Inspectors General
  url: https://www.govinfo.gov/link/uscode/5/403?link-type=html
  kind: official-reference
  lastReviewedAt: 2026-10-30
  note: "Among other things, each Inspector General designates a Whistleblower Protection Coordinator (§ 403(d)(1)(C)), who educates agency employees about the prohibitions on retaliation for protected disclosures, and about their rights and remedies, including the roles of the Office of Inspector General, the Office of Special Counsel, and the Merit Systems Protection Board. The coordinator doesn’t act as the employee’s representative or advocate."

- id: ig-act-406
  title: 5 U.S.C. § 406 — Authority of Inspector General
  url: https://www.govinfo.gov/link/uscode/5/406?link-type=html
  kind: official-reference
  lastReviewedAt: 2026-10-30
  note: Timely access to all records, reports, audits, reviews, documents, and other material of the agency (§ 406(a)(1)); subpoenas for information and documents (§ 406(a)(4)); and, when information or assistance is unreasonably refused, a report of the circumstances to the agency head without delay (§ 406(c)(2)).

- id: contractor-whistleblower-41-usc-4712
  title: 41 U.S.C. § 4712 — Enhancement of contractor protection from reprisal for disclosure of certain information
  url: https://www.law.cornell.edu/uscode/text/41/4712
  kind: official-reference
  lastReviewedAt: 2026-10-30
  note: Employees of contractors, subcontractors, grantees, and subgrantees may complain of reprisal to the agency’s Inspector General, within three years of it. Within 180 days the Inspector General either determines the complaint doesn’t need investigating or reports its findings to the complainant, the employer, and the agency head, with up to 180 more days if the complainant agrees.

- id: reports-consolidation-31-usc-3516
  title: 31 U.S.C. § 3516 — Reports consolidation
  url: https://www.law.cornell.edu/uscode/text/31/3516
  kind: official-reference
  lastReviewedAt: 2026-10-30
  note: An agency’s annual consolidated report includes a statement by its Inspector General summarizing what the Inspector General considers the most serious management and performance challenges facing the agency, and the agency’s progress on them (§ 3516(d)).

- id: omb-a-50
  title: OMB Circular A-50 — Audit Followup
  url: https://obamawhitehouse.archives.gov/omb/circulars_a050/
  kind: official-reference
  publicationDate: 1982-09-29
  lastReviewedAt: 2026-10-30
  note: Agencies resolve audit recommendations within six months of the final report, and carry out corrective action as quickly as possible, with an audit followup official responsible for timely responses and for seeing that corrective actions are taken.

- id: cigie-qar-investigations
  title: Council of the Inspectors General on Integrity and Efficiency — Quality Assurance Review Guidelines for Offices of Investigations (July 2025)
  url: https://www.ignet.gov/sites/default/files/files/QAR%20Guide%20July-2025.pdf
  kind: official-reference
  lastReviewedAt: 2026-10-30
  note: The peer review of investigative operations for Offices of Inspector General with statutory law enforcement authority, which checks that CIGIE’s Quality Standards for Investigations and the Attorney General’s guidelines are followed. CIGIE keeps the schedule of reviews.

- id: ig-act-402
  title: 5 U.S.C. § 402 — Establishment and purpose of Offices of Inspector General
  url: https://www.govinfo.gov/link/uscode/5/402?link-type=html
  kind: official-reference
  lastReviewedAt: 2026-10-28
  note: "The purposes of Offices of Inspector General: audits and investigations; economy, efficiency, and effectiveness; preventing and detecting fraud and abuse; and keeping the agency head and Congress fully and currently informed."

- id: ig-act-405
  title: 5 U.S.C. § 405 — Reports
  url: https://www.govinfo.gov/link/uscode/5/405?link-type=html
  kind: official-reference
  lastReviewedAt: 2026-10-30
  note: What each semiannual report must include, such as questioned costs, funds put to better use, open recommendations, investigative statistics, and peer review results, with its deadlines, and the report of particularly serious or flagrant problems, which goes to Congress within 7 calendar days (§ 405(e)).

- id: ig-act-407
  title: 5 U.S.C. § 407 — Complaints by employees
  url: https://www.govinfo.gov/link/uscode/5/407?link-type=html
  kind: official-reference
  lastReviewedAt: 2026-10-30
  note: Receiving employee complaints, keeping a complainant’s identity confidential, and protection from reprisal.

- id: ig-act-420
  title: 5 U.S.C. § 420 — Information on websites of Offices of Inspectors General
  url: https://www.govinfo.gov/link/uscode/5/420?link-type=html
  kind: official-reference
  lastReviewedAt: 2026-10-28
  note: Posting audit, inspection, and evaluation reports within 3 days, and a direct link for reporting fraud, waste, and abuse.

- id: cigie-silver-book
  title: Council of the Inspectors General on Integrity and Efficiency — Quality Standards for Federal Offices of Inspector General (Silver Book)
  url: https://www.ignet.gov/sites/default/files/files/Silver%20Book%20Revision%20-%208-20-12r.pdf
  kind: official-reference
  publicationDate: 2012-08-20
  lastReviewedAt: 2026-10-28
  note: The overall standards for OIGs, including independence in fact and in appearance, confidentiality, and following the professional standards for audits, investigations, inspections, and evaluations.

- id: cigie-investigation-standards
  title: Council of the Inspectors General on Integrity and Efficiency — Quality Standards for Investigations (July 2025)
  url: https://www.ignet.gov/sites/default/files/files/Quality%20Standards%20for%20Investigations%20July-2025.pdf
  kind: official-reference
  publicationDate: 2025-07-15
  lastReviewedAt: 2026-10-30
  note: Standards for investigations in OIGs, replacing the 2011 edition. Among them, investigative information is to be stored securely so it can be retrieved effectively, with personal and other sensitive information protected.

- id: cigie-blue-book
  title: Council of the Inspectors General on Integrity and Efficiency — Quality Standards for Inspection and Evaluation (Blue Book)
  url: https://www.ignet.gov/sites/default/files/files/QualityStandardsforInspectionandEvaluation-2020.pdf
  kind: official-reference
  publicationDate: 2020-12-01
  lastReviewedAt: 2026-10-28
  note: Standards for planning, evidence, documentation, supervision, and reporting in inspections and evaluations.

- id: gao-yellow-book
  title: U.S. Government Accountability Office — Government Auditing Standards (Yellow Book)
  url: https://www.gao.gov/yellowbook
  kind: official-reference
  lastReviewedAt: 2026-10-28
  note: The standards for audits of government entities, including audit documentation, supervision, and quality management. The 2024 revision applies to audits beginning on or after December 15, 2025.

- id: gao-ig-act
  title: Public Law 115-414 — Good Accounting Obligation in Government Act (GAO-IG Act)
  url: https://www.govinfo.gov/app/details/PLAW-115publ414
  kind: official-reference
  lastReviewedAt: 2026-10-28
  note: Agencies report, in their annual budget justifications, on public GAO and Inspector General recommendations that remain open.

- id: nist-ai-rmf
  title: NIST — Artificial Intelligence Risk Management Framework (AI RMF 1.0)
  url: https://www.nist.gov/itl/ai-risk-management-framework
  kind: official-reference
  publicationDate: 2023-01-26
  lastReviewedAt: 2026-10-29
  note: A framework for voluntary use in managing the risks of AI systems, built around four functions, govern, map, measure, and manage, and the characteristics of trustworthy AI, such as being valid, accountable, and fair.
