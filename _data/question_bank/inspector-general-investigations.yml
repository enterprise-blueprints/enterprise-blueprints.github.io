# Questions only an Office of Inspector General engagement needs. The
# mission's effectiveness model has questions of its own, about each condition
# and behavior. See "Question bank" in the README for the format.
title: Inspector General investigations
summary: The hotline, independence, referrals, and reporting that set an Office of Inspector General apart.
when: Alongside the kickoff, with the Inspector General's leadership, the hotline, and counsel.
mission: mission.inspector-general-investigations
questions:
  - id: channels
    text: How do allegations arrive today, and which channels have to be kept, such as phone, web, email, mail, or walk-ins?
    why: Every channel needs an intake path, and the mix sets the volume and the protections intake needs.
    informs: [process, system]
    ask: [hotline]
  - id: anonymity
    text: Who may ever learn a complainant's identity, and through what approval?
    why: Identity protection shapes access control, audit, and how case records are separated.
    informs: [constraint, quality]
    ask: [counsel, hotline]
  - id: independence
    text: Which systems and staff does the office share with the agency it oversees?
    why: Shared systems can compromise independence, so they often decide what the office has to run on its own.
    informs: [system, constraint]
    ask: [inspector-general, oig-it]
  - id: restricted-cases
    text: How are sensitive cases, such as those about senior officials or the office's own staff, restricted today?
    why: Restricted cases need access rules beyond role-based access, and they have to be auditable.
    informs: [constraint, process]
    ask: [aigi, counsel]
  - id: referrals
    text: How do cases go to prosecutors and partner agencies, and what comes back?
    why: Referral handoffs and their status updates become integration and tracking requirements.
    informs: [process, stakeholder]
    ask: [sac, prosecutors]
  - id: semiannual
    text: How is the semiannual report to Congress put together today, and how long does it take?
    why: The report's statistics have to come from case data, and the effort it takes today is a baseline.
    informs: [metric, process]
    ask: [analytics]
  - id: evidence
    text: What evidence do agents collect in the field, and how is chain of custody kept today?
    why: Evidence handling sets needs for capture, storage, and records that have to stand up in court.
    informs: [process, quality]
    ask: [special-agents]
  - id: retention
    text: Which records schedules apply to case files, and who approves their disposition?
    why: Retention rules become constraints on storage, deletion, and legal holds.
    informs: [constraint]
    ask: [records-officer]
