# Requirements, in the order the pages show them, each with the links it holds.

- id: plan-each-acquisition
  title: Plan each acquisition early enough to meet the need
  kind: timeliness
  description: Write down the need, the strategy, the contract type, how it will be competed, and the milestones, at the level of detail the acquisition’s size and the agency’s rules call for.
  sources: [ far ]

- id: research-the-market
  title: Research the market before each acquisition
  kind: checks-controls
  description: Find out whether commercial products and services, and small businesses, can meet the need, and record what was found and how it shaped the acquisition.
  sources: [ far, small-business-goals-15-usc-644 ]

- id: publicize-on-sam
  title: Publicize each opportunity on SAM.gov
  kind: transparency-reporting
  description: Post notices of proposed contract actions and solicitations on SAM.gov when the FAR, as the agency applies it, requires them, with enough time for businesses to respond.
  sources: [ far, sam-gov ]

- id: justify-other-than-full-open
  title: Justify and approve any exception to full and open competition
  kind: checks-controls
  description: Name the statutory authority and the reasons, get the approvals the law requires for the contract’s value, and make the justification public when required.
  sources: [ competition-exceptions-41-usc-3304 ]

- id: receive-offers-securely
  title: Receive offers securely, and know when each arrived
  kind: privacy-security
  description: Take offers through a channel that keeps them from anyone outside the evaluation, and records when each one arrived, so late offers are handled by the solicitation’s rules.
  sources: [ far, procurement-integrity-41-usc-2102 ]

- id: evaluate-against-stated-criteria
  title: Evaluate offers only against the stated factors
  kind: fairness-due-process
  description: Rate each offer against the factors and their relative importance as the solicitation stated them, and record the strengths, weaknesses, and risks behind each rating.
  sources: [ far ]

- id: protect-source-selection-information
  title: Keep proposal and source selection information from anyone not authorized
  kind: privacy-security
  description: Limit access to proposals, evaluations, and rankings to the people working on the source selection, until the award and afterward as the law requires.
  sources: [ procurement-integrity-41-usc-2102 ]

- id: document-award-decision
  title: Document the award decision, and notify and debrief offerors
  kind: decisions-on-record
  description: Record the source selection decision and the reasons for it, notify the offerors not selected, and offer the debriefings the rules call for.
  sources: [ far ]

- id: check-exclusions-integrity
  title: Check exclusions and integrity records before award
  kind: checks-controls
  description: Confirm the apparent awardee is registered in SAM.gov and not excluded, and above the simplified acquisition threshold, review its responsibility and qualification records and document how they were considered.
  sources: [ far, integrity-records-41-usc-2313, sam-gov ]

- id: determine-responsibility
  title: Determine the contractor responsible before award
  kind: checks-controls
  description: Record that the contractor has the resources, performance record, integrity, and capacity to do the work, and refer a small business found not responsible to the Small Business Administration.
  sources: [ far ]

- id: respond-to-protests-on-time
  title: Answer each protest by its deadline
  kind: timeliness
  description: Track each protest’s deadlines from the day it’s filed, such as GAO’s 30 days for the agency’s report, and produce the documents the forum requires.
  sources: [ gao-bid-protest-rules, protest-decisions-31-usc-3554 ]

- id: stay-when-required
  title: Hold the award or the work when a protest requires it
  kind: fairness-due-process
  description: When GAO gives notice of a protest filed in time, hold off on the award or suspend performance until GAO decides, unless the head of the procuring activity makes the written finding the law allows.
  sources: [ protest-stay-31-usc-3553 ]

- id: monitor-performance
  title: Monitor performance against the contract
  kind: checks-controls
  description: Name who monitors each contract and within what authority, inspect and accept deliveries against the contract’s terms, and record problems and what was done about them.
  sources: [ far ]

- id: manage-modifications
  title: Change contracts only through written modifications
  kind: checks-controls
  description: Make each change through a modification signed by a contracting officer with the authority for it, with its funding and any effect on price and schedule recorded.
  sources: [ far ]

- id: receive-invoices-electronically
  title: Receive invoices electronically
  kind: service-access
  description: Take invoices through an electronic invoicing system, so each one is recorded on arrival, routed for acceptance, and visible to the contractor until it’s paid.
  sources: [ invoice-processing-platform ]

- id: pay-by-due-date
  title: Return improper invoices within 7 days, and pay proper ones on time
  kind: timeliness
  description: Check each invoice promptly, return one that isn’t proper within 7 days with the reasons, and pay proper ones by the due date, adding interest when a payment is late.
  sources: [ prompt-payment-31-usc-3903 ]

- id: evaluate-performance-on-schedule
  title: Evaluate contractor performance at least annually and at completion
  kind: timeliness
  description: Complete each required evaluation in CPARS, give the contractor up to 14 days to comment, and have a reviewing official above the contracting officer settle disagreements.
  sources: [ far, cpars ]

- id: report-contract-actions
  title: Report each contract action within three business days
  kind: transparency-reporting
  description: Have the contracting officer confirm each contract action report before the award is released, and complete it in SAM.gov within three business days after award.
  sources: [ far, sam-gov ]

- id: certify-contract-data
  title: Certify the year’s contract data
  kind: transparency-reporting
  description: Check the agency’s contract data for completeness and accuracy, and send GSA the annual certification within 120 days after the fiscal year ends.
  sources: [ far ]

- id: check-subcontract-reporting
  title: See that contractors report first-tier subcontracts
  kind: transparency-reporting
  description: Find contracts whose contractors haven’t reported the first-tier subcontracts the FAR’s reporting clause requires in SAM.gov, and follow up.
  sources: [ far, sam-gov ]

- id: close-within-standards
  title: Close each contract within the time standard for its type
  kind: timeliness
  description: Close each contract within 6 months of physical completion for firm-fixed-price contracts, 36 months for those needing indirect cost rates settled, and 20 months for others, unless the agency’s rules say otherwise.
  sources: [ far ]

- id: release-unneeded-funds
  title: Release funds no longer needed
  kind: checks-controls
  description: Deobligate money no longer needed on a contract, during the work and at closeout, while it can still be used.
  sources: [ far ]
