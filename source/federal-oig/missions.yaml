# Missions, in the order the pages show them, each with the links it holds.

- id: independent-government-oversight
  title: Office of Inspector General
  description: Provide independent and objective oversight to prevent and detect fraud, waste, and abuse; promote economy, efficiency, and effectiveness; and communicate findings and recommendations concerning federal programs and operations.
  sources: [ ig-act-404, oversight-mission, cigie-faq ]
  attributes:
    tagline: Independent oversight of government programs and operations
    sector: public-sector
    scope: US-federal-OIG
    principles:
      - The office runs its own systems, administering them and deciding who sees its work, as its independence requires
      - Each matter is one record from intake to closure, and each engagement one record from plan to its last recommendation
      - The identity of people who report is kept apart from the allegation from the first contact
      - Statistics for the semiannual report come from the systems of record, not from spreadsheets
      - Agency officials send corrective action updates into the office’s tracker through their own access
      - Analytics and AI suggest, and staff decide
  seeks:
    - to: effective-programs
      id: oig-mission-seeks-effective-programs
    - to: fraud-waste-abuse-prevented
      id: oig-mission-seeks-fraud-waste-abuse-prevented
    - to: leaders-congress-informed
      id: oig-mission-seeks-leaders-congress-informed
    - to: problems-corrected
      id: oig-mission-seeks-problems-corrected
    - to: concerns-raised-safely
      id: oig-mission-seeks-concerns-raised-safely
