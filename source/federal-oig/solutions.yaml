# Solutions: the ways to source each pattern, in the order the pages show them,
# each with the patterns it implements and anything it needs.

- id: oversight-intake-case-tracking-product
  title: An oversight case product
  description: A case management product made for oversight and investigative work, configured for the office and administered by it.
  approach: product
  hostedBy: vendor
  attributes:
    strengths:
      - Built around investigative work, such as evidence handling and referrals
      - Comes with reports shaped for oversight reporting
    fitsWhen:
      - There’s budget for licenses and an administrator in the office
    watchFor:
      - Another product to buy, secure, and keep up
  components:
    - id: staff-intake
      title: Staff intake forms
      description: Where staff log a matter that came by phone, email, or mail.
      tier: front
      exposure: internal
      sendsTo: [ case-workflow ]
    - id: case-workspace
      title: Investigator workspace
      description: Where investigators work their assigned cases.
      tier: front
      exposure: internal
      sendsTo: [ case-workflow ]
      needs: [ agency-sign-on ]
    - id: case-workflow
      title: Triage and case workflow
      description: Routes each matter, records triage decisions and referrals, and limits access by assignment.
      tier: service
      sendsTo: [ case-records ]
    - id: statistics
      title: Semiannual statistics
      description: Counts for oversight reporting, from the case records.
      tier: service
      sendsTo: [ case-records ]
    - id: case-records
      title: Case and evidence records
      description: Each matter from intake to closure, with its evidence records.
      tier: data
  implements: [ oversight-intake-case-tracking ]
  depends_on: [ agency-sign-on ]

- id: oversight-intake-case-tracking-agency-platform
  title: The agency’s shared case platform
  description: The office’s own case types on the agency’s shared case platform, with administration and access the office controls.
  approach: platform
  attributes:
    strengths:
      - Uses licenses, skills, and security approvals the agency already has
    fitsWhen:
      - The agency runs a case platform, and the office can control who administers its part
    watchFor:
      - The office’s independence depends on keeping its administration and access apart from the agency’s
      - Evidence handling, such as chain of custody, usually needs building
  components:
    - id: case-forms
      title: Office case types and forms
      description: The office’s own case types, forms, and queues, seen only by its staff.
      tier: front
      exposure: internal
      sendsTo: [ case-steps ]
    - id: case-steps
      title: Triage and referral steps
      description: The office’s workflow on the platform, with recorded triage decisions.
      tier: service
      sendsTo: [ case-data ]
      needs: [ shared-case-platform ]
    - id: case-data
      title: Office case data
      description: Case records kept apart from the agency’s, with the office controlling who sees them.
      tier: data
  implements: [ oversight-intake-case-tracking ]
  depends_on:
    - to: shared-case-platform
      note: The office’s case types and steps are the shared platform, set up for oversight.

- id: confidential-hotline-intake-product
  title: A hotline product
  description: A hotline product with a public web form and phone line, anonymous reporting, and a code to check back.
  approach: product
  hostedBy: vendor
  components:
    - id: web-form
      title: Public reporting form
      description: Where anyone reports a concern, with or without their name, and gets a code to check back.
      tier: front
      exposure: public
      sendsTo: [ intake-queue ]
    - id: phone-line
      title: Hotline phone line
      description: Calls taken by staff or recorded, into the same queue.
      tier: front
      exposure: public
      sendsTo: [ intake-queue ]
    - id: intake-queue
      title: Intake queue
      description: Where the intake team reviews new reports.
      tier: service
      exposure: internal
      sendsTo: [ report-records ]
      needs: [ agency-sign-on ]
    - id: report-records
      title: Report records
      description: Reports with the identities of people who report kept from staff who don’t need them.
      tier: data
  implements: [ confidential-hotline-intake ]
  depends_on: [ agency-sign-on ]

- id: audit-management-system-product
  title: An audit management product
  description: A product made for audit work, with electronic work papers, review sign-offs, and recommendations built in.
  approach: product
  hostedBy: vendor
  attributes:
    strengths:
      - The documentation and supervision steps come built in
      - Reporting across engagements, such as on open recommendations, is part of it
    fitsWhen:
      - The office has many engagements at a time
    watchFor:
      - Another product to buy, secure, and keep up
  components:
    - id: auditor-workspace
      title: Auditor workspace
      description: Where auditors plan engagements and write work papers.
      tier: front
      exposure: internal
      sendsTo: [ review ]
      needs: [ agency-sign-on ]
    - id: review
      title: Review and sign-off
      description: Supervisors’ review notes and sign-offs, recorded on each work paper.
      tier: service
      sendsTo: [ work-papers ]
    - id: work-papers
      title: Work papers and recommendations
      tier: data
  implements: [ audit-management-system ]
  depends_on: [ agency-sign-on ]

- id: audit-management-system-workspace
  title: Work papers in the collaboration workspace
  description: A workspace for each engagement in the agency’s collaboration suite, with work paper templates, and supervisors’ sign-offs recorded through document approvals.
  approach: combine
  attributes:
    strengths:
      - Uses tools the office already has and knows
      - Costs little to start, and is easy to change
    fitsWhen:
      - The office is small, with a few engagements at a time
    watchFor:
      - Cross-references and review sign-offs depend on discipline, which peer reviews will test
      - Reporting across engagements, such as on open recommendations, takes manual work
  components:
    - id: engagement-sites
      title: Engagement workspaces
      description: A workspace for each engagement, made from a template.
      tier: front
      exposure: internal
      sendsTo: [ approvals ]
      needs: [ records-aware-collaboration ]
    - id: approvals
      title: Sign-off approvals
      description: Document approvals that record a supervisor’s sign-off.
      tier: service
      sendsTo: [ work-paper-library ]
    - id: work-paper-library
      title: Work paper library
      description: The engagement’s documents, with retention labels applied.
      tier: data
  implements: [ audit-management-system ]
  depends_on:
    - to: records-aware-collaboration
      note: The workspaces, approvals, and retention labels are the agency’s collaboration suite.

- id: shared-recommendation-tracker-audit-module
  title: A module of the audit product
  description: The audit product’s recommendation module, opened to agency officials for their own recommendations.
  approach: product
  hostedBy: vendor
  attributes:
    fitsWhen:
      - The office’s audit product has a module like this
    watchFor:
      - Agency officials need access to the office’s product, limited to their own recommendations
  components:
    - id: officials-portal
      title: Agency officials’ portal
      description: Where agency officials update their recommendations and attach evidence.
      tier: front
      exposure: internal
      sendsTo: [ follow-up ]
      needs: [ agency-sign-on ]
    - id: follow-up
      title: Recommendation follow-up
      description: Reminders, status changes, and the office’s review of closure requests.
      tier: service
      sendsTo: [ recommendations ]
    - id: recommendations
      title: Recommendation records
      tier: data
  implements: [ shared-recommendation-tracker ]
  depends_on: [ agency-sign-on ]

- id: shared-recommendation-tracker-owned-app
  title: An app the office owns on a platform
  description: A tracker the office builds and administers on a platform, kept apart from the agency’s other apps.
  approach: platform
  attributes:
    fitsWhen:
      - The office’s audit tools have no module agency officials can use
    watchFor:
      - The office keeps the app working, and in step with its audit tools
  components:
    - id: tracker-app
      title: Tracker app
      description: Where office staff and agency officials see and update recommendations.
      tier: front
      exposure: internal
      sendsTo: [ reminders ]
      needs: [ agency-sign-on ]
    - id: reminders
      title: Reminders and escalations
      description: Notices as target dates near, and escalations when they pass.
      tier: service
      sendsTo: [ recommendations ]
    - id: recommendations
      title: Recommendation records
      tier: data
  implements: [ shared-recommendation-tracker ]
  depends_on: [ agency-sign-on ]

- id: oversight-reporting-from-source-data-build
  title: A reporting store fed by the office’s systems
  description: A reporting store the office builds, fed by its case, audit, and recommendation systems.
  approach: build
  components:
    - id: report-views
      title: Report views
      description: The semiannual statistics and other reports, for the office’s staff.
      tier: front
      exposure: internal
      sendsTo: [ reporting-store ]
      needs: [ agency-sign-on ]
    - id: data-feeds
      title: Data feeds
      description: Scheduled loads from the case, audit, and recommendation systems.
      tier: service
      sendsTo: [ reporting-store ]
    - id: reporting-store
      title: Reporting store
      description: The figures each report is built from, with where each came from.
      tier: data
  implements: [ oversight-reporting-from-source-data ]
  depends_on: [ agency-sign-on ]

- id: oversight-data-analytics-build
  title: An analytics workspace
  description: An analytics workspace where the office’s data team brings in agency financial, payment, and program data.
  approach: build
  components:
    - id: analytics-workspace
      title: Analytics workspace
      description: Notebooks and dashboards for the office’s data team.
      tier: front
      exposure: internal
      sendsTo: [ analysis-store ]
      needs: [ agency-sign-on ]
    - id: data-loads
      title: Data loads
      description: Copies of agency financial, payment, and program data, brought in on a schedule.
      tier: service
      sendsTo: [ analysis-store ]
    - id: analysis-store
      title: Analysis data store
      tier: data
  implements: [ oversight-data-analytics ]
  depends_on: [ agency-sign-on ]

- id: digital-evidence-store-product
  title: A digital evidence management product
  description: A product made for managing digital evidence, with custody logs and hashing built in.
  approach: product
  hostedBy: vendor
  attributes:
    fitsWhen:
      - The office handles large amounts of digital evidence
    watchFor:
      - Another product to buy, secure, and keep up
  components:
    - id: evidence-review
      title: Evidence upload and review
      description: Where investigators add, view, and share evidence.
      tier: front
      exposure: internal
      sendsTo: [ custody ]
      needs: [ agency-sign-on ]
    - id: custody
      title: Custody log and hashing
      description: Records who handled each item, and checks it hasn’t changed.
      tier: service
      sendsTo: [ evidence-storage ]
    - id: evidence-storage
      title: Evidence storage
      tier: data
  implements: [ digital-evidence-store ]
  depends_on: [ agency-sign-on ]

- id: digital-evidence-store-secure-storage
  title: Secure storage with a custody log
  description: Encrypted storage in the agency’s cloud or data center, kept apart for the office, with a custody log the office builds and links to its case system.
  approach: build
  attributes:
    fitsWhen:
      - The office handles digital evidence now and then
    watchFor:
      - The custody log and hashing carry the evidence’s weight, so they must be built and checked with care
  components:
    - id: evidence-intake
      title: Evidence intake app
      description: Where investigators add evidence and link it to a case.
      tier: front
      exposure: internal
      sendsTo: [ custody-log ]
      needs: [ agency-sign-on ]
    - id: custody-log
      title: Custody log
      description: Records each transfer and access, with a hash of each file.
      tier: service
      sendsTo: [ encrypted-storage ]
    - id: encrypted-storage
      title: Encrypted storage
      description: Kept apart for the office, in the agency’s cloud or data center.
      tier: data
  implements: [ digital-evidence-store ]
  depends_on: [ agency-sign-on ]
