# Solutions, in the order the pages show them, each with the links it holds.

- id: acquisition-north-star
  title: Acquisition North Star
  description: "The long-term architecture this library recommends for a contracting office: one acquisition system that carries each acquisition from the program office’s request to closeout, with a secure proposal portal, contract data that reaches SAM.gov, CPARS, and the financial system without retyping, invoices through Treasury, and analytics and AI drafting on top."
  attributes:
    principles:
      - Each acquisition is one record from the program office’s request to closeout
      - Clauses come from rules the contracting office keeps current as the FAR changes
      - Contract data reaches SAM.gov, CPARS, and the financial system without retyping
      - Vendors submit offers through one secure portal, and offers open only after the deadline
      - Every offeror gets the same SAM.gov checks the agency uses for grants applicants
      - AI drafts and analytics inform, and contracting officers decide
    watchFor:
      - Clause rules need an owner while the FAR overhaul is under way
      - For buys the agency rarely makes, another agency’s contracting office can still be the better way
  includes:
    - to: agency-sign-on
      note: Staff sign in through the agency, with roles the contracting office administers.
    - to: vendor-proposal-portal
      note: Offers and questions land with the solicitation they answer in the acquisition system.
    - to: acquisition-management
      way: product
      note: A contract writing product, so clause logic, approvals, and SAM.gov reporting come built in.
    - to: records-aware-collaboration
      note: Where program offices and contracting staff draft and collaborate, with records and sensitivity labels applied.
    - to: acquisition-ai-drafting
      note: Drafts that program offices and contracting staff start from, using the agency’s templates.
    - to: sam-gov-entity-checks
      note: The acquisition system checks each offeror’s registration, exclusions, and responsibility records before award.
    - to: contract-data-to-sam
      note: The acquisition system sends each contract action report to SAM.gov when the award is signed.
    - to: invoices-through-ipp
      note: Vendors invoice against the awards in the acquisition system, and acceptance is routed to the program office.
    - to: cpars-from-contract-data
      note: Contracts registered in CPARS from the acquisition system’s records, with their evaluation dates.
    - to: records-in-business-systems
      way: built-in
      note: The acquisition system keeps each contract file on its records schedule.
    - to: contract-spend-analytics
      note: Brings the acquisition system’s data together with spending, invoices, and evaluations.
    - to: agency-security-monitoring
      note: The acquisition system and proposal portal send their logs to the agency.
  supports: [ acquiring-goods-and-services ]
