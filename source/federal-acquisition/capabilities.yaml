# Capabilities, in the order the pages show them, each with the links it holds.

- id: acquisition-planning-market-research
  title: Acquisition Planning & Market Research
  description: Ability to define each need with the program office, research the market for commercial products and services and for small businesses able to do the work, and plan the acquisition’s strategy, contract type, competition, and schedule early enough to meet the need.
  sources: [ far, small-business-goals-15-usc-644 ]
  applicabilityNotes: How much planning is written down depends on the acquisition’s size and the agency’s rules. Small purchases need little; major acquisitions need a written plan.
  contributes_to: [ needs-met-on-time, full-open-competition, small-business-participation ]
  satisfies: [ plan-each-acquisition, research-the-market ]
  candidate_pattern:
    - acquisition-on-shared-platform
    - to: contract-writing-system
      coverage: partial
      note: Where the product takes requests and holds the plan. Market research is usually done and recorded outside it.
    - to: assisted-acquisition-service
      coverage: partial
      note: The provider plans the acquisition, but the agency still defines the need, its funding, and its timing.
    - to: acquisition-ai-drafting
      coverage: partial
      note: Drafts market research summaries and plans for staff to check and finish.
    - to: contract-spend-analytics
      coverage: partial
      note: Shows what the agency already buys, from whom, and on which contracts, before a new acquisition starts.

- id: solicitation-publicizing
  title: Solicitation & Publicizing
  description: Ability to publicize each opportunity on SAM.gov, issue solicitations with clear requirements and evaluation criteria, answer offerors’ questions the same way for everyone, and receive offers securely by the deadline.
  sources: [ far, sam-gov, competition-41-usc-3301 ]
  applicabilityNotes: Orders under existing contracts, such as the GSA schedules, follow their own, simpler steps for notice and competition.
  contributes_to: [ full-open-competition, small-business-participation ]
  satisfies: [ publicize-on-sam, justify-other-than-full-open, receive-offers-securely ]
  candidate_pattern:
    - contract-writing-system
    - assisted-acquisition-service
    - to: acquisition-on-shared-platform
      coverage: partial
      note: Solicitations can be assembled from templates on the platform, but clause selection and posting to SAM.gov usually need building.
    - to: vendor-proposal-portal
      coverage: partial
      note: Receives offers and answers questions. The solicitation itself is written and posted elsewhere.
    - to: acquisition-ai-drafting
      coverage: partial
      note: Drafts statements of work and evaluation criteria for staff to check and finish.

- id: evaluation-source-selection
  title: Evaluation & Source Selection
  description: Ability to evaluate offers only against the factors the solicitation stated, keep proposal and source selection information from anyone not authorized, document the award decision and its reasons, and notify and debrief offerors.
  sources: [ far, procurement-integrity-41-usc-2102 ]
  applicabilityNotes: Evaluations range from comparing prices on a simple purchase to a source selection board weighing many factors on a major one.
  contributes_to: [ full-open-competition, award-decisions-hold-up ]
  satisfies: [ evaluate-against-stated-criteria, protect-source-selection-information, document-award-decision ]
  candidate_pattern:
    - to: contract-writing-system
      coverage: partial
      note: Holds the award decision and notices. Evaluators’ worksheets and consensus often live in a separate evaluation tool or workspace.
    - to: acquisition-on-shared-platform
      coverage: partial
      note: Evaluator assignments and ratings can be tracked on the platform, with access limited to the evaluation team.
    - to: assisted-acquisition-service
      coverage: partial
      note: The provider runs the evaluation, but the agency’s own technical experts usually evaluate the offers.
    - to: vendor-proposal-portal
      coverage: partial
      note: Keeps proposals where only the evaluation team can open them.

- id: responsibility-determination
  title: Responsibility & Award
  description: Ability to check that the apparent awardee is registered in SAM.gov and not excluded, review its integrity and performance records, determine it responsible, and issue the contract with the clauses its type and value call for.
  sources: [ far, integrity-records-41-usc-2313, sam-gov ]
  applicabilityNotes: Review of responsibility and qualification records is required above the simplified acquisition threshold. A small business found not responsible is referred to the Small Business Administration, which can issue a Certificate of Competency.
  contributes_to: [ responsible-contractors, award-decisions-hold-up ]
  satisfies: [ check-exclusions-integrity, determine-responsibility ]
  candidate_pattern:
    - contract-writing-system
    - assisted-acquisition-service
    - to: acquisition-on-shared-platform
      coverage: partial
      note: The determination can be recorded on the platform. The award document with its clauses usually comes from a contract writing system.
    - to: sam-gov-entity-checks
      coverage: partial
      note: Checks registration, exclusions, and integrity records automatically. The contracting officer still makes the determination.

- id: protest-handling
  title: Bid Protests
  description: Ability to receive and answer protests, at the agency, at GAO, or at the Court of Federal Claims, by their deadlines, hold off on award or performance when the law requires it, prepare the agency’s report from the contract file, and take corrective action where it’s warranted.
  sources: [ protest-stay-31-usc-3553, protest-decisions-31-usc-3554, gao-bid-protest-rules ]
  applicabilityNotes: Agency counsel usually leads the response with the contracting officer. Which forum hears a protest, and how quickly, depends on where and when it’s filed.
  contributes_to: [ award-decisions-hold-up ]
  satisfies: [ respond-to-protests-on-time, stay-when-required ]
  candidate_pattern:
    - to: shared-case-platform
      note: Each protest tracked as its own case, with its forum, deadlines, documents, and outcome.
    - to: acquisition-on-shared-platform
      coverage: partial
      note: Where protests are tracked with the acquisitions they challenge. Counsel’s own work is often tracked in a separate legal matter system.
    - to: contract-writing-system
      coverage: partial
      note: Records the protest against the acquisition, holds the award or the work, and supplies the contract file for the agency’s report. Counsel tracks the protest’s deadlines and filings elsewhere.
    - to: assisted-acquisition-service
      coverage: partial
      note: The provider’s counsel answers protests of its awards, but needs the agency’s experts and records.

- id: contract-administration
  title: Contract Administration & Surveillance
  description: Ability to monitor each contractor’s performance against the contract, inspect and accept what’s delivered, make changes only through written modifications by an authorized contracting officer, exercise options, and act on problems.
  sources: [ far ]
  applicabilityNotes: A contracting officer’s representative often monitors the work day to day, within the authority the contracting officer delegates in writing.
  contributes_to: [ contracts-perform-as-agreed, needs-met-on-time ]
  satisfies: [ monitor-performance, manage-modifications ]
  candidate_pattern:
    - contract-writing-system
    - to: acquisition-on-shared-platform
      coverage: partial
      note: Surveillance records and modification requests can be tracked on the platform. The modifications themselves usually come from a contract writing system.
    - to: assisted-acquisition-service
      coverage: partial
      note: The provider’s contracting officer makes the modifications. The agency’s own representative monitors the work.

- id: invoicing-payment
  title: Invoicing & Payment
  description: Ability to receive invoices electronically, check each against the contract and what was delivered and accepted, return improper ones within 7 days with the reasons, and pay proper ones by the due date, with any interest owed.
  sources: [ prompt-payment-31-usc-3903, invoice-processing-platform ]
  applicabilityNotes: Payment usually happens in the agency’s financial system, with acceptance from the program office and the contract’s terms from the contracting office.
  contributes_to: [ invoices-paid-on-time ]
  satisfies: [ receive-invoices-electronically, pay-by-due-date ]
  candidate_pattern:
    - invoices-through-ipp
    - to: assisted-acquisition-service
      coverage: partial
      note: Some providers process invoices and payments for the contracts they award. Others leave payment to the agency.

- id: past-performance-evaluation
  title: Past Performance Evaluation
  description: Ability to evaluate each contractor’s performance at least once a year and when the work is complete, give the contractor its chance to comment, have someone above the contracting officer settle disagreements, and record the evaluations in CPARS for future source selections.
  sources: [ far, cpars ]
  applicabilityNotes: Evaluations are required above set dollar thresholds, which differ by kind of contract. Source selections use evaluations within three years of the work’s completion, or six for construction and architect-engineer contracts.
  contributes_to: [ contracts-perform-as-agreed, responsible-contractors ]
  satisfies: [ evaluate-performance-on-schedule ]
  candidate_pattern:
    - cpars-from-contract-data
    - to: assisted-acquisition-service
      coverage: partial
      note: The provider’s contracting officer completes the evaluation, with the agency’s representative’s input.
    - to: contract-spend-analytics
      coverage: partial
      note: Finds evaluations coming due or overdue. The evaluations themselves are written in CPARS.

- id: contract-reporting
  title: Contract Data Reporting
  description: Ability to report each contract action to SAM.gov within three business days after award, keep the data accurate, certify it each year, and see that contractors report their first-tier subcontracts.
  sources: [ far, sam-gov, usaspending ]
  applicabilityNotes: Contract data reported to SAM.gov flows on to USAspending.gov. Some information, such as classified actions, isn’t reported publicly.
  contributes_to: [ contract-data-public, small-business-participation ]
  satisfies: [ report-contract-actions, certify-contract-data, check-subcontract-reporting ]
  candidate_pattern:
    - contract-data-to-sam
    - assisted-acquisition-service
    - to: contract-writing-system
      coverage: partial
      note: Where the product sends contract action reports itself. Checking subcontract reporting often happens outside it.

- id: contract-closeout
  title: Contract Closeout
  description: Ability to close each contract within the time standard for its type after the work is done, settling the final invoice and any indirect cost rates, releasing funds no longer needed, and completing the contract file.
  sources: [ far ]
  applicabilityNotes: A contract can’t be closed while it’s in litigation or under appeal, or before a termination is settled.
  contributes_to: [ contracts-closed-on-time ]
  satisfies: [ close-within-standards, release-unneeded-funds ]
  candidate_pattern:
    - contract-writing-system
    - assisted-acquisition-service
    - to: acquisition-on-shared-platform
      coverage: partial
      note: Closeout checklists can be tracked on the platform. Releasing funds happens in the financial system.
    - to: contract-spend-analytics
      coverage: partial
      note: Finds contracts past their closeout standard and the funds still on them.
