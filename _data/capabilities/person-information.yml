id: "capability:person-information"
title: "Person Information"
layer: "shared"
status: "draft"
responsibility: "Provide an authorized view of a person from the authoritative records, and match new information to a person the enterprise already knows."
boundaries: "It reads and matches; it changes an authoritative record only where its owner has agreed. Each program still decides what it needs to know about a person and why."
operations:
  - name: "Person.lookup"
    description: "Find people who match identifying details."
    accepts: ["identifying details", "purpose"]
    returns: ["candidate matches"]
  - name: "Person.get"
    description: "Return the view of a person that the requester may see for a stated purpose."
    accepts: ["person ID", "purpose"]
    returns: ["authorized person view"]
  - name: "Person.match"
    description: "Say whether new details belong to an existing person, and how confident the match is."
    accepts: ["person details"]
    returns: ["match", "confidence"]
entities: ["person", "address"]
policies: ["privacy", "authorization", "audit", "data-governance"]
depends_on: []
signs:
  - "The same person has different identifiers in different systems."
  - "Staff search several systems to find someone's current details."
questions:
  - "Which system is authoritative for each kind of person: employees, members of the public, partners?"
  - "How do you tell whether two records describe the same person?"
