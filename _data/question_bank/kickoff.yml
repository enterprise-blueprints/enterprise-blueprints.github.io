# Questions for the first conversation of an engagement. See "Question bank"
# in the README for the format.
title: Kickoff
summary: Why the work matters now, what success looks like, who decides, and what can't change.
when: At the start of an engagement, with the sponsor and the people who run the work.
questions:
  - id: why-now
    text: Why is this work happening now, and what happens if nothing changes?
    why: It shows the urgency, and the cost of doing nothing that any solution has to beat.
    informs: [outcome]
  - id: success
    text: A year after go-live, what would tell you this worked?
    why: The answer names the outcomes, in the customer's own words.
    informs: [outcome, metric]
  - id: measures-today
    text: What do you measure about this work today, and where do those numbers come from?
    why: Existing measures give baselines, and show which metrics are realistic to track.
    informs: [metric, system]
  - id: decides
    text: Who decides this is done, and who else has to agree?
    why: It names the sponsor and the approvers, and how decisions get made.
    informs: [stakeholder]
  - id: who-does-the-work
    text: Who does this work day to day, and who depends on its results?
    why: The people who do and use the work become stakeholders, and the roles in each process.
    informs: [stakeholder, process]
  - id: where-it-hurts
    text: Where does the work get stuck or go wrong today?
    why: Pain points show which steps must change, and they often become the first requirements.
    informs: [process]
  - id: tried-before
    text: What has been tried before, and what happened?
    why: Earlier attempts show constraints, risks, and expectations to manage.
    informs: [constraint]
  - id: fixed-limits
    text: What can't change, such as deadlines, budget, contracts, laws, or policies?
    why: Fixed limits become constraints that every design option has to respect.
    informs: [constraint]
  - id: systems-today
    text: Which systems does the work rely on today, and which have to stay?
    why: It starts the current state, and shows what a solution integrates with or replaces.
    informs: [system]
  - id: out-of-scope
    text: What is deliberately out of scope?
    why: Saying what's excluded keeps the outcomes focused, and belongs in the statement of work.
    informs: [outcome, constraint]
