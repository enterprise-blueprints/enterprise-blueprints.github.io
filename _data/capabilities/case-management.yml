id: "capability:case-management"
title: "Case Management"
layer: "business"
status: "draft"
responsibility: "Keep a matter's people, information, tasks, decisions, and history together from receipt to closure, with one accountable owner at a time."
boundaries: "Each program defines its own case types, rules, and completion criteria; Case Management gives them a common model to build on. It links to documents, people, and tasks held by other capabilities rather than owning them."
operations:
  - name: "Case.create"
    description: "Open a case from a matter, with its source and case type."
    accepts: ["source", "matter details", "case type"]
    returns: ["case ID"]
  - name: "Case.get"
    description: "Return the view of a case that the requester may see."
    accepts: ["case ID", "purpose"]
    returns: ["authorized case view"]
  - name: "Case.assign"
    description: "Give the case an accountable owner, and record the change."
    accepts: ["case ID", "owner"]
    returns: ["assignment"]
  - name: "Case.link"
    description: "Link related cases while each keeps its own history."
    accepts: ["case IDs", "relationship"]
    returns: ["link"]
  - name: "Case.recordDecision"
    description: "Record a decision with its reasons, evidence, and decision-maker."
    accepts: ["case ID", "decision", "reasons", "evidence"]
    returns: ["decision ID"]
  - name: "Case.close"
    description: "Record the outcome and close the case, keeping its history."
    accepts: ["case ID", "outcome"]
    returns: ["closed case"]
entities: ["case", "participant", "interaction", "task", "assignment", "decision"]
policies: ["authorization", "privacy", "audit", "records"]
depends_on: ["person-information", "document-management", "workflow", "search"]
signs:
  - "Each program keeps its own case tracker or spreadsheet."
  - "Staff re-key the same matter into more than one system."
  - "Nobody can say who owns a case after it changes hands."
questions:
  - "Which systems hold cases, or records that work like cases, today?"
  - "Do different teams mean different things by a case?"
