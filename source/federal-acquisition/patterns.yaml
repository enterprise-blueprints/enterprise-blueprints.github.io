# Implementation patterns, in the order the pages show them, each with the links it holds.

- id: contract-writing-system
  title: Contract Writing System
  description: "An example architecture: a contract writing product, configured for the agency’s rules and deviations, that carries each acquisition from the program office’s request through solicitation, award, modifications, and closeout, choosing clauses by the contract’s type and value and connecting to SAM.gov and the agency’s financial system."
  sources: [ far, sam-gov ]
  attributes:
    approach: product
    role: business-applications
    parts:
      - Requests from program offices, with funding checked in the financial system
      - Solicitations, awards, and modifications assembled from templates, with clauses chosen by rules
      - Reviews and approvals set by the acquisition’s value and type
      - Notices posted to SAM.gov, and contract action reports sent there after award
      - Obligations sent to the financial system as each award and modification is signed
      - The contract file, with each document and approval in one place
      - Closeout steps and reminders for each completed contract
    strengths:
      - One record for each contract, from request to closeout
      - Clause logic keeps awards consistent with the rules, and can be updated as the FAR changes
      - Contract data reaches SAM.gov and the financial system without retyping
    fitsWhen:
      - The agency awards many contracts, or contracts of many kinds
      - Its current tools are document templates, email, or an aging custom system
    watchFor:
      - The FAR overhaul and each agency’s deviations change clauses and steps, so clause rules need an owner who keeps them current
      - Moving open contracts from an old system needs careful planning
      - Connections to the financial system often take the most work
  works_with:
    - to: contract-data-to-sam
      note: The product’s connection sends each contract action report to SAM.gov.
    - to: invoices-through-ipp
      note: Awards and their line items set up what vendors invoice against.
    - to: cpars-from-contract-data
      note: Contract data registers each contract in CPARS and sets its evaluation dates.
    - to: sam-gov-entity-checks
      note: Registration and exclusion results show on the award screens.

- id: acquisition-on-shared-platform
  title: Acquisition Requests and Contracts on the Agency’s Shared Platform
  description: "An example architecture: acquisition work built on the agency’s shared case platform, with each request and contract as a record that moves through planning, solicitation, evaluation, award, administration, and closeout, and documents assembled from templates."
  sources: [ far ]
  attributes:
    approach: platform
    role: business-applications
    parts:
      - Request records from program offices, with the need, funding, and timing
      - Acquisition plans, milestones, and approvals for each request
      - Solicitation and award documents assembled from templates
      - Evaluation team assignments and ratings, open only to the team
      - Contract records with modifications, surveillance notes, and closeout checklists
      - Reports on workload, lead times, and contracts coming due for closeout
    strengths:
      - Uses licenses, skills, and security approvals the agency already has
      - Program offices can see where their requests stand
      - Acquisition work can share a platform with the agency’s other case work
    fitsWhen:
      - The agency already runs a platform like this, with people who configure it
      - Its acquisitions are mostly simple, such as orders under existing contracts
    watchFor:
      - Clause selection, posting to SAM.gov, and contract action reporting take real building, and keeping them current with the FAR is ongoing work
      - Each change from the FAR overhaul or an agency deviation has to be built into the platform
      - Contract data the agency reports must still meet SAM.gov’s data standards
  depends_on:
    - to: shared-case-platform
      note: The request and contract records and their steps are the shared platform, set up for acquisition.

- id: assisted-acquisition-service
  title: Assisted Acquisition from Another Federal Agency
  description: "An example architecture: the agency has another federal agency’s contracting office award and administer contracts for it, under an interagency agreement, using the provider’s contract writing system, while the agency defines its needs, funds them, and monitors the work."
  sources: [ far ]
  attributes:
    approach: product
    role: business-applications
    parts:
      - An interagency agreement that sets the services, fees, and who does what
      - The provider’s contracting officers, and its contract writing and reporting systems
      - The agency’s requests, funding, and technical experts for evaluations
      - The agency’s representatives who monitor the work and accept deliveries
      - Regular reports from the provider on each request and contract
    strengths:
      - The agency doesn’t need its own contracting staff and systems for every kind of buy
      - Providers bring experience with acquisitions the agency rarely makes
      - Reporting to SAM.gov and closeout are handled by the provider’s office
    fitsWhen:
      - The agency is small, or makes few acquisitions of some kinds
      - A provider already buys what the agency needs for other agencies
    watchFor:
      - Fees add to the cost of each acquisition
      - The agency still owns its requirements, its funds, and the results, and needs people who can do that well
      - Getting the agency’s contract data and files back, for reporting or a later move, needs agreeing up front

- id: vendor-proposal-portal
  title: A Secure Proposal Portal for Vendors
  description: "An example architecture: vendors submit questions and offers through a portal with their SAM.gov-registered accounts, each upload is time-stamped, and offers open only for the evaluation team after the deadline."
  sources: [ far, procurement-integrity-41-usc-2102 ]
  attributes:
    approach: combine
    role: public-facing
    parts:
      - Vendor accounts tied to their SAM.gov registration
      - Question and answer exchange for each solicitation, with answers shared with everyone
      - Offer uploads with a time stamp and a receipt for the vendor
      - Offers locked until the deadline, then opened only for the evaluation team
      - A record of who opened what, and when
    strengths:
      - Proves when each offer arrived, which matters when one is late
      - Keeps proposals out of email, where they’re hard to protect
      - Vendors get the same answers at the same time
    fitsWhen:
      - The agency receives offers by email today
      - Its solicitations draw many offers, or large ones
    watchFor:
      - An outage near a deadline raises questions of fairness, so there needs to be a plan for one
      - Access for evaluators has to be granted and removed for each source selection
  works_with:
    - to: contract-writing-system
      note: Offers and questions are linked to the solicitation in the contract writing system.

- id: contract-data-to-sam
  title: Contract Action Reports to SAM.gov from the Contract Writing System
  description: "An example architecture: the contract writing system sends each contract action report to SAM.gov through its system-to-system connection when the award is signed, flags reports still in draft or error, and lists contracts whose subcontract reports are missing."
  sources: [ far, sam-gov, usaspending ]
  attributes:
    approach: build
    role: processing
    parts:
      - A connection from the contract writing system to SAM.gov’s contract data reporting service
      - A report for each action, confirmed by the contracting officer before the award is released
      - A daily list of reports still in draft or error, or past three business days
      - A list of contracts whose subcontract reports are missing
      - Checks of the year’s data that support the annual certification
    strengths:
      - Reports are completed on time without retyping
      - Errors are found and fixed at the source
    fitsWhen:
      - The agency’s contract writing system holds the contract data, but reporting is manual or late
    watchFor:
      - SAM.gov’s services and data standards change, as they did when FPDS moved into SAM.gov, so the connection needs keeping up
      - Fixes made in SAM.gov instead of the contract writing system come back next time
  works_with:
    - acquisition-on-shared-platform

- id: invoices-through-ipp
  title: Invoices through Treasury’s Invoice Processing Platform
  description: "An example architecture: vendors send invoices through Treasury’s Invoice Processing Platform, each invoice is matched to its order and routed for acceptance, and the agency’s financial system pays it by the due date, with status visible to the vendor throughout."
  sources: [ invoice-processing-platform, prompt-payment-31-usc-3903 ]
  attributes:
    approach: platform
    role: processing
    parts:
      - Vendor enrollment in IPP, with orders sent from the agency’s financial or contract writing system
      - Invoices matched to the order and its line items
      - Routing for acceptance by the program office, with due dates shown
      - Rejection of improper invoices with the reasons, within 7 days
      - Payment from the financial system, and payment details sent back to the vendor
    strengths:
      - Treasury provides it at no cost to agencies or vendors
      - Each invoice’s arrival date is recorded, which starts the Prompt Payment clock
      - Vendors see their invoices’ status without calling the office
    fitsWhen:
      - The agency still receives paper or emailed invoices
      - Its financial system can exchange orders and payments with IPP
    watchFor:
      - Acceptance by the program office is often what makes payments late, so routing and reminders need care
      - Some kinds of payments, such as utilities, may stay outside IPP
  works_with:
    - to: contract-spend-analytics
      note: Invoice and payment dates feed the reports on late payments.

- id: cpars-from-contract-data
  title: Performance Evaluations in CPARS, Scheduled from Contract Data
  description: "An example architecture: each contract that needs evaluations is registered in CPARS from the contract data, with its assessing officials and due dates, and reminders go to them and their managers until each evaluation is done."
  sources: [ cpars, far ]
  attributes:
    approach: platform
    role: business-applications
    parts:
      - Registration of each contract that needs evaluations, from the contract writing system or SAM.gov data
      - Assessing officials and reviewing officials named for each contract
      - Due dates for each interim and final evaluation
      - Reminders before and after each due date, to the officials and their managers
      - Reports of evaluations due and overdue, by office
    strengths:
      - Uses the government-wide system that source selections already read
      - Evaluations are less often missed when they’re scheduled from the start
    fitsWhen:
      - Evaluations are often late or missing
      - Contracts are registered in CPARS by hand today
    watchFor:
      - CPARS is moving into SAM.gov, so the connection and the steps may change
      - A scheduled evaluation still needs someone who knows the work to write it

- id: acquisition-ai-drafting
  title: AI Help Drafting Acquisition Documents
  description: "An example architecture: contracting and program staff use an AI model, in an environment the agency approves, to draft market research summaries, statements of work, evaluation criteria, and acquisition plans from the agency’s templates and guidance, and then check and finish each draft themselves."
  sources: [ nist-ai-rmf, procurement-integrity-41-usc-2102 ]
  attributes:
    approach: platform
    role: ai-insights
    parts:
      - An AI model in an environment the agency has approved for acquisition information
      - The agency’s templates, guidance, and current deviations as reference material
      - Drafts with the sources they drew on shown beside them
      - Staff who check, correct, and approve each draft
      - Rules for what may be shared with the model, such as no proposals during a source selection
    strengths:
      - Staff start from a draft instead of a blank page or an old document
      - Drafts can follow the agency’s current templates and deviations
      - Program offices can get help writing clear requirements before they reach the contracting office
    fitsWhen:
      - Writing requirements and plans takes much of the lead time
      - The agency has templates and guidance the model can draw on
    watchFor:
      - Drafts can be wrong or out of date, such as citing rules the overhaul changed, so staff check each one
      - Proposal and source selection information must stay where the Procurement Integrity Act allows
      - The agency’s AI governance may require an impact assessment and a listing in its AI use case inventory first

- id: contract-spend-analytics
  title: Contract and Spend Analytics
  description: "An example architecture: an analytics workspace that brings together the agency’s contract data, obligations, invoices, and evaluation and closeout dates, and shows what the agency buys and from whom, where lead times run long, which competitions draw one offer, and which evaluations and closeouts are overdue."
  sources: [ sam-gov, far ]
  attributes:
    approach: build
    role: ai-insights
    parts:
      - Regular feeds from SAM.gov contract data, the contract writing system, the financial system, and invoicing
      - Views of spending by category, vendor, office, and contract
      - Lead times, competition, and single-offer rates by office and kind of buy
      - Lists of evaluations and closeouts coming due or overdue
      - Small business share against the agency’s goals, through the year
    strengths:
      - Planning starts from what the agency already buys and the contracts it can use
      - Managers see where work is falling behind before it’s overdue
      - The same numbers support the agency’s reports and its own decisions
    fitsWhen:
      - The agency’s contract data is spread across systems
      - Managers ask for the same reports by hand each month
    watchFor:
      - SAM.gov’s data and the agency’s own records can disagree, so which one wins needs deciding
      - Numbers like single-offer rates need context before they become targets
  works_with:
    - contract-writing-system
