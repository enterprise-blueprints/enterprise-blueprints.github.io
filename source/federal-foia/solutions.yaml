# Solutions, in the order the pages show them, each with the links it holds.

- id: foia-north-star
  title: FOIA Program North Star
  description: "The long-term architecture this library recommends for a FOIA program: one FOIA system that carries each request from receipt to release, fed by the national portal, with eDiscovery for large email collections, a FOIA library for proactive releases, and reporting and AI from the same records."
  attributes:
    principles:
      - Each request is one record from receipt to final response, with every letter and decision in it
      - The system keeps FOIA’s clock, with its tracks, working days, pauses, and extensions
      - Requests from FOIA.gov arrive as records, without retyping
      - Records are reviewed and redacted in one place, with each redaction marked with its exemption
      - Records people ask for again and again are posted without waiting for the next request
      - The annual report comes from the system of record, not from spreadsheets
      - AI suggests redactions, and staff decide
    watchFor:
      - Very large email collections still need the agency’s eDiscovery tools alongside the FOIA system
      - Moving open requests from an old system mid-year can disturb the annual report’s counts
  includes:
    - to: agency-sign-on
      note: Staff sign in through the agency, with roles the FOIA office administers.
    - to: national-portal-api
      note: Requests from FOIA.gov arrive in the FOIA system as records.
    - to: foia-library-publishing
      note: Releases go from the FOIA system to the online library, with records requested 3 or more times flagged.
    - to: foia-request-processing
      way: product
      note: A product made for FOIA, so tracks, deadlines, fees, exemptions, and the annual report come built in.
    - to: records-aware-collaboration
      note: Where staff and program offices draft and collaborate, with records and sensitivity labels applied.
    - to: ediscovery-search-review
      note: Searches mailboxes and large collections, and sends what it finds to the FOIA system’s review workspace.
    - to: records-in-business-systems
      way: built-in
      note: The FOIA system keeps each request’s file on its records schedule.
    - to: foia-workload-dashboard
      note: Leaders see the backlog and the oldest requests from the same tracking data.
    - to: ai-review-suggestions
      note: Suggestions in the review workspace, once exemption practice is settled and reviewers trust the tool.
    - to: agency-security-monitoring
      note: The FOIA system sends its logs to the agency, since it holds unredacted records.
  supports: [ public-access-to-agency-records ]
