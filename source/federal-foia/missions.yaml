# Missions, in the order the pages show them, each with the links it holds.

- id: public-access-to-agency-records
  title: FOIA Program
  description: "Give the public access to agency records: post what the law requires without waiting to be asked, answer requests promptly, and release everything the law allows, withholding only what an exemption protects and release would foreseeably harm."
  sources: [ foia-statute, doj-foia-guide ]
  attributes:
    tagline: Public access to agency records
    sector: public-sector
    scope: US-federal-FOIA
    principles:
      - Each request is one record from receipt to final response, with every letter and decision in it
      - The system keeps FOIA’s clock, with its tracks, working days, pauses, and extensions
      - Requests from FOIA.gov arrive as records, without retyping
      - Records are reviewed and redacted in one place, with each redaction marked with its exemption
      - Records people ask for again and again are posted without waiting for the next request
      - The annual report comes from the system of record, not from spreadsheets
      - AI suggests redactions, and staff decide
  seeks:
    - to: requests-answered-on-time
      id: foia-public-access-to-agency-records-seeks-requests-answered-on-time
    - to: backlog-kept-small
      id: foia-public-access-to-agency-records-seeks-backlog-kept-small
    - to: records-released-as-allowed
      id: foia-public-access-to-agency-records-seeks-records-released-as-allowed
    - to: frequently-requested-posted
      id: foia-public-access-to-agency-records-seeks-frequently-requested-posted
    - to: requesters-helped
      id: foia-public-access-to-agency-records-seeks-requesters-helped
    - to: foia-performance-public
      id: foia-public-access-to-agency-records-seeks-foia-performance-public
