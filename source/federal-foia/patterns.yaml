- id: ediscovery-search-review
  title: Email Search with eDiscovery Tools
  description: "An example architecture: the agency’s eDiscovery tools search mailboxes and other collections by people, terms, and dates, set aside duplicates and thread email conversations, and send what’s found to review, with each search recorded."
  sources: [ ogis-search-technology, doj-foia-guide ]
  attributes:
    role: processing
    parts:
      - Searches across mailboxes, chats, and shared files by person, terms, and date range
      - Deduplication and email threading before review
      - A record of each search’s terms, sources, and results
      - Export of the results to the review tool, or review in place
      - Coordination with the IT staff who run the searches
    strengths:
      - Handles large email collections far better than typical FOIA software
      - The search record helps show that the search was adequate
      - Reviewers see each conversation once
    fitsWhen:
      - Many requests ask for email
      - The agency already licenses eDiscovery tools for litigation or investigations
    watchFor:
      - Searches can wait in IT’s queue for a long time
      - For a single known record, asking the person who keeps it is faster
      - Threading and deduplication need checking, since copies still slip through
    ways:
      - id: platform
        approach: platform
        title: The agency’s eDiscovery tools
  works_with:
    - to: foia-request-processing
      note: Sends what it finds to the review workspace or tool.

- id: national-portal-api
  title: Requests from the National Portal by API
  description: "An example architecture: the agency’s FOIA system receives requests submitted on FOIA.gov through the portal’s agency API, so each one arrives as a request record with its fields filled in, instead of as an email to retype."
  sources: [ foia-gov-developer, foia-statute, foia-gov ]
  attributes:
    role: public-facing
    parts:
      - A connection in the agency’s FOIA system that implements the portal’s agency API
      - A mapping from the portal’s fields to the agency’s request record
      - An acknowledgment with the tracking number sent back to the requester
      - Monitoring for requests that fail to arrive
      - The agency’s FOIA.gov contact and component details kept current
    strengths:
      - No retyping, so fewer errors and faster logging
      - Requests reach the right component directly
      - One intake path for portal requests and the agency’s own form
    fitsWhen:
      - The agency has an automated FOIA case system
      - Portal requests arrive by email today
    watchFor:
      - Changes to the portal’s API need following
      - Each component’s routing must match how FOIA.gov lists it
    ways:
      - id: build
        approach: build
        title: A connection to FOIA.gov’s agency API
  works_with:
    - foia-request-processing

- id: foia-library-publishing
  title: FOIA Library Publishing
  description: "An example architecture: released records go from the review tool to the agency’s online FOIA library with a title, date, and request number, in accessible formats, and records requested 3 or more times are flagged for posting."
  sources: [ foia-statute, doj-foia-guide, section-508 ]
  attributes:
    role: public-facing
    parts:
      - A FOIA library section of the agency’s website, with search
      - A publishing step from the review tool that carries each release’s details
      - A check that released files are accessible, such as text-searchable PDFs
      - A list of records requested 3 or more times, from the tracking data
      - A hold on records released to people about themselves, which aren’t for public posting
    strengths:
      - Posting becomes part of closing a request
      - Repeat requests can be answered with a link
    fitsWhen:
      - Releases are posted by hand, if at all
      - Several requesters ask for the same records
    watchFor:
      - Records released to people about themselves must never be posted
      - Making older scanned records accessible takes effort
      - Posted records still follow a records schedule
    ways:
      - id: platform
        approach: platform
        title: The agency’s online FOIA library
  works_with:
    - to: foia-request-processing
      note: Releases come from the review tool with their request details.

- id: ai-review-suggestions
  title: AI Suggestions in Records Review
  description: "An example architecture: the review tool suggests passages that may fall under an exemption, groups near-duplicate records, and flags personal information, and the reviewer decides every redaction and records the exemption that applies."
  sources: [ nist-ai-rmf, doj-foia-guide ]
  attributes:
    role: ai-insights
    parts:
      - Suggested redactions for patterns such as Social Security numbers, phone numbers, and names
      - Passages that may fall under an exemption, each with the reason it was suggested
      - Groups of near-duplicate records and email threads, so one decision applies consistently
      - The reviewer’s decision on every suggestion, with the exemption recorded
      - Checks of how often suggestions are accepted, by kind
    strengths:
      - Reviewers spend less time finding routine personal information
      - Similar records get the same treatment
      - Large releases move faster without lowering the bar for what’s withheld
    fitsWhen:
      - The office reviews large volumes of email and documents
      - Its review tool offers these features, or can add them
    watchFor:
      - Exemptions turn on judgment, including the foreseeable harm standard, so a person decides every withholding
      - Relying on suggestions can lead to withholding more than the law allows
      - Records under review hold sensitive information, so the model must run where the records are allowed to be
    ways:
      - id: product
        approach: product
        title: The review tool’s AI features
  works_with:
    - to: foia-request-processing
      note: Runs in the review workspace or tool, where it’s offered.

- id: foia-workload-dashboard
  title: FOIA Workload Dashboard from Tracking Data
  description: "An example architecture: a dashboard built on the request tracking data that shows the backlog, the oldest open requests, time to respond on each track, and work by team, refreshed daily, so leaders can act long before the annual report."
  sources: [ oip-annual-report-handbook, oip-backlog-guidance ]
  attributes:
    role: ai-insights
    parts:
      - A daily copy of the tracking data in a reporting store
      - Measures defined the way the annual report counts them, such as backlogged requests
      - Views of the backlog, the oldest requests, and response times by track and team
      - Forecasts of incoming requests from past volumes, for planning staff
      - Access for the Chief FOIA Officer, managers, and staff
    strengths:
      - Leaders see the backlog as it grows, not once a year
      - Counts match the annual report, so there are no surprises when it’s due
      - Changes to staffing and process can be checked against results
    fitsWhen:
      - The tracking system’s data can be copied out every day
      - Leaders want to act on the goal of keeping the backlog under 10% during the year
    watchFor:
      - Definitions must match the handbook, or the dashboard and the report will disagree
      - Request details can be sensitive, so dashboards should show counts rather than requesters
    ways:
      - id: build
        approach: build
        title: A dashboard on the tracking data
  works_with:
    - foia-request-processing
