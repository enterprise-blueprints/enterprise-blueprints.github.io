# Implementation patterns, in the order the pages show them, each with the links it holds.

- id: grants-management
  title: Grants Management
  description: "An example architecture: one grants system that carries each award from the funding announcement through applications, merit review, risk checks, award, payments, monitoring, and closeout, with a portal where recipients apply, report, and ask for changes."
  sources: [ uniform-guidance ]
  attributes:
    role: business-applications
    parts:
      - Funding announcements prepared in the system and posted to Grants.gov
      - Applications received from Grants.gov, with eligibility and completeness checks
      - Reviewer assignments, conflict disclosures, and scoring against each notice’s criteria
      - Risk reviews and award documents with standard terms and any specific conditions
      - A recipient portal for reports, change requests, and closeout
      - Monitoring plans, site visit records, and audit findings for each award
      - The award data the agency reports to USAspending.gov
    strengths:
      - One record for each award, from announcement to closeout
      - Recipients have one place to apply, report, and ask for changes
    fitsWhen:
      - The agency runs grant programs with similar steps
      - Its current tools are spreadsheets, email, or an aging custom system
    watchFor:
      - Programs with unusual rules, such as formula awards, may not fit standard steps
      - Moving open awards from an old system mid-stream needs careful planning
      - Connections to the agency’s financial system and payment system often take the most work
    ways:
      - id: product
        approach: product
        title: A grants management product
        description: A product made for grants, configured for the agency’s programs and run by the agency.
        strengths:
          - Built around the Uniform Guidance, so much of the process comes ready
        fitsWhen:
          - The agency runs several grant programs, with staff to administer a system
        watchFor:
          - Another product to buy, secure, and keep up
      - id: shared-service
        approach: product
        title: A federal grants shared service
        description: A grants system another federal agency runs as a shared service, configured for the agency’s programs, under an agreement that sets the service, its costs, and who does what.
        strengths:
          - The provider keeps the system current with federal rules and systems
          - The agency doesn’t buy, host, or secure a system of its own
          - Recipients may already know the system from other agencies’ awards
        fitsWhen:
          - The agency’s grant programs are small or few
          - A shared service already serves programs like the agency’s
        watchFor:
          - Changes for the agency’s programs wait on the provider’s priorities
          - Getting the agency’s data out, for reporting or a later move, needs agreeing up front
          - Costs can grow with the number of awards and users
      - id: agency-platform
        approach: platform
        title: The agency’s shared case platform
        description: Application and award records, their steps, and a recipient portal, built on the agency’s shared case platform.
        strengths:
          - Uses licenses, skills, and security approvals the agency already has
          - Grants work can share a platform with the agency’s other case work
        fitsWhen:
          - The agency already runs a platform like this, with people who configure it
          - Its programs are fairly simple, with few awards each
        watchFor:
          - Merit review, reporting forms, and the recipient portal often take more building than expected
          - Federal reporting, such as to USAspending.gov, has to be built and kept up
          - Rules change with the Uniform Guidance, and someone has to update the platform each time
  depends_on:
    - to: shared-case-platform
      way: agency-platform
      note: The award records and steps are the shared platform, set up for grants.
  works_with:
    - to: grants-gov-system-to-system
      note: Applications arrive from Grants.gov through the system’s connection.
    - to: payments-through-asap
      note: Awards and their amounts feed the payment system’s accounts.
    - to: grant-risk-analytics
      note: Risk scores show in the system’s review and monitoring screens.

