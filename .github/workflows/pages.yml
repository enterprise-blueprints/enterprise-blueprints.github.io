name: Check, build, and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Allow one deployment at a time, but don't cancel one that's in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # lets configure-pages read the Pages settings
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the engine's tags, to check its version against

      # Publishers' sites take the engine by its version, so a version's files never change.
      - name: Check the engine version
        run: node scripts/engine.mjs check

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      # Reads the repository's Pages settings to find the base path:
      # "" for an organization site, "/repo-name" for a project site.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - name: Check links and published data
        run: node scripts/check-dist.mjs dist "$BASE_PATH"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # A version the live site already publishes must come through unchanged.
      - name: Check published versions are unchanged
        run: node scripts/check-published.mjs dist "$SITE_URL"
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://enterprise-blueprints.github.io' }}

      # Also build under a project-site path, so a link that skips href()
      # is caught even though the real site is served from the root.
      - name: Check under a project-site base path
        run: |
          BASE_PATH=/baseurl-check OUT_DIR=dist-subpath pnpm build
          node scripts/check-dist.mjs dist-subpath /baseurl-check

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # Once deployed, the engine's version is tagged engine-v<version>, where the kit's sync finds it.
  tag-engine:
    name: Tag the engine version
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node scripts/engine.mjs tag
